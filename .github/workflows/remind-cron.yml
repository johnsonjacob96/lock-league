name: Pick Reminder (cron)

# Nudges members who have not locked all 5 picks, before the Sunday-noon-CT
# lock. Fires Web Push via /api/notify?type=reminder.
on:
  schedule:
    - cron: "0 15 * * 0"   # Sun 15:00 UTC (~9am CT) — a few hours before lock
    - cron: "0 16 * * 0"   # Sun 16:00 UTC (~10am CT) — second, gentler nudge
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Fire /api/notify
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET secrets must be set"; exit 1
          fi
          curl -fsS -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$SITE_URL/api/notify?type=reminder" | tee response.json
          echo
