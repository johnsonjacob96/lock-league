name: Pick Reminder (cron)

# Nudges members who have not locked all 5 picks, ~1 hour before the Sunday-noon-CT
# lock. Fires Web Push via /api/notify?type=reminder.
#
# Both times run every Sunday; the endpoint's window guard (fires only when the
# lock is <=75 min out) admits exactly the one that is ~1h before the DST-aware
# noon-CT lock and no-ops the other:
#   - CDT (Sept-Oct): lock=17:00 UTC -> 16:00 UTC fires (11am CDT), 17:00 no-ops.
#   - CST (Nov on):   lock=18:00 UTC -> 17:00 UTC fires (11am CST), 16:00 no-ops.
on:
  schedule:
    - cron: "0 16 * * 0"   # Sun 16:00 UTC — 11am CDT (1h before lock, early season)
    - cron: "0 17 * * 0"   # Sun 17:00 UTC — 11am CST (1h before lock, after Nov 1)
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Fire /api/notify
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET secrets must be set"; exit 1
          fi
          curl -fsS -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$SITE_URL/api/notify?type=reminder" | tee response.json
          echo
