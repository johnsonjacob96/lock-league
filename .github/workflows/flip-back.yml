# Saturday flip-back: end of the preseason dry run.
#
# Test mode auto-ends in code at Sat Aug 15 14:00 UTC (PRESEASON_TEST.activeToMs),
# which flips the app back to regular-season Week 1. This job then wipes the
# season-2026 / week-2 TEST picks (so they don't pollute the real regular-season
# week 2) and clears the seeded preseason board. Runs just after the flip; also
# manually dispatchable. Delete this workflow (and preseason-seed.yml) after it
# has run.
name: flip-back

on:
  schedule:
    - cron: "7 14 15 8 *"   # Sat Aug 15 2026, 14:07 UTC (~9:07am CT), just after test mode ends
  workflow_dispatch: {}

jobs:
  wipe:
    runs-on: ubuntu-latest
    steps:
      - name: Wipe preseason-test data
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET secrets must be set"; exit 1
          fi
          curl -fsS -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "$SITE_URL/api/picks?action=wipe-test" | tee out.json
          echo
