# Seed the preseason board from a GitHub runner.
#
# The Cloudflare Worker can't reliably reach ESPN (site.api 403s the colo IP,
# cdn intermittently returns an empty body), and SharpAPI carries no preseason
# games — so during the preseason test the board fell back to a stale
# regular-season snapshot. A GitHub runner CAN reach ESPN, so this job fetches
# the preseason scoreboard and POSTs it to /api/odds?action=seed, which stores it
# as the board (seeded snapshot). Nothing overwrites it during test mode, so it
# persists. Runs every ~30 min through the test window; delete after flip-back.
name: preseason-seed

on:
  schedule:
    - cron: "7,37 * 12-16 8 *"   # every 30 min, Aug 12-16 UTC (off the :00/:30 marks)
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ESPN preseason + seed snapshot
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET secrets must be set"; exit 1
          fi
          node -e '
            (async () => {
              const hosts = [
                "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?year=2026&seasontype=1&week=2",
                "https://cdn.espn.com/core/nfl/scoreboard?xhr=1&year=2026&seasontype=1&week=2",
              ];
              let events = null;
              for (const u of hosts) {
                try {
                  const r = await fetch(u, { headers: { "User-Agent": "Mozilla/5.0" } });
                  if (!r.ok) continue;
                  const d = await r.json();
                  events = Array.isArray(d.events) ? d.events
                    : (d.content && d.content.sbData && d.content.sbData.events);
                  if (events && events.length) break;
                } catch (e) { /* try next host */ }
              }
              if (!events || !events.length) { console.log("no ESPN events"); process.exit(1); }
              const r = await fetch(process.env.SITE_URL + "/api/odds?action=seed", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-Cron-Secret": process.env.CRON_SECRET },
                body: JSON.stringify({ events, source: "espn", season: 2026, week: 2, seasontype: 1 }),
              });
              console.log("seed", r.status, await r.text());
              if (!r.ok) process.exit(1);
            })().catch(e => { console.log("ERR", e.message); process.exit(1); });
          '
