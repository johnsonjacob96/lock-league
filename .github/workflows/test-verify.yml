name: Test Verify (manual)

# Probes the public endpoints and prints results to the run log, so a scheduled
# cloud agent (whose sandbox cannot reach lock-league.pages.dev directly) can
# verify the app by reading this workflow's log via `gh run view --log`.
on:
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public endpoints
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          S="${SITE_URL:-https://lock-league.pages.dev}"
          echo "SITE=$S"
          echo "----- CONFIG -----"
          curl -fsS "$S/api/config" | jq . || echo "config-request-failed"
          echo "----- ODDS -----"
          curl -fsS "$S/api/odds" \
            | jq -r '"source=\(.source) count=\(.games|length)", (.games[:10][] | "\(.kickoff) books=\(.books|keys|join(",")) fdprov=\(.books.fanduel.provider // "none")")' \
            || echo "odds-request-failed"
          echo "----- SCORES -----"
          curl -fsS "$S/api/scores" \
            | jq -r '"count=\(.games|length) week=\(.week) test=\(.test)", (.games[:16][] | "\(.away) @ \(.home) | \(.state) | \(.detail)")' \
            || echo "scores-request-failed"
          echo "----- END -----"
      - name: SharpAPI feed diagnostics (admin debug; spends a few SharpAPI requests)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          S="${SITE_URL:-https://lock-league.pages.dev}"
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set; skipping"; exit 0; fi
          echo "----- PROVIDER BUDGET (read-only) -----"
          curl -sS -m 30 -H "X-Cron-Secret: $CRON_SECRET" "$S/api/odds?debug=budget" | jq . || echo "debug-budget-failed"
          echo "----- BOARD SHARPAPI COST (public board diagnostics) -----"
          curl -sS -m 30 "$S/api/odds" | jq '{source, fetched_at, sharp}' || echo "board-failed"
          echo "----- SHARP MEASUREMENTS (from the prop share, 2 pages each, a minute apart) -----"
          for q in "debug=sharp&priority=props&pages=2" "debug=sharp&priority=props&pages=2&f_is_main_line=true" "debug=sharpevents"; do
            echo ">> $q"
            curl -sS -m 30 -H "X-Cron-Secret: $CRON_SECRET" "$S/api/odds?$q" \
              | jq 'del(.sample[]?.odds?) | {status, url, filters, count, error, stats, byBook, alternates, mainLine, events, pagination, keys, raw, sample: (.sample // [])[:6]}' || echo "measurement-failed"
            sleep 61
          done
          echo "----- PROPS (public) -----"
          curl -sS -m 30 "$S/api/props?game_key=Tampa%20Bay%20Buccaneers%40Dallas%20Cowboys" \
            | jq '{source, reason, stale, complete, markets: (.markets|length), ids: .sharp_event_ids, pages}' || echo "props-failed"
          echo "----- END -----"
