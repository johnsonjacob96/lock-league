# Seed the regular-season ESPN scoreboard from a GitHub runner.
#
# The Cloudflare Worker can't reliably reach ESPN (site.api 403s the colo IP, cdn
# intermittently returns an empty body), which breaks every ESPN-backed read:
# live scores (/api/scores), the War Room live records, and auto-grading. A
# GitHub runner CAN reach ESPN, so this job fetches the current + previous week's
# scoreboard and POSTs it to /api/odds?action=seed, which stores it in the
# scoreboard_snapshot table; fetchScoreboard falls back to it when the live fetch
# fails. Self-tracks the current week through the whole regular season.
#
# The week number is computed the SAME way the app's currentNflWeek() does
# (WEEK1_START_MS + 7-day buckets), so the seed is always stored under exactly
# the (season, week, seasontype) the app looks up. Previous week is seeded too so
# a late Sunday/Monday final is captured for grading before the app rolls over.
name: regular-season-seed

on:
  # Started by the Cloudflare scheduler Worker (cron/src/index.js,
  # githubJobsDue): every 15 minutes while games are on, hourly otherwise,
  # September-February. GitHub's own schedule trigger delivered only a fraction
  # of these runs, so it is not used.
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: regular-season-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seed scoreboard and player boxscores
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/seed-regular-season.mjs
