# Seed the regular-season ESPN scoreboard from a GitHub runner.
#
# The Cloudflare Worker can't reliably reach ESPN (site.api 403s the colo IP, cdn
# intermittently returns an empty body), which breaks every ESPN-backed read:
# live scores (/api/scores), the War Room live records, and auto-grading. A
# GitHub runner CAN reach ESPN, so this job fetches the current + previous week's
# scoreboard and POSTs it to /api/odds?action=seed, which stores it in the
# scoreboard_snapshot table; fetchScoreboard falls back to it when the live fetch
# fails. Same pattern as preseason-seed.yml, but self-tracking the current week
# through the whole regular season.
#
# The week number is computed the SAME way the app's currentNflWeek() does
# (WEEK1_START_MS + 7-day buckets), so the seed is always stored under exactly
# the (season, week, seasontype) the app looks up. Previous week is seeded too so
# a late Sunday/Monday final is captured for grading before the app rolls over.
name: regular-season-seed

on:
  # Times are UTC; GitHub cron is best-effort (can slip 15-30 min). Frequent
  # during live game windows for scores/War Room, hourly otherwise to keep finals
  # and the schedule fresh. Months limited to the NFL season (Sep-Feb).
  schedule:
    - cron: "*/10 0-4 * 9,10,11,12,1,2 5"   # Thu-night games (Fri 00-05 UTC)
    - cron: "*/10 17-23 * 9,10,11,12,1,2 0"  # Sunday afternoon/evening
    - cron: "*/10 0-4 * 9,10,11,12,1,2 1"    # Sunday night -> Mon 00-05 UTC
    - cron: "*/10 0-4 * 9,10,11,12,1,2 2"    # Monday-night games (Tue 00-05 UTC)
    - cron: "0 * * 9,10,11,12,1,2 *"         # hourly heartbeat, every day
  workflow_dispatch: {}

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ESPN regular-season board + seed snapshot
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET secrets must be set"; exit 1
          fi
          node -e '
            (async () => {
              // Mirror functions/_shared/nfl.js currentNflWeek(): Week 1 starts
              // Tue Sep 8 2026 08:00 UTC, 7-day buckets, 18 regular-season weeks.
              const WEEK1_START_MS = Date.UTC(2026, 8, 8, 8);
              const MS_WEEK = 7 * 24 * 3600 * 1000;
              const REGULAR_SEASON_WEEKS = 18;
              const SEASON = 2026, SEASONTYPE = 2;
              const now = Date.now();
              if (now < WEEK1_START_MS) { console.log("offseason — nothing to seed"); return; }
              const idx = Math.floor((now - WEEK1_START_MS) / MS_WEEK);
              if (idx >= REGULAR_SEASON_WEEKS) { console.log("postseason — regular-season seed done"); return; }
              const curWeek = idx + 1;
              // Seed current + previous week (previous captures late finals for grading).
              const weeks = [curWeek];
              if (curWeek > 1) weeks.push(curWeek - 1);

              async function espnEvents(week) {
                const hosts = [
                  `https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?year=${SEASON}&seasontype=${SEASONTYPE}&week=${week}`,
                  `https://cdn.espn.com/core/nfl/scoreboard?xhr=1&year=${SEASON}&seasontype=${SEASONTYPE}&week=${week}`,
                ];
                for (let attempt = 0; attempt < 2; attempt++) {
                  for (const u of hosts) {
                    try {
                      const r = await fetch(u, { headers: { "User-Agent": "Mozilla/5.0" } });
                      if (!r.ok) continue;
                      const d = await r.json();
                      const ev = Array.isArray(d.events) ? d.events
                        : (d.content && d.content.sbData && d.content.sbData.events);
                      if (ev && ev.length) return ev;
                    } catch (e) { /* try next host */ }
                  }
                }
                return null;
              }

              let seeded = 0, failed = 0;
              for (const week of weeks) {
                const events = await espnEvents(week);
                if (!events) { console.log(`week ${week}: no ESPN events`); failed++; continue; }
                const r = await fetch(process.env.SITE_URL + "/api/odds?action=seed", {
                  method: "POST",
                  headers: { "Content-Type": "application/json", "X-Cron-Secret": process.env.CRON_SECRET },
                  body: JSON.stringify({ events, source: "espn", season: SEASON, week, seasontype: SEASONTYPE }),
                });
                console.log(`week ${week}: seed ${r.status} ${(await r.text()).slice(0, 160)}`);
                if (r.ok) seeded++; else failed++;
              }
              // Fail the run only if we seeded nothing (so a single stale week does
              // not red-flag the workflow, but a total outage is visible).
              if (seeded === 0) process.exit(1);
            })().catch(e => { console.log("ERR", e.message); process.exit(1); });
          '
