# Independent-network backup for the primary Cloudflare scoreboard refresh.
# Both runtimes share functions/_shared/scoreboard-refresh.js. Keep this
# schedule: ESPN can block one network while remaining reachable from another.
# GitHub timing is best-effort; app grading/notifications use Cloudflare.
name: regular-season-seed

on:
  # Times are UTC; GitHub cron is best-effort (can slip 15-30 min). Frequent
  # during live game windows for scores/War Room, hourly otherwise to keep finals
  # and the schedule fresh. Months limited to the NFL season (Sep-Feb).
  schedule:
    - cron: "*/10 0-4 * 9,10,11,12,1,2 4,5"   # Wednesday opener + Thursday games (Thu/Fri UTC)
    - cron: "*/10 17-23 * 9,10,11,12,1,2 0"  # Sunday afternoon/evening
    - cron: "*/10 0-4 * 9,10,11,12,1,2 1"    # Sunday night -> Mon 00-05 UTC
    - cron: "*/10 0-4 * 9,10,11,12,1,2 2"    # Monday-night games (Tue 00-05 UTC)
    - cron: "0 * * 9,10,11,12,1,2 *"         # hourly heartbeat, every day
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: regular-season-seed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Seed scoreboard and player boxscores
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/seed-regular-season.mjs
