name: Grade Picks (cron)

# Replaces the 4 Netlify scheduled functions. Fires curl at /api/grade
# at the same UTC times as the originals.
on:
  schedule:
    - cron: "30 5 * * 5"   # Fri 05:30 UTC — catch Thursday Night Football
    - cron: "0 22 * * 0"   # Sun 22:00 UTC — catch Sun early slate
    - cron: "30 1 * * 1"   # Mon 01:30 UTC — catch Sun late slate
    - cron: "30 5 * * 1"   # Mon 05:30 UTC — catch Sunday Night Football
    - cron: "0 9 * * 2"    # Tue 09:00 UTC — catch Monday Night Football
  workflow_dispatch: {}    # allow manual fire from the Actions tab

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Fire /api/grade
        env:
          SITE_URL: ${{ secrets.SITE_URL }}        # e.g. https://lock-league.pages.dev
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET secrets must be set"; exit 1
          fi
          curl -fsS -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$SITE_URL/api/grade" | tee response.json
          echo
          echo "Exit code: $?"
