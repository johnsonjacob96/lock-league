name: Grade Picks (manual)

# Manual "grade now" button (Actions tab -> Run workflow). Grading and the
# Tuesday week close run on the Cloudflare scheduler: every 15-minute
# /api/notify tick calls scheduledGrade(). The GitHub schedule this used to
# have delivered runs late or not at all (week 4's Tuesday 09:00 UTC run had
# not fired by 14:00 UTC), so it is gone.
on:
  workflow_dispatch: {}    # allow manual fire from the Actions tab

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Fire /api/grade
        env:
          SITE_URL: ${{ secrets.SITE_URL }}        # e.g. https://lock-league.pages.dev
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET secrets must be set"; exit 1
          fi
          curl -fsS -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            "$SITE_URL/api/grade" | tee response.json
          echo
          echo "Exit code: $?"
