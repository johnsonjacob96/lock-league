<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LOCK LEAGUE // 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --bg-1: #060806;
    --bg-2: #0a0e0a;
    --bg-card: #0d130d;
    --green: #2cd962;          /* DK lime, slightly hotter */
    --green-bright: #54ff7c;
    --green-dim: #0e6630;
    --green-glow: rgba(44,217,98,0.45);
    --green-ghost: rgba(44,217,98,0.12);
    --red: #ff2e3a;
    --red-glow: rgba(255,46,58,0.4);
    --red-ghost: rgba(255,46,58,0.12);
    --yellow: #f5d300;
    --yellow-ghost: rgba(245,211,0,0.14);
    --white: #ffffff;
    --line: rgba(255,255,255,0.08);
    --line-green: rgba(44,217,98,0.32);
    --line-strong: rgba(44,217,98,0.6);
    --dim: #6b7468;
    --dim-2: #3b4239;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    color: var(--white);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    /* Subtle vertical scan + corner radial */
    background:
      radial-gradient(ellipse at 0% 0%, rgba(44,217,98,0.06) 0%, transparent 38%),
      radial-gradient(ellipse at 100% 0%, rgba(44,217,98,0.04) 0%, transparent 42%),
      linear-gradient(180deg, #000 0%, #050605 100%);
    background-attachment: fixed;
  }
  body::before {
    /* Faint horizontal scanline overlay */
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
    pointer-events: none; z-index: 1;
  }

  .mono { font-family: 'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums; }
  .display { font-family: 'Anton', sans-serif; letter-spacing: 0.01em; text-transform: uppercase; }

  /* ============== Top diagonal stripe ============== */
  .stripe {
    height: 6px;
    background: repeating-linear-gradient(
      90deg,
      var(--green) 0px,
      var(--green) 18px,
      transparent 18px,
      transparent 22px,
      var(--green) 22px,
      var(--green) 24px,
      transparent 24px,
      transparent 32px
    );
    position: relative;
    z-index: 3;
  }

  /* ============== Ticker ============== */
  .ticker {
    position: relative;
    height: 42px;
    background: var(--bg-1);
    border-top: 1px solid var(--line-green);
    border-bottom: 1px solid var(--line-green);
    overflow: hidden;
    z-index: 4;
    display: flex;
    align-items: center;
  }
  .ticker-label {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    z-index: 3;
    background: var(--green);
    color: #000;
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.2em;
    box-shadow: 0 0 18px var(--green-glow);
    clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
    padding-right: 28px;
  }
  .ticker-label .dot {
    width: 6px; height: 6px;
    background: #000; border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .ticker-week-pill {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    z-index: 3;
    background: #000;
    border-left: 1px solid var(--line-green);
    padding: 0 16px 0 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    clip-path: polygon(14px 0, 100% 0, 100% 100%, 0 100%);
  }
  .ticker-week-pill select {
    background: transparent;
    color: var(--green);
    border: 1px solid var(--line-green);
    padding: 3px 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    cursor: pointer;
    outline: none;
  }
  .ticker-viewport {
    flex: 1;
    overflow: hidden;
    height: 100%;
    margin-left: 130px;
    margin-right: 140px;
    position: relative;
  }
  .ticker-viewport::before, .ticker-viewport::after {
    content: "";
    position: absolute; top: 0; bottom: 0; width: 60px; z-index: 2;
    pointer-events: none;
  }
  .ticker-viewport::before { left: 0; background: linear-gradient(90deg, var(--bg-1) 0%, transparent 100%); }
  .ticker-viewport::after { right: 0; background: linear-gradient(-90deg, var(--bg-1) 0%, transparent 100%); }
  .ticker-track {
    display: inline-flex;
    width: max-content;
    align-items: center;
    height: 100%;
    white-space: nowrap;
    animation: ticker-scroll 120s linear infinite;
    will-change: transform;
  }
  .ticker:hover .ticker-track { animation-play-state: paused; }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .tk-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 0 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--white);
    flex-shrink: 0;
    flex-grow: 0;
  }
  .tk-wk { color: var(--dim); font-weight: 600; letter-spacing: 0.08em; font-size: 10px; }
  .tk-name {
    font-family: 'Anton', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--white);
  }
  .tk-type { color: var(--green); font-size: 10px; letter-spacing: 0.16em; font-weight: 700; text-transform: uppercase; }
  .tk-type.dog { color: var(--green-bright); }
  .tk-type.over, .tk-type.under { color: #ffa83c; }
  .tk-type.super { color: var(--yellow); }
  .tk-pick { font-weight: 500; }
  .tk-res {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px; height: 16px;
    font-size: 10px;
    font-weight: 800;
    font-family: 'IBM Plex Mono', monospace;
  }
  .tk-res.W { background: var(--green); color: #000; }
  .tk-res.L { background: var(--red); color: #fff; }
  .tk-res.P { background: var(--yellow); color: #000; }
  .tk-sep {
    color: var(--green);
    font-weight: 700;
    padding: 0 4px;
    opacity: 0.5;
  }

  /* ============== Header ============== */
  header.topbar {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(0,0,0,0.95);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line-green);
  }
  .topbar-inner {
    max-width: 1320px;
    margin: 0 auto;
    padding: 14px 28px;
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 40px; height: 40px;
    color: var(--green);
    display: grid; place-items: center;
    filter: drop-shadow(0 0 10px var(--green-glow));
  }
  .brand-mark svg { width: 100%; height: 100%; display: block; }
  .brand-mark:hover svg { animation: lock-jiggle 0.5s cubic-bezier(.36,.07,.19,.97); }
  @keyframes lock-jiggle {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-4deg); }
    40% { transform: rotate(4deg); }
    60% { transform: rotate(-3deg); }
    80% { transform: rotate(2deg); }
  }
  .brand-name { display: flex; flex-direction: column; line-height: 0.9; }
  .brand-name .l1 {
    font-family: 'Anton', sans-serif;
    font-size: 19px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .brand-name .l2 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--green);
    letter-spacing: 0.22em;
    margin-top: 4px;
    font-weight: 600;
  }
  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px 4px 7px;
    border: 1px solid var(--line-strong);
    background: rgba(44,217,98,0.05);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: var(--green);
    font-weight: 700;
  }
  .live-dot {
    width: 6px; height: 6px;
    background: var(--green); border-radius: 50%;
    box-shadow: 0 0 8px var(--green-glow);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  nav.year-tabs { display: flex; gap: 0; margin-left: auto; }
  .year-tab {
    background: transparent;
    border: 1px solid var(--line);
    border-right: none;
    color: var(--dim);
    padding: 9px 16px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.14em;
    transition: all 0.12s ease;
  }
  .year-tab:hover { color: var(--white); border-color: var(--line-green); }
  .year-tab:last-child { border-right: 1px solid var(--line); }
  .year-tab.active {
    background: var(--green);
    color: #000;
    border-color: var(--green);
    box-shadow: 0 0 18px rgba(44,217,98,0.35);
  }
  .nav-links { display: flex; gap: 4px; margin-left: 14px; }
  .nav-link {
    background: transparent;
    border: 1px solid transparent;
    color: var(--dim);
    padding: 9px 12px;
    cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .nav-link:hover { color: var(--white); }
  .nav-link.active { color: var(--green); }
  .nav-link.active::before { content: "// "; color: var(--green); }

  /* ============== Layout ============== */
  main {
    max-width: 1320px;
    margin: 0 auto;
    padding: 38px 28px 96px;
    position: relative;
    z-index: 2;
  }

  /* ============== Championship Card ============== */
  .champ-card {
    position: relative;
    border: 1px solid var(--line-green);
    background:
      linear-gradient(135deg, rgba(44,217,98,0.08) 0%, transparent 55%),
      linear-gradient(45deg, transparent 55%, rgba(44,217,98,0.04) 100%),
      var(--bg-1);
    margin-bottom: 28px;
    overflow: hidden;
  }
  .champ-card::before, .champ-card::after {
    content: "";
    position: absolute;
    width: 12px; height: 12px;
    border: 2px solid var(--green);
    box-shadow: 0 0 10px var(--green-glow);
  }
  .champ-card::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  .champ-card::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  .champ-bar {
    height: 4px;
    background: var(--green);
    box-shadow: 0 0 14px var(--green-glow);
  }
  .champ-body {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 36px;
    padding: 24px 30px 22px;
    align-items: end;
  }
  .champ-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 30px;
    border-bottom: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .champ-meta .green-strong { color: var(--green); font-weight: 700; }
  .champ-meta .right { display: flex; gap: 18px; align-items: center; }
  .champ-meta .right .live-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px var(--green-glow);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .champ-left { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .champ-rank-line {
    display: flex; align-items: baseline; gap: 14px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--dim);
    font-weight: 600;
    text-transform: uppercase;
  }
  .champ-rank-num {
    font-family: 'Anton', sans-serif;
    font-size: 38px;
    color: var(--green);
    line-height: 1;
    letter-spacing: -0.005em;
  }
  .champ-name {
    font-family: 'Anton', sans-serif;
    font-size: clamp(44px, 7.2vw, 96px);
    line-height: 0.86;
    letter-spacing: -0.005em;
    text-transform: uppercase;
    color: var(--white);
  }
  .champ-tags {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-top: 4px;
  }
  .champ-prize {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 11px;
    background: var(--green);
    color: #000;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.16em;
  }
  .champ-prize .v { font-family: 'Anton', sans-serif; font-size: 17px; letter-spacing: 0.02em; font-weight: 400; }
  .champ-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 5px 10px;
    border: 1px solid var(--line-green);
    color: var(--green);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.16em;
  }

  .champ-stats {
    display: grid;
    grid-template-columns: repeat(2, minmax(128px, 1fr));
    gap: 1px;
    background: var(--line-green);
    border: 1px solid var(--line-green);
    min-width: 280px;
  }
  .champ-stat {
    background: #000;
    padding: 13px 16px 12px;
    position: relative;
  }
  .champ-stat .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8.5px;
    color: var(--dim);
    letter-spacing: 0.2em;
    font-weight: 700;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  /* Single-value (e.g., "6") stays display caps */
  .champ-stat .v {
    font-family: 'Anton', sans-serif;
    font-size: 30px;
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--white);
    text-transform: uppercase;
  }
  .champ-stat .v.green { color: var(--green); }
  /* Compound record values (W-L-P) use mono so the L doesn't look squished */
  .champ-stat .v.rec {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    text-transform: none;
  }
  .champ-stat .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    color: var(--dim);
    margin-top: 5px;
    letter-spacing: 0.06em;
  }

  /* ============== Hero (other views) ============== */
  .hero {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 32px;
    align-items: end;
    padding-bottom: 28px;
    margin-bottom: 32px;
    border-bottom: 1px solid var(--line-green);
    position: relative;
  }
  .hero::after {
    content: "";
    position: absolute;
    left: 0; bottom: -1px;
    width: 120px; height: 3px;
    background: var(--green);
    box-shadow: 0 0 14px var(--green-glow);
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--green);
    letter-spacing: 0.32em;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .eyebrow::before {
    content: ""; width: 26px; height: 2px; background: var(--green);
  }
  .hero-title {
    font-family: 'Anton', sans-serif;
    font-size: clamp(56px, 9vw, 124px);
    line-height: 0.86;
    letter-spacing: -0.005em;
    text-transform: uppercase;
  }
  .hero-title .name { color: var(--white); }
  .hero-title .wreath { color: var(--green); }
  .hero-title .crown {
    display: inline-block;
    margin-left: 10px;
    color: var(--yellow);
    font-size: 0.5em;
    transform: translateY(-0.5em);
  }
  .hero-stats {
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: 28px;
    align-items: end;
  }
  .hstat { text-align: right; }
  .hstat-l {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .hstat-v {
    font-family: 'Anton', sans-serif;
    font-size: 38px;
    color: var(--white);
    letter-spacing: 0.02em;
    line-height: 1;
  }
  .hstat-v.green { color: var(--green); }

  /* ============== Section header ============== */
  .section-h {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin: 44px 0 18px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .section-h::after {
    content: "";
    position: absolute; left: 0; bottom: -1px;
    width: 48px; height: 2px;
    background: var(--green);
  }
  .section-h h2 {
    font-family: 'Anton', sans-serif;
    font-size: 24px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .section-h h2::before {
    content: "// "; color: var(--green); font-weight: 400;
  }
  .section-h .section-note {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  /* ============== Standings table ============== */
  .standings-wrap {
    border: 1px solid var(--line-green);
    background: var(--bg-1);
    position: relative;
  }
  .standings-wrap::before,
  .standings-wrap::after {
    content: "";
    position: absolute;
    width: 12px; height: 12px;
    border: 2px solid var(--green);
  }
  .standings-wrap::before {
    top: -1px; left: -1px;
    border-right: none; border-bottom: none;
  }
  .standings-wrap::after {
    bottom: -1px; right: -1px;
    border-left: none; border-top: none;
  }

  .standings {
    width: 100%;
    border-collapse: collapse;
  }
  .standings thead th {
    text-align: left;
    padding: 12px 18px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--dim);
    font-weight: 700;
    background: var(--bg-2);
    border-bottom: 1px solid var(--line-green);
  }
  .standings thead th.center { text-align: center; }
  .standings thead th.right { text-align: right; }

  .member-row {
    cursor: pointer;
    transition: background 0.1s ease;
    position: relative;
  }
  .member-row > td {
    padding: 18px 18px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  .member-row:hover {
    background: rgba(44,217,98,0.04);
  }
  .member-row.expanded {
    background: rgba(44,217,98,0.06);
  }
  .member-row.expanded > td:first-child::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--green);
    box-shadow: 0 0 14px var(--green-glow);
  }

  .rank-block {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--dim-2);
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .rank-block.top { color: var(--green); }
  .rank-block .br { color: var(--dim-2); }

  .member-name-cell {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .member-name {
    font-family: 'Anton', sans-serif;
    font-size: 26px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1;
  }
  .member-crown {
    color: var(--yellow);
    font-size: 12px;
    letter-spacing: 0.2em;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
  }

  .record-stack { display: flex; align-items: baseline; gap: 10px; }
  .record-big {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--white);
  }
  .record-big .w { color: var(--green); }
  .record-big .sep { color: var(--dim-2); padding: 0 1px; }
  .record-big .l { color: var(--red); }
  .record-big .t { color: var(--yellow); }
  .record-pct {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    font-weight: 500;
  }

  /* Heat strip */
  .heat-strip {
    display: flex;
    gap: 3px;
    align-items: center;
    justify-content: center;
  }
  .heat-week {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .heat-cell {
    width: 11px; height: 4px;
    background: rgba(255,255,255,0.05);

  .ww-cell {

  }

  .super-cell {

  }
  .super-cell .key { color: var(--green); margin-right: 6px; font-size: 11px; letter-spacing: 0.1em; }

  .chev {

  }

  /* ============== Member detail panel ============== */
  .detail-row { display: none; }

  .detail-cell {

  .bet-grid-head {

    font-size: 9px;

  .bet-row {

  .bet-row:last-child { border-bottom: none; }

  .bet-name.super { color: var(--green); }

  .week-cells {

  .week-cell-label {

  .bet-grid-weeklabel {

  .bet-grid-weeklabel > div {

  .detail-foot {

  /* ============== Tooltip ============== */
  .tooltip {

  /* ============== Weekly winners ============== */
  .winners-grid {

  .winner-card .wk {

  .lt-grid {

  .lt-name {
    font-family: 'Anton', sans-serif;

  }
  .lt-record {

  }
  .lt-record .w { color: var(--green); }
  .lt-record .l { color: var(--red); }

  .lt-pct {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    margin-top: 4px;
  }
  .lt-pct .pctv { color: var(--white); font-weight: 600; }
  .lt-break { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
  .lt-row {
    display: grid;
    grid-template-columns: 1fr auto 90px;
    gap: 10px;
    align-items: center;

  }
  .lt-bt { font-family: 'IBM Plex Mono', monospace; color: var(--dim); letter-spacing: 0.06em; text-transform: uppercase; font-size: 10px; }
  .lt-bt.super { color: var(--green); font-weight: 700; }
  .lt-r { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 700; }
  .lt-r .w { color: var(--green); }
  .lt-r .l { color: var(--red); }
  .lt-r .sep { color: var(--dim-2); }
  .lt-bar { height: 4px; background: rgba(255,255,255,0.05); display: flex; }
  .lt-bar-w { background: var(--green); height: 100%; }
  .lt-bar-l { background: var(--red); height: 100%; }
  .lt-bar-p { background: var(--yellow); height: 100%; }

  /* ============== Rules ============== */
  .rules-list { display: flex; flex-direction: column; gap: 0; }
  .rule {
    display: grid;
    grid-template-columns: 56px 1fr 160px;
    gap: 20px;
    padding: 18px 20px;
    border: 1px solid var(--line);
    border-bottom: none;
    background: var(--bg-1);
    align-items: start;
  }
  .rule:last-child { border-bottom: 1px solid var(--line); }
  .rule:hover { background: var(--bg-2); border-color: var(--line-green); }
  .rule-num {
    font-family: 'Anton', sans-serif;
    font-size: 28px;
    color: var(--green);
    line-height: 1;
  }
  .rule-text { font-size: 13px; line-height: 1.6; }
  .rule-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: right;
  }
  .rule-meta::before { content: "AMENDED "; color: var(--green); margin-right: 4px; }

  /* ============== Animations ============== */
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .member-row { animation: slideIn 0.35s cubic-bezier(.2,.7,.2,1) both; }
  .member-row:nth-child(1) { animation-delay: 0.02s; }
  .member-row:nth-child(3) { animation-delay: 0.06s; }
  .member-row:nth-child(5) { animation-delay: 0.1s; }
  .member-row:nth-child(7) { animation-delay: 0.14s; }
  .member-row:nth-child(9) { animation-delay: 0.18s; }
  .member-row:nth-child(11) { animation-delay: 0.22s; }
  .member-row:nth-child(13) { animation-delay: 0.26s; }
  .member-row:nth-child(15) { animation-delay: 0.30s; }
  .winner-card, .lt-card, .rule { animation: slideIn 0.4s cubic-bezier(.2,.7,.2,1) both; }

  /* ============== Responsive ============== */
  @media (max-width: 980px) {
    .champ-body { grid-template-columns: 1fr; gap: 28px; padding: 28px 22px 26px; }

    .champ-meta .right span:not(.live-dot) { display: none; }
    .ticker-label { font-size: 9px; padding: 0 10px 0 10px; padding-right: 22px; }
    .ticker-week-pill { padding: 0 10px 0 18px; font-size: 9px; }
    .ticker-viewport { margin-left: 100px; margin-right: 110px; }
    .topbar-inner { padding: 12px 16px; gap: 14px; flex-wrap: wrap; }
    .nav-links { width: 100%; order: 99; }
    nav.year-tabs { margin-left: 0; }
    .hero { grid-template-columns: 1fr; gap: 24px; }
    .hero-stats { justify-content: flex-start; }

    main { padding: 26px 16px 60px; }
    .standings thead th { padding: 9px 10px; font-size: 8px; }

    .bet-grid-head, .bet-row { grid-template-columns: 100px 80px 1fr; gap: 10px; }

    .rule { grid-template-columns: 40px 1fr; gap: 14px; padding: 14px 14px; }
    .rule-meta { grid-column: 2; text-align: left; margin-top: 6px; }

  @media (max-width: 600px) {
    .brand-name .l2 { display: none; }
    .ww-col { display: none; }
    .live-pill { display: none; }

</style>
</head>
<body>

<div class="stripe"></div>

<div class="ticker" id="ticker">
  <div class="ticker-label"><span class="dot"></span>LIVE LINES</div>
  <div class="ticker-viewport">
    <div class="ticker-track" id="ticker-track"></div>
  </div>
  <div class="ticker-week-pill">
    <span>WK</span>
    <select id="ticker-week-select"></select>
  </div>
</div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="2 6 36 32" xmlns="http://www.w3.org/2000/svg" aria-label="Lock League">
          <path d="M14 20 V11 H26 V20" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="miter" stroke-linecap="square"/>
          <rect x="6" y="20" width="28" height="16" fill="currentColor"/>
          <rect x="10" y="23" width="3" height="10" fill="#000"/>
          <rect x="10" y="30" width="8" height="3" fill="#000"/>
          <rect x="22" y="23" width="3" height="10" fill="#000"/>
          <rect x="22" y="30" width="8" height="3" fill="#000"/>
        </svg>
      </div>
      <div class="brand-name">
        <span class="l1">Lock League</span>
        <span class="l2">EST · 2023</span>
      </div>
    </div>
    <span class="live-pill"><span class="live-dot"></span>SEASON · FINAL</span>
    <div class="nav-links">
      <button class="nav-link" data-view="standings">Standings</button>
      <button class="nav-link" data-view="lifetime">Lifetime</button>
      <button class="nav-link" data-view="rules">Rules</button>
    </div>
    <nav class="year-tabs" id="year-tabs"></nav>
  </div>
</header>

<main id="root"></main>

<div class="tooltip" id="tooltip"></div>

<script>
const DATA_URL = `data/seasons.json?v=${Date.now()}`;
const SEASONS_ORDER = ["2023", "2024", "2025"];
const BET_TYPES_ORDER = ["Favorite", "Dog", "Over", "Under", "Super Lock"];
const WEEK_COUNT = 18;

let DATA = null;
let state = { view: "standings", season: "2025", expanded: null, tickerWeek: "ALL" };

function parseRecord(rec) {
  if (!rec) return { w: 0, l: 0, t: 0 };
  const m = String(rec).match(/^(\d+)-(\d+)(?:-(\d+))?/);
  if (!m) return { w: 0, l: 0, t: 0 };
  return { w: +m[1], l: +m[2], t: m[3] ? +m[3] : 0 };
}
function pct(rec) {
  const total = rec.w + rec.l;
  if (!total) return "—";
  return (rec.w / total * 100).toFixed(1);
}
function recordHtml(rec) {
  return `<span class="w">${rec.w}</span><span class="sep">·</span><span class="l">${rec.l}</span>${rec.t ? `<span class="sep">·</span><span class="t">${rec.t}</span>` : ""}`;
}
function recordHtmlFromString(s) {
  return recordHtml(parseRecord(s));
}

function buildStandings(season) {
  const seasonInfo = DATA.seasons[season];
  if (!seasonInfo) return [];
  const rows = [];
  for (const name of seasonInfo.members) {
    const md = DATA.members[name]?.[season];
    if (!md) continue;
    const seasonRec = parseRecord(md.seasonRecord);
    let weeksWon = 0;
    for (let w = 1; w <= WEEK_COUNT; w++) {
      if (seasonInfo.weeklyWinners?.[String(w)] === name) weeksWon++;
    }
    const superRec = parseRecord(md.byType?.["Super Lock"]?.record);
    rows.push({ name, md, seasonRec, weeksWon, superRec });
  }
  rows.sort((a, b) => {
    if (b.seasonRec.w !== a.seasonRec.w) return b.seasonRec.w - a.seasonRec.w;
    if (a.seasonRec.l !== b.seasonRec.l) return a.seasonRec.l - b.seasonRec.l;
    return b.weeksWon - a.weeksWon;
  });
  return rows;
}

// --- Ticker ---
function buildTickerItems(season, weekFilter) {
  // weekFilter: "ALL" or a week number (string)
  const items = [];
  const seasonInfo = DATA.seasons[season];
  if (!seasonInfo) return items;
  const weeks = weekFilter === "ALL"
    ? Array.from({ length: WEEK_COUNT }, (_, i) => i + 1)
    : [parseInt(weekFilter, 10)];

  for (const wk of weeks) {
    for (const name of seasonInfo.members) {
      const md = DATA.members[name]?.[season];
      if (!md) continue;
      for (const bt of BET_TYPES_ORDER) {
        const pick = md.byType?.[bt]?.picks?.[String(wk)] || md.byType?.[bt]?.picks?.[wk];
        if (!pick || (!pick.text && !pick.result)) continue;
        items.push({ wk, name, bt, text: pick.text || "—", result: pick.result || "" });
      }
    }
  }
  return items;
}

function btShort(bt) {
  return ({ "Favorite": "FAV", "Dog": "DOG", "Over": "OVR", "Under": "UND", "Super Lock": "SUPER 🔒" })[bt] || bt;
}
function btClass(bt) {
  return ({ "Favorite": "fav", "Dog": "dog", "Over": "over", "Under": "under", "Super Lock": "super" })[bt] || "";
}

function renderTickerItem(it) {
  const safe = escapeHtml(it.text);
  return `<span class="tk-item">
    <span class="tk-wk">WK${String(it.wk).padStart(2,"0")}</span>
    <span class="tk-name">${it.name}</span>
    <span class="tk-type ${btClass(it.bt)}">${btShort(it.bt)}</span>
    <span class="tk-pick">${safe}</span>
    ${it.result ? `<span class="tk-res ${it.result}">${it.result}</span>` : ""}
    <span class="tk-sep">◆</span>
  </span>`;
}

function renderTicker() {
  const track = document.getElementById("ticker-track");
  const items = buildTickerItems(state.season, state.tickerWeek);

  if (!items.length) {
    track.innerHTML = `<span class="tk-item"><span class="tk-wk">NO PICKS</span></span>`;
    return;
  }
  // Render twice for seamless loop
  const html = items.map(renderTickerItem).join("");
  track.innerHTML = html + html;
  // Scroll speed: slower for full-season cycle, single-week ~4x slower than before
  const seconds = state.tickerWeek === "ALL"
    ? Math.max(75, items.length * 3.0)
    : Math.max(100, items.length * 2.5);
  track.style.animationDuration = seconds + "s";
}

function renderTickerWeekSelect() {
  const sel = document.getElementById("ticker-week-select");
  sel.innerHTML = `<option value="ALL">ALL</option>` +
    Array.from({ length: WEEK_COUNT }, (_, i) => {
      const w = i + 1;
      return `<option value="${w}" ${String(w) === state.tickerWeek ? "selected" : ""}>${String(w).padStart(2,"0")}</option>`;
    }).join("");
  sel.value = state.tickerWeek;
  sel.onchange = () => { state.tickerWeek = sel.value; renderTicker(); };
}

function renderYearTabs() {
  const el = document.getElementById("year-tabs");
  el.innerHTML = "";
  for (const y of SEASONS_ORDER) {
    const btn = document.createElement("button");
    btn.className = "year-tab" + (state.season === y && state.view === "standings" ? " active" : "");
    btn.textContent = y;
    btn.onclick = () => { state.season = y; state.view = "standings"; state.expanded = null; render(); };
    el.appendChild(btn);
  }
  document.querySelectorAll(".nav-link").forEach(b => {
    b.classList.toggle("active", b.dataset.view === state.view);
  });
}

function renderStandings() {
  const season = state.season;
  const rows = buildStandings(season);
  const seasonInfo = DATA.seasons[season];
  const winners = seasonInfo?.weeklyWinners || {};
  const leagueW = rows.reduce((s, r) => s + r.seasonRec.w, 0);
  const leagueL = rows.reduce((s, r) => s + r.seasonRec.l, 0);
  const leagueT = rows.reduce((s, r) => s + r.seasonRec.t, 0);
  const champ = rows[0];

  // Champion stats (all winner-specific)
  const champPct = champ ? pct(champ.seasonRec) : "—";
  const champSuper = champ ? parseRecord(champ.md?.byType?.["Super Lock"]?.record) : { w: 0, l: 0, t: 0 };
  // Best bet category for the champion
  let bestBt = null, bestPct = -1, bestRec = { w: 0, l: 0, t: 0 };
  if (champ) {
    for (const bt of BET_TYPES_ORDER) {
      const r = parseRecord(champ.md?.byType?.[bt]?.record);
      const tot = r.w + r.l;
      if (!tot) continue;
      const p = r.w / tot;
      if (p > bestPct) { bestPct = p; bestBt = bt; bestRec = r; }
    }
  }
  const bestBtLabel = bestBt === "Super Lock" ? "SUPER 🔒" : (bestBt ? bestBt.toUpperCase() : "—");

  return `
    <div class="champ-card">
      <div class="champ-bar"></div>
      <div class="champ-meta">
        <div><span class="green-strong">${season} CHAMPION</span></div>
        <div class="right">
          <span><span class="live-dot"></span>FINALIZED · ${WEEK_COUNT} WEEKS · ${rows.length} BETTORS</span>
        </div>
      </div>
      <div class="champ-body">
        <div class="champ-left">
          <div class="champ-rank-line">
            <span class="champ-rank-num">01</span>
            <span>★ SEASON CHAMPION</span>
          </div>
          <div class="champ-name">${champ ? champ.name : "—"}</div>
          <div class="champ-tags">
            <span class="champ-prize">1ST <span class="v">$500</span></span>
          </div>
        </div>
        <div class="champ-stats">
          <div class="champ-stat">
            <div class="stat-label">Season Record</div>
            <div class="v rec">${champ ? recordHtml(champ.seasonRec) : "—"}</div>
            <div class="sub">${champPct}% win rate</div>
          </div>
          <div class="champ-stat">
            <div class="stat-label">Weeks Won</div>
            <div class="v green">${champ ? champ.weeksWon : 0}</div>
            <div class="sub">of ${WEEK_COUNT}</div>
          </div>
          <div class="champ-stat">
            <div class="stat-label">Super 🔒</div>
            <div class="v rec">${recordHtml(champSuper)}</div>
            <div class="sub">${champSuper.w + champSuper.l ? (champSuper.w/(champSuper.w+champSuper.l)*100).toFixed(0) + "% hit rate" : "—"}</div>
          </div>
          <div class="champ-stat">
            <div class="stat-label">Best Category</div>
            <div class="v green" style="font-size: 22px;">${bestBtLabel}</div>
            <div class="sub">${bestBt ? `${bestRec.w}-${bestRec.l} · ${(bestPct*100).toFixed(0)}%` : "—"}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="section-h">
      <h2>Standings</h2>
      <span class="section-note">CLICK ROW · EXPAND PICKS</span>
    </div>

    <div class="standings-wrap">
      <table class="standings">
        <thead>
          <tr>
            <th style="width:50px;">#</th>
            <th>Member</th>
            <th style="width:160px;">Season Record</th>
            <th class="center heat-col" style="width:260px;">Weekly Heat (W·L·P)</th>
            <th class="center ww-col" style="width:90px;">Weeks Won</th>
            <th class="right super-col" style="width:140px;">Super 🔒</th>
            <th style="width:30px;"></th>
          </tr>
        </thead>
        <tbody>
          ${rows.map((r, i) => renderMemberRow(r, i, season)).join("")}
        </tbody>
      </table>
    </div>

    <div class="section-h">
      <h2>Weekly Winners</h2>
      <span class="section-note">${season} · WEEK-BY-WEEK</span>
    </div>
    <div class="winners-grid">
      ${Array.from({ length: WEEK_COUNT }, (_, i) => {
        const wk = i + 1;
        const who = winners[String(wk)];
        return `<div class="winner-card ${who ? "" : "empty"}">
          <div class="wk">WK ${String(wk).padStart(2,"0")}</div>
          <div class="who">${who || "—"}</div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function renderMemberRow(r, i, season) {
  const isExp = state.expanded === r.name;
  const isTop = i < 3;
  const rankNum = String(i + 1).padStart(2, "0");
  const heat = Array.from({ length: WEEK_COUNT }, (_, w) => {
    const wk = w + 1;
    return `<div class="heat-week">${BET_TYPES_ORDER.map(bt => {
      const pick = r.md?.byType?.[bt]?.picks?.[wk];
      const cls = pick?.result || "";
      return `<div class="heat-cell ${cls}"></div>`;
    }).join("")}</div>`;
  }).join("");

  return `
    <tr class="member-row ${isExp ? "expanded" : ""}" data-name="${r.name}">
      <td><span class="rank-block ${isTop ? "top" : ""}"><span class="br">[</span>${rankNum}<span class="br">]</span></span></td>
      <td>
        <div class="member-name-cell">
          <span class="member-name">${r.name}</span>
          ${i === 0 ? '<span class="member-crown">★ CHAMP</span>' : ""}
        </div>
      </td>
      <td>
        <div class="record-stack">
          <span class="record-big">${recordHtml(r.seasonRec)}</span>
          <span class="record-pct">${pct(r.seasonRec)}%</span>
        </div>
      </td>
      <td class="heat-col"><div class="heat-strip">${heat}</div></td>
      <td class="ww-col"><div class="ww-cell ${r.weeksWon === 0 ? "zero" : ""}">${r.weeksWon}</div></td>
      <td class="super-cell super-col">
        <span class="key">SL</span>${recordHtmlFromString(r.md?.byType?.["Super Lock"]?.record)}
      </td>
      <td><span class="chev">›</span></td>
    </tr>
    <tr class="detail-row ${isExp ? "show" : ""}">
      <td class="detail-cell" colspan="7">
        <div class="detail-inner">${isExp ? renderMemberDetail(r) : ""}</div>
      </td>
    </tr>
  `;
}

function renderMemberDetail(r) {
  const md = r.md;
  const weekHeader = Array.from({ length: WEEK_COUNT }, (_, i) =>
    `<div>W${String(i + 1).padStart(2, "0")}</div>`
  ).join("");

  const rows = BET_TYPES_ORDER.map(bt => {
    const info = md?.byType?.[bt];
    if (!info) return "";
    const cells = Array.from({ length: WEEK_COUNT }, (_, i) => {
      const wk = i + 1;
      const pick = info.picks?.[wk];
      const cls = pick?.result || "";
      const safe = (pick?.text || "").replace(/"/g, "&quot;").replace(/</g,"&lt;");
      return `<div class="week-cell ${cls}" data-week="${wk}" data-bet="${bt}" data-text="${safe}" data-result="${pick?.result || ""}">
        <span class="week-cell-label">${pick?.result || ""}</span>
      </div>`;
    }).join("");
    return `
      <div class="bet-row">
        <div class="bet-name ${bt === "Super Lock" ? "super" : ""}">${bt === "Super Lock" ? "Super Lock" : bt}</div>
        <div class="bet-record">${recordHtmlFromString(info.record)}</div>
        <div class="week-cells">${cells}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="bet-grid-head">
      <div>Bet Type</div>
      <div>Record</div>
      <div class="bet-grid-weeklabel">${weekHeader}</div>
    </div>
    ${rows}
    <div class="detail-foot">
      <div><span class="label">SEASON</span><strong>${md?.seasonRecord || "—"}</strong></div>
      <div><span class="label">LIFETIME</span><strong>${md?.lifetimeRecord || "—"}</strong></div>
    </div>
  `;
}

function renderLifetime() {
  const members = Object.keys(DATA.members).sort();
  const agg = members.map(name => {
    const totals = { W: 0, L: 0, P: 0 };
    const byType = {};
    let lifetimeRecord = null;
    for (const bt of BET_TYPES_ORDER) byType[bt] = { W: 0, L: 0, P: 0 };
    for (const season of SEASONS_ORDER) {
      const md = DATA.members[name]?.[season];
      if (!md) continue;
      if (md.lifetimeRecord) lifetimeRecord = md.lifetimeRecord;
      for (const bt of BET_TYPES_ORDER) {
        const picks = md.byType?.[bt]?.picks || {};
        for (const wk of Object.keys(picks)) {
          const r = picks[wk]?.result;
          if (r === "W") { totals.W++; byType[bt].W++; }
          else if (r === "L") { totals.L++; byType[bt].L++; }
          else if (r === "P") { totals.P++; byType[bt].P++; }
        }
      }
    }
    return { name, totals, byType, lifetimeRecord };
  });
  agg.sort((a, b) => b.totals.W - a.totals.W);

  return `
    <div class="hero">
      <div>
        <div class="eyebrow">ALL · TIME · LEADERBOARD</div>
        <div class="hero-title"><span class="wreath">Lifetime</span></div>
      </div>
      <div class="hero-stats">
        <div class="hstat">
          <div class="hstat-l">Seasons</div>
          <div class="hstat-v green">${SEASONS_ORDER.length}</div>
        </div>
        <div class="hstat">
          <div class="hstat-l">Members</div>
          <div class="hstat-v">${agg.length}</div>
        </div>
      </div>
    </div>
    <div class="section-h"><h2>Standings</h2><span class="section-note">2023 → 2025</span></div>
    <div class="lt-grid">
      ${agg.map((m, i) => {
        const tot = m.totals.W + m.totals.L;
        const pctV = tot ? (m.totals.W / tot * 100).toFixed(1) : "—";
        return `<div class="lt-card ${i === 0 ? "top" : ""}">
          <div class="lt-rank">${String(i + 1).padStart(2, "0")}</div>
          <div class="lt-name">${m.name}</div>
          <div class="lt-record">${recordHtml({w: m.totals.W, l: m.totals.L, t: m.totals.P})}</div>
          <div class="lt-pct"><span class="pctv">${pctV}${tot ? "%" : ""}</span> · sheet ${m.lifetimeRecord || "—"}</div>
          <div class="lt-break">
            ${BET_TYPES_ORDER.map(bt => {
              const r = m.byType[bt];
              const tt = r.W + r.L + r.P;
              if (!tt) return "";
              return `<div class="lt-row">
                <span class="lt-bt ${bt === "Super Lock" ? "super" : ""}">${bt === "Super Lock" ? "Super 🔒" : bt}</span>
                <span class="lt-r">${recordHtml({w: r.W, l: r.L, t: r.P})}</span>
                <span class="lt-bar">
                  <span class="lt-bar-w" style="width:${(r.W/tt*100)}%"></span>
                  <span class="lt-bar-p" style="width:${(r.P/tt*100)}%"></span>
                  <span class="lt-bar-l" style="width:${(r.L/tt*100)}%"></span>
                </span>
              </div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function renderRules() {
  return `
    <div class="hero">
      <div>
        <div class="eyebrow">THE · CONSTITUTION</div>
        <div class="hero-title"><span class="wreath">Rules</span></div>
      </div>
      <div class="hero-stats">
        <div class="hstat">
          <div class="hstat-l">Articles</div>
          <div class="hstat-v green">${DATA.rules.length}</div>
        </div>
      </div>
    </div>
    <div class="section-h"><h2>Articles</h2><span class="section-note">RATIFIED · 2023</span></div>
    <div class="rules-list">
      ${DATA.rules.map((r, i) => {
        const m = r.article.match(/^Article\s+([0-9A-Za-z]+)[\.:]?\s*(.*)$/s);
        const num = m ? m[1] : String(i+1);
        const body = m ? m[2] : r.article;
        return `<div class="rule">
          <div class="rule-num">${num}</div>
          <div class="rule-text">${escapeHtml(body).replace(/\n/g, "<br>")}</div>
          <div class="rule-meta">${r.amended || ""}</div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function render() {
  renderYearTabs();
  renderTickerWeekSelect();
  renderTicker();
  const root = document.getElementById("root");
  if (state.view === "standings") {
    root.innerHTML = renderStandings();
    attachStandingsHandlers();
  } else if (state.view === "lifetime") {
    root.innerHTML = renderLifetime();
  } else if (state.view === "rules") {
    root.innerHTML = renderRules();
  }
}

function attachStandingsHandlers() {
  document.querySelectorAll(".member-row").forEach(row => {
    row.addEventListener("click", () => {
      const name = row.dataset.name;
      state.expanded = state.expanded === name ? null : name;
      render();
    });
  });
  const tt = document.getElementById("tooltip");
  document.querySelectorAll(".week-cell").forEach(cell => {
    cell.addEventListener("mouseenter", () => {
      const wk = cell.dataset.week;
      const bet = cell.dataset.bet;
      const text = cell.dataset.text;
      const result = cell.dataset.result;
      if (!text && !result) return;
      tt.innerHTML = `
        <div class="tt-meta">${bet} · WEEK ${String(wk).padStart(2,"0")}</div>
        <div class="tt-pick">${escapeHtml(text || "—")}</div>
        ${result ? `<span class="tt-result ${result}">${ {W:"WIN",L:"LOSS",P:"PUSH"}[result] }</span>` : ""}
      `;
      tt.classList.add("show");
    });
    cell.addEventListener("mousemove", (e) => {
      const pad = 14;
      let x = e.clientX + pad, y = e.clientY + pad;
      const r = tt.getBoundingClientRect();
      if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
      if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
      tt.style.left = x + "px"; tt.style.top = y + "px";
    });
    cell.addEventListener("mouseleave", () => tt.classList.remove("show"));
  });
}

document.querySelectorAll(".nav-link").forEach(btn => {
  btn.addEventListener("click", () => { state.view = btn.dataset.view; state.expanded = null; render(); });
});

fetch(DATA_URL).then(r => r.json()).then(d => { DATA = d; render(); })
  .catch(err => { document.getElementById("root").innerHTML = `<div style="color:var(--red);">Failed to load data: ${err.message}</div>`; });
</script>

</body>
</html>
