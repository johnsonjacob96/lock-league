# Lock League notification scheduler — Cloudflare Cron Trigger.
#
# Why this exists: GitHub Actions scheduled workflows proved unreliable for
# timed notifications (observed 15-30 min late on every run, and a full drop
# of the pick reminder on 2026-08-13). Cloudflare cron triggers run on the same
# edge platform as the app and fire on schedule, so these can be trusted. This
# Worker only *triggers*; all logic (window guards, DST handling, recipient
# selection, Web Push) stays in the app at /api/notify.
#
# Reminder: two UTC times bracket the DST-aware noon-CT lock (17:00 UTC in
# CDT, 18:00 in CST). The /api/notify window guard sends only the one ~1h
# before lock and no-ops the other.
#
# Line moves run every 15 minutes. The worker dispatches reminder and kickoff
# handlers at their original UTC slots, keeping one account-wide cron trigger.
# Legacy expressions remain supported during Cloudflare trigger propagation.
name = "lock-league-cron"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cloudflare's cron parser rejects "0" for Sunday; use the named day.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

[vars]
SITE_URL = "https://lock-league.pages.dev"
# CRON_SECRET is set as an encrypted secret: `wrangler secret put CRON_SECRET`.
