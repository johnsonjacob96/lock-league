# Lock League reminder scheduler — Cloudflare Cron Trigger.
#
# Why this exists: GitHub Actions scheduled workflows proved unreliable for a
# timed notification (observed 15-30 min late on every run, and a full drop of
# the pick reminder on 2026-08-13). Cloudflare cron triggers run on the same
# edge platform as the app and fire on schedule, so the Sunday reminder can be
# trusted. This Worker only *triggers*; all logic (window guard, DST handling,
# recipient selection, Web Push) stays in the app at /api/notify.
#
# Two UTC times bracket the DST-aware noon-CT lock (17:00 UTC in CDT, 18:00 in
# CST). The /api/notify window guard sends only the one ~1h before lock and
# no-ops the other. See ../functions/api/notify.js.
name = "lock-league-cron"
main = "src/index.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["0 16 * * 0", "0 17 * * 0"]

[vars]
SITE_URL = "https://lock-league.pages.dev"
# CRON_SECRET is set as an encrypted secret: `wrangler secret put CRON_SECRET`.
