// ---- Web Push notifications ----
// `subscribed` = this browser/device has a push subscription; `accountSubscribed`
// = the member has one on ANY device (from /api/push, which counts per member).
const pushState = { supported: false, subscribed: false, accountSubscribed: false, vapidPublic: null, busy: false };

function pushSupported() {
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}
function isStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}
function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  const arr = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
  return arr;
}
async function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return null;
  try { return await navigator.serviceWorker.register("/sw.js"); } catch { return null; }
}
async function getSwRegistration() {
  if (!("serviceWorker" in navigator)) return null;
  return (await navigator.serviceWorker.getRegistration()) || registerServiceWorker();
}
async function loadPushConfig() {
  try {
    const r = await fetch("/api/push", { credentials: "include" });
    if (!r.ok) return null;
    return await r.json(); // { vapidPublic, subscribed }
  } catch { return null; }
}
async function refreshNotifUI() {
  const statusEl = document.getElementById("notif-status");
  const toggle = document.getElementById("notif-toggle");
  const testBtn = document.getElementById("notif-test");
  if (!statusEl || !toggle || !testBtn) return;

  pushState.supported = pushSupported();
  if (!pushState.supported) {
    statusEl.textContent = isStandalone()
      ? "Not supported on this device."
      : "Add to Home Screen first, then turn this on.";
    toggle.disabled = true; toggle.setAttribute("aria-checked", "false");
    testBtn.classList.remove("show");
    return;
  }
  if (Notification.permission === "denied") {
    statusEl.textContent = "Blocked in your browser settings. Allow this site to turn on.";
    toggle.disabled = true; toggle.setAttribute("aria-checked", "false");
    testBtn.classList.remove("show");
    return;
  }
  const cfg = await loadPushConfig();
  if (!cfg || !cfg.vapidPublic) {
    statusEl.textContent = "Notifications are not available right now.";
    toggle.disabled = true; toggle.setAttribute("aria-checked", "false");
    testBtn.classList.remove("show");
    return;
  }
  pushState.vapidPublic = cfg.vapidPublic;
  const reg = await getSwRegistration();
  const sub = reg ? await reg.pushManager.getSubscription() : null;
  const on = !!sub && Notification.permission === "granted";
  pushState.subscribed = on;
  toggle.disabled = false;
  toggle.setAttribute("aria-checked", on ? "true" : "false");
  statusEl.textContent = on
    ? "On. Reminders and weekly results."
    : "Off. Get pick reminders and weekly results.";
  testBtn.classList.toggle("show", on);
}
async function enablePush() {
  const perm = await Notification.requestPermission();
  if (perm !== "granted") return;
  const reg = await getSwRegistration();
  if (!reg) { showToast("COULD NOT REGISTER", "err"); return; }
  await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(pushState.vapidPublic),
  });
  const keys = sub.toJSON().keys;
  const r = await fetch("/api/push?action=subscribe", {
    method: "POST", credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ endpoint: sub.endpoint, keys }),
  });
  showToast(r.ok ? "NOTIFICATIONS ON" : "COULD NOT SAVE", r.ok ? "ok" : "err");
}
async function disablePush() {
  const reg = await getSwRegistration();
  const sub = reg ? await reg.pushManager.getSubscription() : null;
  if (sub) {
    await fetch("/api/push?action=unsubscribe", {
      method: "POST", credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ endpoint: sub.endpoint }),
    }).catch(() => {});
    await sub.unsubscribe().catch(() => {});
  }
  showToast("NOTIFICATIONS OFF");
}
async function toggleNotifications() {
  if (pushState.busy) return;
  const toggle = document.getElementById("notif-toggle");
  pushState.busy = true; toggle.disabled = true;
  try {
    if (pushState.subscribed) await disablePush();
    else await enablePush();
  } catch (e) {
    showToast("SOMETHING WENT WRONG", "err");
  } finally {
    pushState.busy = false;
    await refreshNotifUI();
  }
}
async function sendTestNotification() {
  try {
    const r = await fetch("/api/push?action=test", { method: "POST", credentials: "include" });
    const j = await r.json().catch(() => ({}));
    showToast(j.sent ? "TEST SENT" : "NO DEVICE FOUND", j.sent ? "ok" : "err");
  } catch { showToast("TEST FAILED", "err"); }
}

// ---- Season-start "get ready" nudge (preseason only) ----
// The push/War-Room/recap stack is useless if nobody installs the app and turns
// on alerts, and that path is buried in the account modal. In the weeks before
// kickoff, surface a countdown + a two-step setup right on the home screen.
let deferredInstallPrompt = null;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstallPrompt = e; refreshSeasonPrep(); });
window.addEventListener("appinstalled", () => { deferredInstallPrompt = null; refreshSeasonPrep(); });

function isPreseason() { return Date.now() < SEASON_2026_KICKOFF_MS; }
// Count down to the SAME moment the "This Week" tab does — the soonest game
// that hasn't kicked off yet, using its exact day math (nextKickoffCountdown),
// so the two tabs never disagree. Falls back to the season constant until the
// week's schedule has loaded.
function daysToKickoff() {
  const cd = nextKickoffCountdown(state.thisWeekData?.games || []);
  if (cd) return cd.days;
  return Math.max(0, Math.floor((SEASON_2026_KICKOFF_MS - Date.now()) / 86400000));
}
function isIOS() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

function spBtn(action, label, cls = "") { return `<button class="sp-btn ${cls}" data-sp="${action}">${label}</button>`; }
function spHint(html, muted = false) { return `<div class="sp-hint ${muted ? "sp-muted" : ""}">${html}</div>`; }
function spStep(done, title, sub, action, locked = false) {
  return `
    <div class="sp-step ${done ? "done" : ""} ${locked ? "locked" : ""}">
      <span class="material-symbols-outlined sp-check" style="font-variation-settings:'FILL' ${done ? 1 : 0}">${done ? "check_circle" : "radio_button_unchecked"}</span>
      <div class="sp-step-body">
        <div class="sp-step-title">${title}</div>
        <div class="sp-step-sub">${sub}</div>
      </div>
      <div class="sp-step-action">${action}</div>
    </div>`;
}

function seasonPrepInner() {
  const days = daysToKickoff();
  const installed = isStandalone();
  const supported = pushSupported();
  const signedIn = !!state.user;
  const ios = isIOS();
  const reachable = pushState.subscribed || pushState.accountSubscribed;

  const countdown = `
    <div>
      <div class="sp-count">
        <span class="sp-count-num font-display-lg">${days}</span>
        <span class="sp-count-unit font-label-caps">${days === 1 ? "DAY" : "DAYS"} TO KICKOFF</span>
      </div>
      <div class="sp-count-sub">2026 season · Week 1 lines drop soon</div>
    </div>`;

  // Readiness is account-level: if alerts reach this member anywhere, we're
  // done and don't re-nag on other devices. On a device that isn't itself
  // subscribed we offer a quiet "also alert this device", nothing more.
  if (reachable) {
    const canEnableHere = !pushState.subscribed && supported && signedIn && !(ios && !installed);
    return `<div class="sp-head">${countdown}
      <div class="sp-ready-wrap">
        <div class="sp-ready"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">verified</span> You're set for Week 1</div>
        ${canEnableHere ? `<button class="sp-alsohere" data-sp="notify">Also alert this device</button>` : ""}
      </div>
    </div>`;
  }

  let steps = "";
  if (ios && !installed) {
    // iOS only allows web push from an installed PWA, so install is the gate.
    steps += spStep(false, "Add Lock League to your phone",
      "Then alerts can reach you, like a real app",
      deferredInstallPrompt ? spBtn("install", "Install")
        : spHint(`Tap <span class="material-symbols-outlined sp-ic">ios_share</span> then <b>Add to Home Screen</b>`));
    steps += spStep(false, "Turn on alerts",
      "Unlocks once the app is on your home screen", spHint("After install", true), false, true);
  } else {
    let action;
    if (!signedIn) action = spBtn("signin", "Sign in first", "ghost");
    else if (!supported) action = spHint("Not supported here", true);
    else action = spBtn("notify", "Turn on");
    steps += spStep(false, "Turn on alerts",
      "Pick reminders + weekly results, never miss a lock", action);
    if (!installed) {
      steps += spStep(false, "Add to your home screen",
        "Optional, but it feels like the real app",
        deferredInstallPrompt ? spBtn("install", "Install")
          : spHint(ios ? `<span class="material-symbols-outlined sp-ic">ios_share</span> <b>Add to Home Screen</b>` : `Browser menu → <b>Install</b>`));
    }
  }

  return `<div class="sp-head">${countdown}<div class="sp-tag font-label-caps">GET READY</div></div>
    <div class="sp-steps">${steps}</div>`;
}

function renderSeasonPrep() {
  if (!isPreseason()) return "";
  return `<div id="season-prep" class="season-prep">${seasonPrepInner()}</div>`;
}

function bindSeasonPrep() {
  const c = document.getElementById("season-prep");
  if (!c) return;
  c.querySelectorAll("[data-sp]").forEach(b => {
    b.onclick = () => {
      const a = b.dataset.sp;
      if (a === "install") triggerInstall();
      else if (a === "signin") openLogin();
      else if (a === "notify") seasonPrepEnableNotifs();
    };
  });
}

async function refreshSeasonPrep() {
  if (!isPreseason() || !document.getElementById("season-prep")) return;
  // Load the same schedule the Week tab uses so the kickoff countdown targets
  // the real first game, not the season constant, and the two tabs agree.
  if (!(state.thisWeekData?.games || []).length) await loadOdds().catch(() => {});
  if (state.user) {
    // Account-level readiness: does the member have alerts on ANY device? This
    // is the question the nudge cares about, so a second device (e.g. desktop)
    // doesn't re-nag someone who already turned alerts on from their phone.
    try {
      const cfg = await loadPushConfig();
      if (cfg) {
        if (cfg.vapidPublic) pushState.vapidPublic = cfg.vapidPublic;
        pushState.accountSubscribed = !!cfg.subscribed;
      }
    } catch { /* leave state as-is */ }
    // Device-level: is THIS browser subscribed? (drives the "also here" offer)
    if (pushSupported()) {
      try {
        const reg = await getSwRegistration();
        const sub = reg ? await reg.pushManager.getSubscription() : null;
        pushState.subscribed = !!sub && Notification.permission === "granted";
      } catch { /* leave state as-is */ }
    }
  }
  const c = document.getElementById("season-prep");
  if (!c) return;
  c.innerHTML = seasonPrepInner();
  bindSeasonPrep();
}

async function triggerInstall() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  try { await deferredInstallPrompt.userChoice; } catch { /* dismissed */ }
  deferredInstallPrompt = null;
  refreshSeasonPrep();
}

async function seasonPrepEnableNotifs() {
  if (!state.user) { openLogin(); return; }
  if (!pushSupported()) { showToast("INSTALL THE APP FIRST", "err"); return; }
  if (!pushState.vapidPublic) {
    const cfg = await loadPushConfig();
    if (cfg && cfg.vapidPublic) pushState.vapidPublic = cfg.vapidPublic;
  }
  if (!pushState.vapidPublic) { showToast("NOTIFICATIONS UNAVAILABLE", "err"); return; }
  try { await enablePush(); } catch { showToast("SOMETHING WENT WRONG", "err"); }
  await refreshSeasonPrep();
}

// Live scores (ESPN via /api/scores) - real LIVE pills and in-game scores.
const SCORES_TTL_MS = 60 * 1000;
async function loadScores(force = false) {
  if (!force && state.liveScores && Date.now() - (state.liveScoresAt || 0) < SCORES_TTL_MS) {
    return state.liveScores;
  }
  try {
    const r = await fetch("/api/scores");
    if (r.ok) {
      const j = await r.json();
      state.liveScores = j.games || [];
      state.liveScoresAt = Date.now();
    }
  } catch {}
  return state.liveScores || [];
}
function scoreFor(g) {
  return (state.liveScores || []).find(e => sameTeamName(e.away, g.away) && sameTeamName(e.home, g.home)) || null;
}

const ODDS_CLIENT_TTL_MS = 40 * 1000; // re-fetch on view revisit after this
const ODDS_POLL_MS = 60 * 1000;       // live line refresh while the board is open
// Monday (MNF) games can't be picked in this league, so they never appear on the
// board or in any picker. Weekday is computed in Central (the league's timezone)
// so an MNF kickoff — which falls on Tuesday in UTC — is correctly read as Monday.
function isMondayKickoff(iso) {
  if (!iso) return false;
  return new Date(iso).toLocaleDateString("en-US", { weekday: "short", timeZone: "America/Chicago" }) === "Mon";
}
function dropMondayGames(data) {
  if (data && Array.isArray(data.games)) data.games = data.games.filter((g) => !isMondayKickoff(g.kickoff));
  return data;
}

async function loadOdds(force = false) {
  // Serve from memory briefly; never cache a failure - the next visit to the
  // view retries instead of showing a stale error until reload. A forced load
  // (manual refresh) asks the server to bypass every cache and hit upstream.
  const fresh = state.thisWeekData && state.thisWeekData.source !== "error" &&
    Date.now() - (state.thisWeekFetchedAt || 0) < ODDS_CLIENT_TTL_MS;
  if (fresh && !force) return state.thisWeekData;
  try {
    const r = await fetch("/api/odds" + (force ? "?fresh=1" : ""), { credentials: "include" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    state.thisWeekData = dropMondayGames(await r.json());
    state.thisWeekFetchedAt = Date.now();
  } catch (e) {
    if (!state.thisWeekData || state.thisWeekData.source === "error") {
      state.thisWeekData = { source: "error", error: e.message, games: [] };
    }
  }
  return state.thisWeekData;
}

function fmtKickoffDay(iso) {
  const d = new Date(iso);
  return d.toLocaleString("en-US", { weekday: "short" }).toUpperCase();
}
function fmtKickoffTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString("en-US", { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
}

function americanOdds(p) {
  if (p == null) return "";
  return p > 0 ? `+${p}` : `${p}`;
}

function nextKickoffCountdown(games) {
  const now = Date.now();
  const next = games
    .map(g => new Date(g.kickoff).getTime())
    .filter(t => t > now)
    .sort((a, b) => a - b)[0];
  if (!next) return null;
  const ms = next - now;
  const days = Math.floor(ms / 86400000);
  const hrs = Math.floor((ms % 86400000) / 3600000);
  const mins = Math.floor((ms % 3600000) / 60000);
  return { days, hrs, mins };
}

function gameStatusPill(g) {
  const sc = scoreFor(g);
  if (sc && sc.state === "in") {
    return `<span class="font-data-tabular text-[11px] text-on-surface font-bold">${teamShort(g.away)} ${sc.away_score ?? 0} - ${teamShort(g.home)} ${sc.home_score ?? 0} <span class="text-live-red ml-1">${escapeHtml(sc.detail || "LIVE")}</span></span>`;
  }
  if (sc && sc.state === "post") {
    return `<span class="font-data-tabular text-[11px] text-on-surface font-bold">${teamShort(g.away)} ${sc.away_score ?? "-"} - ${teamShort(g.home)} ${sc.home_score ?? "-"} <span class="text-on-surface-variant ml-1 uppercase">Final</span></span>`;
  }
  const kickoff = new Date(g.kickoff).getTime();
  if (kickoff > Date.now()) {
    return `<span class="font-data-tabular text-[10px] text-on-surface-variant font-medium uppercase">${fmtKickoffDay(g.kickoff)} · ${fmtKickoffTime(g.kickoff)}</span>`;
  }
  // Past kickoff but no scoreboard match - show "POST" without a live badge
  return `<span class="font-data-tabular text-[10px] text-text-dim font-bold uppercase tracking-widest">POST KICKOFF</span>`;
}

// Format a spread/total number the way the picker sees it for their side.
function fmtLineForSide(side, line) {
  const n = Number(line);
  if (!Number.isFinite(n)) return "";
  if (side === "dog") return `+${Math.abs(n)}`; // dog gets points
  return `${n}`;                                // fav line (neg) or total
}

// The best current number for a locked pick's side, taken across ALL books on
// the board (the league lets you shop either book), so "better number available"
// fires whenever FanDuel or DraftKings improves on what you locked.
function currentLineFor(pick) {
  const games = state.thisWeekData?.games || [];
  const g = games.find(x => `${x.away}@${x.home}` === pick.game_key);
  if (!g) return null;
  const lines = [];
  for (const b of Object.values(g.books || {})) {
    if ((pick.side === "fav" || pick.side === "dog") && b.spread?.line != null) lines.push(Number(b.spread.line));
    if ((pick.side === "over" || pick.side === "under") && b.total?.point != null) lines.push(Number(b.total.point));
  }
  if (!lines.length) return null;
  switch (pick.side) {
    case "fav":   return Math.max(...lines); // least negative = fewest points to give
    case "dog":   return Math.min(...lines); // most negative fav line = most points for the dog
    case "over":  return Math.min(...lines); // lowest total = easiest over
    case "under": return Math.max(...lines); // highest total = easiest under
    default:      return null;
  }
}

// Compare a locked pick's line to the current line. "better" = the locked line
// is more favorable to the picker than what's on the board now.
function lineMove(pick) {
  if (!pick || pick.line == null || !pick.side) return null;
  const cur = currentLineFor(pick);
  const locked = Number(pick.line);
  if (cur == null || !Number.isFinite(locked) || Number(cur) === locked) return null;
  const c = Number(cur);
  let better;
  switch (pick.side) {
    case "fav":   better = Math.abs(locked) < Math.abs(c); break; // fewer points to give
    case "dog":   better = Math.abs(locked) > Math.abs(c); break; // more points to get
    case "over":  better = locked < c; break;                     // lower bar to clear
    case "under": better = locked > c; break;                     // higher bar to hold
    default: return null;
  }
  return { better, lockedFmt: fmtLineForSide(pick.side, locked), curFmt: fmtLineForSide(pick.side, c) };
}

function renderMyCardBody() {
  return BET_TYPES_ORDER.map(bt => {
    const meta = BET_META[bt];

    const txt = p && (p.pick_text || p.text) ? escapeHtml(p.pick_text || p.text) : "";
    const filled = !!txt;
    const isSuper = bt === "Super Lock";
    const mv = (filled && !isSuper) ? lineMove(p) : null;
    const moveHtml = mv ? `
      <div class="slot-move ${mv.better ? "better" : "worse"}" title="${mv.better ? "Your locked line beats the current line" : "A better number is available"}">
        <span class="mv-caret">${mv.better ? "▲" : "▼"}</span>
        <span>${mv.better ? "You beat the line" : "Better number available"} · locked ${mv.lockedFmt}, now ${mv.curFmt}</span>

      ? `<div class="lp-meta">${p.book ? `<span class="lp-book">${bookLabel(p.book)}</span>` : ""}${p.locked_at ? `<span class="lp-ts">Locked ${fmtLockedAt(p.locked_at)}</span>` : ""}</div>`
      : "";
    return `<div class="slot ${filled ? "filled" : ""}">
      <span class="slot-key k-${meta.key}"></span>
      <div class="min-w-0 flex-1">
        <div class="slot-name" style="${filled ? `color:${meta.color}` : ""}">${bt}</div>
        ${filled
          ? `<div class="slot-val truncate">${txt}</div>${metaHtml}${moveHtml}`
          : `<div class="slot-empty">${isSuper ? "Enter it below ↓" : "Tap a line below"}</div>`}
      </div>
      ${filled ? `<span class="material-symbols-outlined" style="font-size:18px;color:${meta.color};font-variation-settings:'FILL' 1">check_circle</span>` : ""}
    </div>`;
  }).join("");
}

// Super Lock entry + grade live in My Card (no separate picks tab). Kept out of
// #my-card-body so a live-odds refresh can't clobber a half-typed entry.
// Two modes: "board" picks a structured player prop off the live board (it
// auto-grades off the box score); "custom" is the old free-text bet (manual
// Hit/Miss/Push) for anything the books don't post.
let slMode = "board";          // "board" | "custom"
let slGameKey = "";            // game selected for prop picking
let slMarkets = null;          // loaded prop menu for slGameKey (null=unloaded, []=none)
let slLoading = false;
let slDraft = { market: "", player: "", side: "" };
let slEditing = false;         // "Change pick" forces the entry UI over a locked pick

function slMeta(p) { return (p && (p.prop_meta || p.prop)) || null; }
const fmtPrice = (p) => (p == null ? "—" : americanOdds(p));
const slShort = (n) => String(n || "").split(" ").slice(-1)[0];

function slGamesList() {
  const games = (state.thisWeekData && state.thisWeekData.games) || [];
  return games.slice().sort((a, b) => new Date(a.kickoff) - new Date(b.kickoff))
    .map(g => ({ key: `${g.away}@${g.home}`, label: `${slShort(g.away)} @ ${slShort(g.home)}` }));
}
// Best price for a side across both books (higher American odds = better payout);
// carries that book's own line so the server can re-derive against the same book.
function slBestSide(pl, side) {
  const cands = [];
  for (const bk of ["fanduel", "draftkings"]) {
    const b = pl[bk];
    if (b && b[side] != null) cands.push({ book: bk, price: b[side], line: b.line });
  }
  if (!cands.length) return { price: null, book: null, line: pl.line };
  cands.sort((a, b) => b.price - a.price);
  return cands[0];
}

function superLockEditorHtml() {
  const p = currentMyPicks["Super Lock"];
  const header = `
    <div class="flex items-center gap-1.5 mb-2 flex-wrap">
      <span class="material-symbols-outlined text-[15px] text-tertiary-fixed" style="font-variation-settings:'FILL' 1">lock</span>
      <span class="font-label-caps text-[10px] tracking-widest uppercase text-tertiary-fixed">Super Lock</span>
      <span class="font-data-tabular text-[9.5px] text-on-surface-variant">line or prop · -120 or longer</span>
    </div>`;
  const msg = `<span class="font-data-tabular text-[11px] tracking-widest text-primary-fixed block mt-2" id="mycard-sl-msg"></span>`;
  if (p && (p.pick_text || p.text) && !slEditing) return header + slLockedHtml(p) + msg;
  const toggle = `
    <div class="sl-toggle mb-3">
      <button class="sl-seg ${slMode === "board" ? "active" : ""}" data-slmode="board">From board</button>
      <button class="sl-seg ${slMode === "custom" ? "active" : ""}" data-slmode="custom">Custom</button>
    </div>`;
  return header + toggle + (slMode === "board" ? slBoardPickerHtml() : slCustomHtml(p)) + msg;
}

function slLockedHtml(p) {
  const meta = slMeta(p);
  const txt = escapeHtml(p.pick_text || p.text);
  const res = p.result || "";
  const resBadge = res ? `<span class="sl-res ${res}">${res === "W" ? "HIT" : res === "L" ? "MISS" : "PUSH"}</span>` : "";
  const lockedTs = p.locked_at ? `<span class="lp-ts">Locked ${fmtLockedAt(p.locked_at)}</span>` : "";
  const repick = `<div class="mt-2"><button class="sl-link" id="sl-repick">Change pick</button></div>`;
  if (meta) {
    const book = meta.book ? `<span class="lp-book">${bookLabel(meta.book)}</span>` : "";
    return `
      <div class="sl-locked">
        <div class="flex items-center justify-between gap-2">
          <span class="sl-locked-txt">${txt}</span>${resBadge}
        </div>
        <div class="lp-meta">${book}${lockedTs}</div>
        <div class="sl-auto"><span class="material-symbols-outlined text-[12px]" style="font-variation-settings:'FILL' 1">bolt</span>${res ? "Auto-graded from box score" : "Auto-grades after the game"}</div>
      </div>${repick}`;
  }
  // Free-text: manual Hit/Miss/Push.
  const markHtml = `
    <div class="flex flex-wrap items-center gap-2 mt-3">
      <span class="font-data-tabular text-[10px] tracking-widest text-on-surface-variant uppercase mr-1">Grade</span>
      <button class="sl-mark-btn W ${res === "W" ? "current" : ""}" data-result="W">Hit · W</button>
      <button class="sl-mark-btn L ${res === "L" ? "current" : ""}" data-result="L">Miss · L</button>
      <button class="sl-mark-btn P ${res === "P" ? "current" : ""}" data-result="P">Push · P</button>
    </div>`;
  return `<div class="sl-locked"><span class="sl-locked-txt">${txt}</span>${lockedTs ? `<div class="lp-meta">${lockedTs}</div>` : ""}</div>${markHtml}${repick}`;
}

function slCustomHtml(p) {
  const txt = p && (p.pick_text || p.text) && !slMeta(p) ? escapeHtml(p.pick_text || p.text) : "";
  return `
    <div class="flex gap-2">
      <input class="pick-input flex-1" id="mycard-superlock" autocapitalize="none" value="${txt}" placeholder="Player prop / specialty bet">
      <button class="btn-primary" id="mycard-sl-save">Save</button>
    </div>
    <div class="sl-hint mt-2">Graded by hand (Hit/Miss/Push). Use this for anything the books don't post as a prop.</div>`;
}

function slCurrentGame() {
  return ((state.thisWeekData && state.thisWeekData.games) || []).find(g => `${g.away}@${g.home}` === slGameKey) || null;
}
// Best-priced side of a game LINE (spread/total) across FD+DK, mirroring the
// board's Fav/Dog/Over/Under buttons. Returns the side + line + text the server
// re-derives against, or null if the game doesn't offer that market.
function slGameLineSide(g, bet) {
  const books = g.books || {};
  const cands = [];
  for (const bk of ["fanduel", "draftkings"]) {
    const b = books[bk]; if (!b) continue;
    if (bet === "Favorite" && b.spread) cands.push({ book: bk, side: "fav", line: b.spread.line, price: b.spread.favPrice, text: `${b.spread.fav} ${b.spread.line}`, label: `${slShort(b.spread.fav)} ${b.spread.line}` });
    else if (bet === "Dog" && b.spread) { const dog = b.spread.fav === g.home ? g.away : g.home; const dl = Math.abs(b.spread.line); cands.push({ book: bk, side: "dog", line: b.spread.line, price: b.spread.dogPrice, text: `${dog} +${dl}`, label: `${slShort(dog)} +${dl}` }); }
    else if (bet === "Over" && b.total) cands.push({ book: bk, side: "over", line: b.total.point, price: b.total.overPrice, text: `${g.away} / ${g.home} O${b.total.point}`, label: `Over ${b.total.point}` });
    else if (bet === "Under" && b.total) cands.push({ book: bk, side: "under", line: b.total.point, price: b.total.underPrice, text: `${g.away} / ${g.home} U${b.total.point}`, label: `Under ${b.total.point}` });
  }
  if (!cands.length) return null;
  cands.sort((a, b) => (b.price ?? -1e9) - (a.price ?? -1e9)); // best payout first, same as props
  return cands[0];
}
const BET_FOR_SIDE = { fav: "Favorite", dog: "Dog", over: "Over", under: "Under" };

function slBoardPickerHtml() {
  const games = slGamesList();
  const gameOpts = `<option value="">Select a game…</option>` +
    games.map(g => `<option value="${escapeHtml(g.key)}" ${g.key === slGameKey ? "selected" : ""}>${escapeHtml(g.label)}</option>`).join("");
  let body;
  if (!slGameKey) body = `<div class="sl-hint mt-2">Pick a game to load its lines and props.</div>`;
  else if (slLoading) body = `<div class="sl-hint mt-2">Loading lines…</div>`;
  else body = slMarketPickerHtml();
  return `<select class="sl-select" id="sl-game">${gameOpts}</select>${body}`;
}

// Sub-picker for a game-line Super Lock (spread or total): two side buttons +
// a lock button, reusing the prop picker's .sl-sides styling.
function slGameLineSubHtml(g, kind) {
  const sides = kind === "spread" ? ["fav", "dog"] : ["over", "under"];
  const btns = sides.map(sd => {
    const info = slGameLineSide(g, BET_FOR_SIDE[sd]);
    if (!info) return "";
    return `<button class="sl-side-btn ${slDraft.side === sd ? "active" : ""}" data-slside="${sd}">
      <span class="sl-side-lab">${escapeHtml(info.label)}</span>
      <span class="sl-side-price">${fmtPrice(info.price)}${info.book ? " · " + bookLabel(info.book) : ""}</span></button>`;
  }).join("");
  let out = `<div class="sl-sides mt-2">${btns}</div>`;
  if (sides.includes(slDraft.side)) {
    const info = slGameLineSide(g, BET_FOR_SIDE[slDraft.side]);
    if (info) {
      const meets = info.price != null && Number(info.price) >= -120;
      const warn = (info.price != null && !meets)
        ? `<div class="sl-hint warn mt-1">${fmtPrice(info.price)} is shorter than -120 — a Super Lock must be -120 or longer.</div>`
        : (info.price == null ? `<div class="sl-hint warn mt-1">No price available for this side.</div>` : "");
      const dis = meets ? "" : `disabled style="opacity:.5;cursor:not-allowed"`;
      out += `<button class="btn-primary w-full mt-2" id="sl-lock-line" ${dis}>Lock ${escapeHtml(info.label)} · ${fmtPrice(info.price)}</button>${warn}`;
    }
  }
  return out;
}

function slMarketPickerHtml() {
  const g = slCurrentGame();
  const hasSpread = g && ["fanduel", "draftkings"].some(bk => g.books?.[bk]?.spread);
  const hasTotal = g && ["fanduel", "draftkings"].some(bk => g.books?.[bk]?.total);
  const props = slMarkets || [];
  let marketOpts = `<option value="">Select a line or prop…</option>`;
  if (hasSpread) marketOpts += `<option value="__spread__" ${slDraft.market === "__spread__" ? "selected" : ""}>Game spread</option>`;
  if (hasTotal) marketOpts += `<option value="__total__" ${slDraft.market === "__total__" ? "selected" : ""}>Game total (O/U)</option>`;
  marketOpts += props.map(m => `<option value="${m.market}" ${m.market === slDraft.market ? "selected" : ""}>${escapeHtml(m.label)}</option>`).join("");
  const propHint = (!props.length && (hasSpread || hasTotal))
    ? `<div class="sl-hint mt-2">Player props aren't posted for this game yet — game lines are ready now; props fill in 1–2 days before kickoff.</div>` : "";

  // Game-line branch.
  if (slDraft.market === "__spread__" || slDraft.market === "__total__") {
    const sub = g ? slGameLineSubHtml(g, slDraft.market === "__spread__" ? "spread" : "total") : "";
    return `<select class="sl-select mt-2" id="sl-market">${marketOpts}</select>${sub}`;
  }
  if (!props.length && !hasSpread && !hasTotal) {
    return `<div class="sl-hint warn mt-2">No lines or props posted for this game yet. Check back closer to kickoff, or use Custom to enter one by hand.</div>`;
  }

  let sub = propHint;
  const m = props.find(x => x.market === slDraft.market);
  if (m) {
    const playerOpts = `<option value="">Select player…</option>` + m.players.map(pl => {
      const lbl = m.kind === "yes"
        ? `${pl.player} (${fmtPrice(slBestSide(pl, "yes").price)})`
        : `${pl.player} — ${m.unit} ${pl.line}`;
      return `<option value="${escapeHtml(pl.player)}" ${pl.player === slDraft.player ? "selected" : ""}>${escapeHtml(lbl)}</option>`;
    }).join("");
    sub += `<select class="sl-select mt-2" id="sl-player">${playerOpts}</select>`;
    const pl = m.players.find(x => x.player === slDraft.player);
    if (pl) {
      if (m.kind === "yes") {
        sub += slLockBtnHtml(m, pl, "yes");
      } else {
        const ov = slBestSide(pl, "over"), un = slBestSide(pl, "under");
        sub += `<div class="sl-sides mt-2">
          <button class="sl-side-btn ${slDraft.side === "over" ? "active" : ""}" data-slside="over">
            <span class="sl-side-lab">Over ${ov.line ?? pl.line}</span>
            <span class="sl-side-price">${fmtPrice(ov.price)}${ov.book ? " · " + bookLabel(ov.book) : ""}</span></button>
          <button class="sl-side-btn ${slDraft.side === "under" ? "active" : ""}" data-slside="under">
            <span class="sl-side-lab">Under ${un.line ?? pl.line}</span>
            <span class="sl-side-price">${fmtPrice(un.price)}${un.book ? " · " + bookLabel(un.book) : ""}</span></button>
        </div>`;
        if (slDraft.side) sub += slLockBtnHtml(m, pl, slDraft.side);
      }
    }
  }
  return `<select class="sl-select mt-2" id="sl-market">${marketOpts}</select>${sub}`;
}

function slLockBtnHtml(m, pl, side) {
  const best = slBestSide(pl, side);
  const meets = best.price != null && Number(best.price) >= -120;
  const label = m.kind === "yes" ? `Lock ${slShort(pl.player)} anytime TD` : `Lock ${side === "over" ? "Over" : "Under"} ${best.line ?? pl.line}`;
  const warn = (best.price != null && !meets)
    ? `<div class="sl-hint warn mt-1">${fmtPrice(best.price)} is shorter than -120 — a Super Lock must be -120 or longer.</div>`
    : (best.price == null ? `<div class="sl-hint warn mt-1">No price available for this side.</div>` : "");
  const dis = meets ? "" : `disabled style="opacity:.5;cursor:not-allowed"`;
  return `<button class="btn-primary w-full mt-2" id="sl-lock" ${dis}>${label} · ${fmtPrice(best.price)}</button>${warn}`;
}

// Client mirror of the server's canonical prop text (functions/_shared/props.js).
function propTextClient(prop, m) {
  if (m.kind === "yes" || prop.side === "yes") return `${prop.player} anytime TD`;
  const dir = prop.side === "under" ? "u" : "o";
  return `${prop.player} ${dir}${prop.line} ${m.unit}`;
}
async function lockStructuredProp() {
  const m = (slMarkets || []).find(x => x.market === slDraft.market);
  const pl = m && m.players.find(x => x.player === slDraft.player);
  if (!m || !pl) return;
  const side = m.kind === "yes" ? "yes" : slDraft.side;
  if (!side) return;
  const best = slBestSide(pl, side);
  const prop = { market: m.market, player: pl.player, line: m.kind === "yes" ? null : (best.line ?? pl.line), side, book: best.book, game_key: slGameKey };
  const msg = document.getElementById("mycard-sl-msg");
  try {
    const r = await fetch("/api/picks", {
      method: "POST", credentials: "include",

    });

    if (!r.ok) {

        : j.error === "super-lock-price" ? "ODDS MUST BE -120 OR LONGER"

// One pick chip for a past (graded) week — reuses the War Room chip styles.
function histChip(bt, p) {
  const meta = BET_META[bt] || {};
  const res = p && p.result;
  const status = res === "W" ? "win" : res === "L" ? "lose" : res === "P" ? "push"
    : (bt === "Super Lock" && p && !(p.prop_meta || p.prop) ? "manual" : "pending");
  // An unfilled slot that locked (missing) is a loss — label it clearly.
  const missing = p && p.missing;
  const txt = missing ? "No pick" : (p && (p.pick_text || p.text) ? shortPickText(p.pick_text || p.text) : "—");
  const sub = missing ? "LOSS" : (res || (p ? "" : "no pick"));
  return `<div class="wr-chip ${WR_STATUS[status] || WR_STATUS.pending} ${missing ? "is-missing" : ""}">
    <span class="wr-bt" style="color:${meta.color || "#9aa4a2"}">${btShort(bt)}</span>
    <span class="wr-pick ${missing ? "wr-nopick" : ""}">${escapeHtml(txt)}</span>
    <span class="wr-sub">${escapeHtml(sub)}</span>
  </div>`;
}
function picksHistoryHeader(sel, curWeek) {
  return `
    <section class="mb-6">
      <div class="flex items-center gap-3">
        <span class="w-2 h-8 bg-primary-fixed inline-block rounded-sm"></span>

function renderPicksHistory(sel, curWeek) {
  const hist = state.picksHistory;
  const header = picksHistoryHeader(sel, curWeek);
  if (!hist || hist.week !== sel) return header + `<div class="pk-hist-empty">Loading Week ${sel}…</div>`;
  const picks = hist.picks || [];
  if (!picks.length) return header + `<div class="pk-hist-empty">No picks recorded for Week ${sel}.</div>`;
  const byMember = new Map();
  for (const p of picks) {
    const m = byMember.get(p.member_id) || byMember.set(p.member_id, { id: p.member_id, name: p.member_name, picks: {}, W: 0, L: 0, P: 0 }).get(p.member_id);
    m.picks[p.bet_type] = p;
    if (p.result === "W") m.W++; else if (p.result === "L") m.L++; else if (p.result === "P") m.P++;
  }
  const members = [...byMember.values()].sort((a, b) => b.W - a.W || a.L - b.L || a.name.localeCompare(b.name));
  const graded = members.some(m => m.W + m.L + m.P > 0);
  let winner = null;
  if (graded && members.length) {
    const top = members[0];
    const tie = members.filter(m => m.W === top.W && m.L === top.L).length > 1;
    if (!tie && top.W > 0) winner = top;
  }
  const winLine = winner
    ? `<span class="pk-hist-win"><span class="pk-crown">🏆</span><b>${escapeHtml(winner.name)}</b> · ${winner.W}-${winner.L}${winner.P ? "-" + winner.P : ""}</span>`
    : (graded ? `<span class="pk-hist-win">Tie at the top</span>` : `<span class="pk-hist-win">Not graded yet</span>`);
  const cards = members.map((m, i) => `
    <div class="wr-card">
      <div class="wr-head">
        <span class="wr-rank">${String(i + 1).padStart(2, "0")}</span>
        <span class="wr-name" style="color:${memberColor(m.name)}">${escapeHtml(m.name)}</span>
        <span class="wr-rec">${m.W}-${m.L}${m.P ? "-" + m.P : ""}</span>
      </div>
      <div class="wr-picks">${BET_TYPES_ORDER.map(bt => histChip(bt, m.picks[bt])).join("")}</div>
    </div>`).join("");
  return header +
    `<div class="pk-hist-head"><span class="pk-hist-title">Week ${sel}</span>${winLine}</div>` +
    `<div class="wr-grid">${cards}</div>`;
}

function switchBook(gameKey, book) {
  const games = (state.thisWeekData && state.thisWeekData.games) || [];
  const g = games.find(x => `${x.away}@${x.home}` === gameKey);
  if (!g) return;
  const card = document.querySelector(`.game-card[data-game-key="${CSS.escape(gameKey)}"]`);

  card.outerHTML = renderGameCard(g, book);

  markPickedButtons(currentMyPicks);
}

}

  for (const [bt, pick] of Object.entries(picksByBetType)) {

    const match = document.querySelector(
      `.pick-btn[data-bet="${bt}"][data-game="${pick.game_key}"][data-side="${pick.side}"][data-book="${pick.book}"]`
    );

async function clickPickButton(btn) {
  if (!state.user) {
    showToast("SIGN IN TO PICK", "warn");
    openLogin();
    return;
  }
  const bet_type = btn.dataset.bet;
  const game_key = btn.dataset.game;
  const side = btn.dataset.side;
  const line = btn.dataset.line ? Number(btn.dataset.line) : null;
  const book = btn.dataset.book;
  const price = btn.dataset.price ? Number(btn.dataset.price) : null;
  const pick_text = btn.dataset.text;
  const cur = currentNflWeekClient();
  const season = 2026;
  const week = state.myPicksWeek || cur.week || 1;

  // Clicking the pick you already have selected removes it from your card.
  if (btn.classList.contains("picked")) return unpick(btn, bet_type, season, week);

  btn.classList.add("saving");
  try {
    const r = await fetch("/api/picks", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ season, week, picks: [{ bet_type, pick_text, game_key, side, line, book, price }] }),
    });
    const j = await r.json();
    if (!r.ok) {
      showToast(j.error === "locked" ? "PICKS LOCKED FOR THIS WEEK"
        : j.error === "game-started" ? "GAME STARTED, PICK LOCKED"
        : "ERROR: " + (j.error || "unknown"), "err");
    } else {
      document.querySelectorAll(`.pick-btn[data-bet="${bet_type}"]`).forEach(b => b.classList.remove("picked"));
      btn.classList.add("picked");
      currentMyPicks[bet_type] = { pick_text, game_key, side, book, line, price, locked_at: new Date().toISOString() };
      refreshMyCard();
      showToast(`LOCKED ${BET_META[bet_type].short}: ${pick_text}`);
    }
  } catch (e) {
    showToast("NETWORK ERROR", "err");
  } finally {
    btn.classList.remove("saving");
  }
}

async function unpick(btn, bet_type, season, week) {
  btn.classList.add("saving");
  try {
    const r = await fetch("/api/picks?action=remove", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ season, week, bet_type }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      showToast(j.error === "locked" ? "PICKS LOCKED FOR THIS WEEK" : "ERROR: " + (j.error || "unknown"), "err");
    } else {
      btn.classList.remove("picked");
      delete currentMyPicks[bet_type];
      refreshMyCard();
      showToast(`REMOVED ${BET_META[bet_type].short}`, "warn");
    }
  } catch (e) {
    showToast("NETWORK ERROR", "err");
  } finally {
    btn.classList.remove("saving");
  }
}

// =================== My Card data + Who's In ===================
function currentNflWeekClient() {
  // Prefer the server's answer (it knows about preseason test mode; the client's
  // calendar math alone would say "offseason").
  const sc = state.serverConfig;
  if (sc && sc.week) return { season: sc.season, week: sc.week };
  // Week 1 starts Tue Sept 8 2026, 08:00 UTC - mirrors lib/nfl.js so client
  // and server agree on week boundaries (MNF stays in its own week).
  const week1Start = Date.UTC(2026, 8, 8, 8);
  const now = Date.now();
  if (now < week1Start) return { season: null, week: null };
  const wk = Math.floor((now - week1Start) / (7 * 24 * 3600 * 1000));
  if (wk >= 18) return { season: 2026, week: 18 };
  return { season: 2026, week: wk + 1 };
}

async function loadMyPicks(season, week) {
  try {
    const r = await fetch(`/api/picks?season=${season}&week=${week}`, { credentials: "include" });
    if (!r.ok) return {};
    const j = await r.json();
    // Who's-in counts come along for the ride (no pick contents, just counts).
    state.whosIn = { week, list: j.submitted || [] };
    if (!state.user) return {};
    const mine = {};
    for (const p of j.picks || []) {
      if (p.member_id === state.user.id) mine[p.bet_type] = p;
    }
    return mine;
  } catch { return {}; }
}

  clearInterval(oddsTimer);

      if (!r.ok) return;

const gameKeyOf = g => `${g.away}@${g.home}`;
function shownBookFor(gameKey, g) {
  const card = document.querySelector(`.game-card[data-game-key="${CSS.escape(gameKey)}"]`);
  const active = card?.dataset.book;
  if (active && g.books?.[active]) return active;
  return g.books?.fanduel ? "fanduel" : (g.books?.draftkings ? "draftkings" : (Object.keys(g.books || {})[0] || null));
}

function applyLiveOdds(prev, next) {
  dropMondayGames(next); // MNF games are never pickable — keep them off the board
  state.thisWeekData = next;
  state.thisWeekFetchedAt = Date.now();
  updateBoardStatus(next);

  const oldByKey = new Map((prev?.games || []).map(g => [gameKeyOf(g), g]));
  const newGames = next.games || [];
  // If the slate itself changed (games added/removed), rebuild the board section.
  const sameSlate = newGames.length === oldByKey.size && newGames.every(g => oldByKey.has(gameKeyOf(g)));
  if (!sameSlate) { render(); return; }

  let touched = false;
  for (const g of newGames) {
    const key = gameKeyOf(g);
    const prevG = oldByKey.get(key);
    const bk = shownBookFor(key, g);
    if (!bk) continue;
    const nb = g.books?.[bk], pb = prevG?.books?.[bk];
    if (!nb || !pb) continue;

    const spreadMoved = nb.spread && pb.spread && nb.spread.line !== pb.spread.line;
    const totalMoved = nb.total && pb.total && nb.total.point !== pb.total.point;
    const priceMoved =
      (nb.spread && pb.spread && (nb.spread.favPrice !== pb.spread.favPrice || nb.spread.dogPrice !== pb.spread.dogPrice)) ||
      (nb.total && pb.total && (nb.total.overPrice !== pb.total.overPrice || nb.total.underPrice !== pb.total.underPrice));
    if (!spreadMoved && !totalMoved && !priceMoved) continue;

    const card = document.querySelector(`.game-card[data-game-key="${CSS.escape(key)}"]`);
    // Don't yank a card out from under someone actively using it; catch it next cycle.
    if (!card || card.matches(":hover") || card.contains(document.activeElement)) continue;

    const spreadDir = spreadMoved ? Math.sign(Math.abs(nb.spread.line) - Math.abs(pb.spread.line)) : 0;
    const totalDir = totalMoved ? Math.sign(nb.total.point - pb.total.point) : 0;

    card.outerHTML = renderGameCard(g, bk);
    const fresh = document.querySelector(`.game-card[data-game-key="${CSS.escape(key)}"]`);
    bindGameCard(fresh);
    flashMoves(fresh, { spreadMoved, spreadDir, totalMoved, totalDir, priceMoved });
    touched = true;
  }
  if (touched) {
    markPickedButtons(currentMyPicks);
    refreshMyCard(); // keep My Card's line-moved indicators current
  }
}

function flashMoves(card, { spreadMoved, spreadDir, totalMoved, totalDir, priceMoved }) {
  if (!card) return;
  const caret = dir => (dir > 0 ? '<span class="move-caret up">▲</span>' : dir < 0 ? '<span class="move-caret down">▼</span>' : "");
  if (spreadMoved) card.querySelectorAll('[data-role="spread"]').forEach(el => {
    el.classList.add("line-flash");
    el.insertAdjacentHTML("beforeend", caret(spreadDir));
  });
  if (totalMoved) card.querySelectorAll('[data-role="ou"]').forEach(el => {
    el.classList.add("line-flash");
    el.insertAdjacentHTML("beforeend", caret(totalDir));
  });
  if (priceMoved && !spreadMoved && !totalMoved) {
    card.querySelectorAll(".pick-btn[data-bet]").forEach(el => el.classList.add("line-flash"));
  }
}

// Refresh just the board's status line (source + updated time + live dot).

}
function bindOddsRefresh() {

  if (!btn) return;

    btn.disabled = true;
    await loadOdds(true);
    render();

function boardStatusInner(data) {
  const live = data && data.live && !data.stale;
  const src = (data?.source === "the-odds-api" || data?.source === "sharpapi") ? "FanDuel + DraftKings"
    : data?.source === "espn" ? "ESPN consensus"
    : data?.stale ? "Last known lines"
    : data?.source === "mock" ? "Sample lines" : "";
  const when = data?.fetched_at ? new Date(data.fetched_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : (data?.snapshot_at ? new Date(data.snapshot_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "");
  const dot = live
    ? `<span class="live-dot" title="Lines updating live"></span>`
    : `<span class="idle-dot" title="Not live"></span>`;

const WR_STATUS = {

function shortPickText(t) {
  if (!t) return "";

  // "Cardinals / Raiders O45.5" — mascots only so it fits the card.
  const ou = t.match(/^(.+?)\s*\/\s*(.+?)\s+([OU][\d.]+)$/);
  if (ou) return `${teamNick(ou[1])} / ${teamNick(ou[2])} ${ou[3]}`;
  const m = t.match(/^(.+?)\s+([-+]\d.*)$/); // team + spread -> last word of team + spread
  if (m) { const w = m[1].trim().split(/\s+/); return w[w.length - 1] + " " + m[2]; }

}
function wrChip(p, ctx) {
  const meta = BET_META[p.bet_type] || {};

  // Every card shows all five bet-type slots. A slot without a revealed pick is a
  // placeholder: pre-lock it "reveals at lock" (a pick shows the moment ITS game
  // kicks off, so Thursday games appear early; the rest wait) via kind "hidden";
  // once picks lock, an unfilled slot is an automatic loss (kind "missing").
  if (p.kind === "missing") {
    return `<div class="wr-chip st-lose is-settled is-missing">
      ${btEl}<span class="wr-pick wr-nopick">No pick</span>
      <span class="wr-sub">LOSS<span class="wr-mark lose">✗</span></span></div>`;
  }
  if (p.kind === "hidden") {
    // Pre-lock: game not started yet, or empty. Identical either way so it never
    // leaks whether/what a member picked for a game that hasn't kicked off.
    return `<div class="wr-chip is-empty">
      ${btEl}<span class="wr-pick wr-nopick">Reveals at lock</span>
      <span class="wr-sub">HIDDEN</span></div>`;
  }
  const cls = WR_STATUS[p.status] || WR_STATUS.pending;
  const live = p.state === "in" && !p.final;
  // All-caps abbreviations (ARI 0-0 LV). Before the game is live, show a stable
  // kickoff time instead of a phantom 0-0 that flickers as ESPN toggles the
  // scheduled-game score between "0" and null.
  let scoreTxt;
  if (p.score) {
    scoreTxt = `${teamShort(p.score.away)} ${p.score.away_score}-${p.score.home_score} ${teamShort(p.score.home)}`;
  } else if (p.kickoff) {
    scoreTxt = `${fmtKickoffDay(p.kickoff)} ${fmtKickoffTime(p.kickoff)}`;
  } else {
    scoreTxt = p.detail || "";
  }
  // Make live-vs-settled scannable: a finished, graded pick gets a filled chip
  // (see CSS) + a result glyph; a still-playing pick gets a pulsing LIVE pill.
  const settled = p.final && (p.status === "win" || p.status === "lose" || p.status === "push");
  let mark = "";
  if (settled) {
    const g = p.status === "win" ? "✓" : p.status === "lose" ? "✗" : "P";
    mark = `<span class="wr-mark ${p.status}">${g}</span>`;
  } else if (live) {
    mark = `<span class="wr-livepill"><span class="wr-livedot"></span>LIVE</span>`;
  }

  // stats). Free-text Super Locks with no game_key stay static.
  const canExpand = !!(ctx && p.game_key);
  const expId = canExpand ? `${ctx.member_id}:${p.bet_type}` : null;
  const isExp = expId && state.wrExpanded === expId;
  const chev = canExpand ? `<span class="wr-chev" aria-hidden="true">▾</span>` : "";
  const stateCls = `${cls} ${live ? "is-live" : ""} ${settled ? "is-settled" : ""} ${p.final ? "is-final" : ""}`;
  const inner = `${btEl}
      <span class="wr-pick">${escapeHtml(shortPickText(p.pick_text))}</span>
      <span class="wr-sub">${escapeHtml(scoreTxt)}${mark}${chev}</span>`;
  if (canExpand) {
    return `<button type="button" class="wr-chip ${stateCls} expandable" data-exp="${expId}" data-key="${escapeHtml(p.game_key)}" aria-expanded="${isExp ? "true" : "false"}">${inner}</button>`;
  }
  return `<div class="wr-chip ${stateCls}">${inner}</div>`;
}

// --- War Room live game drill-down (lazy-loaded via /api/game) ---
const wrGameCache = {};    // game_key -> { ts, data }
const wrGameInflight = {}; // game_key -> bool
async function loadWrGame(key, { force = false } = {}) {
  if (!key) return;
  const c = wrGameCache[key];
  if (!force && c && Date.now() - c.ts < 20000) return; // fresh; current render already shows it
  if (wrGameInflight[key]) return;
  wrGameInflight[key] = true;
  try {
    const r = await fetch(`/api/game?key=${encodeURIComponent(key)}`, { credentials: "include" });
    wrGameCache[key] = { ts: Date.now(), data: r.ok ? await r.json() : { found: false } };
  } catch {
    wrGameCache[key] = { ts: Date.now(), data: { found: false } };
  } finally {
    wrGameInflight[key] = false;
  }
  if (state.view === "warroom") rerenderWarRoom();
}
// How the member's pick is tracking against the live score (context, not grading).
function wrPickTrack(p, d) {
  if (!d || !d.away || d.away.score == null || d.home.score == null) return "";
  const a = d.away.score, h = d.home.score, txt = p.pick_text || "", bt = p.bet_type;
  try {
    if (bt === "Over" || bt === "Under") {
      const m = txt.match(/([OU])\s*([\d.]+)/i);
      const line = m ? parseFloat(m[2]) : NaN;
      const total = a + h;
      if (Number.isNaN(line)) return `${total} total points`;
      const diff = Math.round((total - line) * 10) / 10;
      if (bt === "Over") return diff >= 0 ? `${total} pts — Over ${line} cashed (+${diff})` : `${total} pts — Over ${line} needs ${Math.abs(diff)} more`;
      return diff <= 0 ? `${total} pts — Under ${line} good by ${Math.abs(diff)}` : `${total} pts — Under ${line} down by ${diff}`;
    }
    if (bt === "Favorite" || bt === "Dog") {
      const m = txt.match(/^(.+?)\s+([-+]?\d+(?:\.\d+)?)/);
      if (!m) return "";
      const team = m[1].trim(), line = parseFloat(m[2]);
      const pickedHome = sameTeamName(team, d.home.name), pickedAway = sameTeamName(team, d.away.name);
      if (pickedHome === pickedAway) return "";
      const margin = pickedHome ? h - a : a - h;
      const cover = Math.round((margin + line) * 10) / 10; // line carries its own sign
      const swing = `${teamNick(team)} ${margin >= 0 ? "up" : "down"} ${Math.abs(margin)}`;
      if (cover > 0) return `${swing} — covering by ${cover}`;
      if (cover < 0) return `${swing} — short by ${Math.abs(cover)}`;
      return `${swing} — on the number`;
    }
  } catch { /* fall through */ }
  return "";
}
function wrGamePanel(p) {
  const key = p.game_key;
  const c = key && wrGameCache[key];
  if (!c) return `<div class="wr-detail"><div class="wrg-loading">Loading live game…</div></div>`;
  const d = c.data;
  if (!d || !d.found) return `<div class="wr-detail"><div class="wrg-empty">Live detail isn't available for this game yet.</div></div>`;
  const aAbbr = teamShort(d.away.name), hAbbr = teamShort(d.home.name);
  const live = d.state === "in", post = d.state === "post";
  const aS = d.away.score == null ? "–" : d.away.score, hS = d.home.score == null ? "–" : d.home.score;
  const pill = live ? `<span class="wrg-pill live">${escapeHtml(d.detail || "LIVE")}</span>`
    : post ? `<span class="wrg-pill final">Final</span>`
    : `<span class="wrg-pill pre">${d.kickoff ? escapeHtml(`${fmtKickoffDay(d.kickoff)} ${fmtKickoffTime(d.kickoff)}`) : "Scheduled"}</span>`;
  const atom = `${aAbbr} ${aS}, ${hAbbr} ${hS}${live && d.detail ? `, ${d.detail}` : post ? ", final" : ""}`;
  const sit = live && d.situation ? `<div class="wrg-sit">${escapeHtml(d.situation)}</div>` : "";
  const track = wrPickTrack(p, d);
  const trackEl = track ? `<div class="wrg-track">${escapeHtml(track)}</div>` : "";
  const cols = (d.leaders || []).slice(0, 2).map((g) => `
      <div class="wrg-lcol">
        <div class="wrg-lteam">${escapeHtml(g.team || "")}</div>
        ${(g.rows || []).map((r) => `<div class="wrg-lrow"><span class="wrg-cat">${escapeHtml(r.cat)}</span><span class="wrg-name">${escapeHtml(r.name)}</span><span class="wrg-line">${escapeHtml(r.line)}</span></div>`).join("")}
      </div>`).join("");
  const leadersEl = cols
    ? `<div class="wrg-leaders">${cols}</div>`
    : (live || post ? `<div class="wrg-empty" style="margin-top:10px">Player stats not posted yet.</div>` : "");
  return `<div class="wr-detail">
    <div class="wrg-score" role="status" aria-atomic="true" aria-label="${escapeHtml(atom)}">
      <div class="wrg-team away"><span class="wrg-abbr">${escapeHtml(aAbbr)}</span><span class="wrg-pts">${aS}</span></div>
      <div class="wrg-status">${pill}${sit}</div>
      <div class="wrg-team home"><span class="wrg-pts">${hS}</span><span class="wrg-abbr">${escapeHtml(hAbbr)}</span></div>
    </div>
    ${trackEl}
    ${leadersEl}
  </div>`;
}

function buildRecapText(wr) {

function renderWarRoomSkeleton() {

function renderWarRoom() {
  const wr = state.warRoom;
  const cur = currentNflWeekClient();
  const head = (extra) => `<div class="wr-wrap"><div class="wr-topbar">
      <div><h2 class="wr-title">War Room</h2><div class="wr-sub2">Week ${wr?.week || cur.week || "-"} · live board</div></div>
      ${extra || ""}

  if (!wr) return renderWarRoomSkeleton();
  if (wr.needLogin) {

      `<div class="wr-empty">Sign in to watch everyone's card live.</div></div>`;
  }
  if (wr.error) return head("") + `<div class="wr-empty">Could not load the board. It refreshes on its own in a moment.</div></div>`;
  if (wr.status === "offseason" || (wr.week == null && !wr.revealed)) {
    return head("") + `<div class="wr-empty">The season has not kicked off yet. The War Room lights up on game day.</div></div>`;
  }
  if (!wr.revealed) {
    let when = "when the first game kicks off";
    if (wr.firstKickoff) {
      const dt = new Date(wr.firstKickoff);
      const s = dt.toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/Chicago" });
      when = `${s} CT, when the first game kicks off`;
    }
    return head("") + `<div class="wr-empty">The War Room lights up ${when}. Each card reveals the moment its game starts, then watch every pick cash or bust in real time.</div></div>`;
  }
  const anyPending = (wr.members || []).some((m) => m.live.pending > 0);
  const liveTag = wr.anyLive
    ? `<span class="wr-livetag" role="status" aria-live="polite"><span class="live-dot"></span>LIVE</span>`
    : `<span class="wr-livetag idle" role="status" aria-live="polite"><span class="idle-dot"></span>${anyPending ? "PREGAME" : "FINAL"}</span>`;
  const actions = `<div class="wr-actions">${liveTag}<button id="wr-refresh" class="wr-refresh" aria-label="Refresh war room" title="Refresh"><span class="material-symbols-outlined text-sm">refresh</span></button></div>`;
  if (!wr.members || !wr.members.length) return head(actions) + `<div class="wr-empty">No cards are locked yet. Each member's picks reveal here the moment their game kicks off.</div></div>`;
  const rows = wr.members.map((m, i) => {

    // A result is "projected" while its game is still live: the record can still
    // move. Once every counted game is final, the record is settled (no tag).
    const liveDecided = (L.W - (L.fW || 0)) + (L.L - (L.fL || 0)) + (L.P - (L.fP || 0));

      ? `<span class="wr-rec is-proj">${rec}<span class="wr-rectag">proj</span></span>`
      : `<span class="wr-rec">${rec}</span>`;

    // Super Lock), not the DB/kickoff order the picks arrive in.
    const orderedPicks = m.picks.slice().sort((a, b) => {
      const ia = BET_TYPES_ORDER.indexOf(a.bet_type), ib = BET_TYPES_ORDER.indexOf(b.bet_type);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);

    // board-wide). Rendered full-width under the chips so it never distorts them.
    let detail = "";

      const ep = orderedPicks.find((p) => `${m.member_id}:${p.bet_type}` === state.wrExpanded);
      if (ep && ep.game_key) detail = wrGamePanel(ep);
    }
    return `
      <div class="wr-card">
        <div class="wr-head">
          <span class="wr-rank">${String(i + 1).padStart(2, "0")}</span>
          <span class="wr-name" style="color:${memberColor(m.name)}">${escapeHtml(m.name)}</span>
          <span class="wr-recwrap">${recHtml}${pend}</span>
        </div>
        <div class="wr-picks">${orderedPicks.map((p) => wrChip(p, m)).join("")}</div>
        ${detail}

  }).join("");
  return head(actions) + renderRecapCard(wr) + `<div class="wr-grid">${rows}</div></div>`;
}

function attachStandingsHandlers() {
  document.querySelectorAll(".member-row").forEach(row => {

    // Keyboard: the row is role=button, so Enter/Space must activate it.
    row.addEventListener("keydown", (e) => {

    });

  const tt = document.getElementById("tooltip");
  const fillTooltip = (cell) => {
    const wk = cell.dataset.week;

    const text = cell.dataset.text;
    const result = cell.dataset.result;
    if (!text && !result) return false;
    tt.innerHTML = `

      <div class="tt-pick">${escapeHtml(text || "-")}</div>
      ${result ? `<span class="tt-result ${result}">${ {W:"WIN",L:"LOSS",P:"PUSH"}[result] }</span>` : ""}

    return true;
  };
  document.querySelectorAll(".week-cell").forEach(cell => {
    cell.addEventListener("mouseenter", () => {
      if (tt._pin) return;
      if (fillTooltip(cell)) tt.classList.add("show");
    });
    // Keyboard focus shows the same tooltip (aria-label already carries the info).
    cell.addEventListener("focus", () => {
      if (!fillTooltip(cell)) return;
      tt.classList.add("show");
      const cr = cell.getBoundingClientRect(), r = tt.getBoundingClientRect();
      let x = cr.left, y = cr.bottom + 8;
      if (x + r.width > window.innerWidth - 8) x = window.innerWidth - r.width - 8;
      if (y + r.height > window.innerHeight - 8) y = cr.top - r.height - 8;
      tt.style.left = Math.max(8, x) + "px"; tt.style.top = Math.max(8, y) + "px";
    });
    cell.addEventListener("blur", () => { if (tt._pin !== cell) tt.classList.remove("show"); });
    cell.addEventListener("mousemove", (e) => {
      if (tt._pin) return;
      const pad = 14;
      let x = e.clientX + pad, y = e.clientY + pad;
      const r = tt.getBoundingClientRect();
      if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
      if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
      tt.style.left = x + "px"; tt.style.top = y + "px";
    });
    cell.addEventListener("mouseleave", () => { if (!tt._pin) tt.classList.remove("show"); });
    // Tap-to-toggle for touch screens: pin the tooltip under the cell,
    // tap again (or anywhere else) to dismiss.
    cell.addEventListener("click", (e) => {
      e.stopPropagation();
      if (tt._pin === cell) { tt._pin = null; tt.classList.remove("show"); return; }
      if (!fillTooltip(cell)) { tt._pin = null; tt.classList.remove("show"); return; }
      tt._pin = cell;
      tt.classList.add("show");
      const cr = cell.getBoundingClientRect();
      const r = tt.getBoundingClientRect();
      let x = cr.left, y = cr.bottom + 8;
      if (x + r.width > window.innerWidth - 8) x = window.innerWidth - r.width - 8;
      if (y + r.height > window.innerHeight - 8) y = cr.top - r.height - 8;
      tt.style.left = Math.max(8, x) + "px"; tt.style.top = Math.max(8, y) + "px";
    });
  });
  if (!attachStandingsHandlers._dismissBound) {
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".week-cell")) { tt._pin = null; tt.classList.remove("show"); }
    });
    attachStandingsHandlers._dismissBound = true;
  }
}

// Material Symbols render their name as ligature text, which screen readers
// otherwise announce ("leaderboard STANDINGS"). They're decorative — the visible
// label or the button's aria-label carries the meaning — so hide every icon glyph.
// Sweep the static markup now and watch for icons added by later re-renders.
(function hideDecorativeIcons() {
  const hide = (root) => root.querySelectorAll?.(".material-symbols-outlined:not([aria-hidden])")
    .forEach(el => el.setAttribute("aria-hidden", "true"));
  hide(document);
  new MutationObserver((muts) => {
    for (const m of muts) for (const n of m.addedNodes) {
      if (n.nodeType !== 1) continue;
      if (n.classList?.contains("material-symbols-outlined")) n.setAttribute("aria-hidden", "true");
      hide(n);
    }
  }).observe(document.body, { childList: true, subtree: true });
})();

// Nav click handlers
document.querySelectorAll(".nav-link[data-view]").forEach(btn => {
  btn.addEventListener("click", () => {
    state.view = btn.dataset.view;
    state.expanded = null;
    render();
  });
});

// Sidebar make-picks shortcut → the board, where the four gradable bets are made.
document.getElementById("sidebar-submit-picks").addEventListener("click", () => {
  if (!state.user) { openLogin(); return; }
  state.view = "thisweek";
  state.picksWeek = null; // MAKE PICKS always lands on the current week
  render();
});

// Login modal handlers
document.getElementById("login-submit").onclick = loginSubmit;
document.getElementById("login-cancel").onclick = () => { document.getElementById("login-pass").blur(); document.getElementById("login-modal").classList.remove("show"); };
document.getElementById("login-pass").addEventListener("keydown", e => { if (e.key === "Enter") loginSubmit(); });

// iOS leaves position:fixed bars (our bottom nav) pinned to the shrunk
// on-screen-keyboard viewport after any text field closes, so the nav can float
// mid-screen (the picks form has inputs too, not just login). When a field
// blurs and the keyboard is actually closing, nudge scroll by 1px and back to
// force iOS to re-anchor fixed elements — without visibly moving the page.
document.addEventListener("focusout", (e) => {
  const t = e.target;
  if (!t || !/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  setTimeout(() => {
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; // focus moved to another field
    const y = window.scrollY || 0;
    window.scrollTo(0, y + 1);
    window.scrollTo(0, y);
  }, 60);
});

// Account modal handlers
document.getElementById("acct-save").onclick = changePassphrase;
document.getElementById("acct-venmo-save").onclick = saveVenmo;
document.getElementById("acct-cancel").onclick = () => document.getElementById("account-modal").classList.remove("show");
document.getElementById("acct-logout").onclick = () => {
  document.getElementById("account-modal").classList.remove("show");
  logout();
};

document.getElementById("notif-toggle").onclick = toggleNotifications;
document.getElementById("notif-test").onclick = sendTestNotification;

// Phones vary from ~320 to ~430 CSS px wide, and iOS "Display Zoom" shifts it
// further, so a fixed-pixel design looks a little zoomed in on small phones and
// out on large ones. Fix: on phones (portrait) lay the page out at a fixed 393px
// reference width and let the device scale it to fit — every phone then shows the
// same proportions. This uses the viewport width, which is bulletproof on iOS
// Safari and installed PWAs (CSS `zoom` is not). Desktop, tablets, and landscape
// keep the native device-width responsive layout.
function applyViewportScale() {
  const meta = document.querySelector('meta[name="viewport"]');
  if (!meta) return;
  const shortSide = Math.min(window.screen.width || 9999, window.screen.height || 9999);
  const portrait = (window.innerHeight || 0) >= (window.innerWidth || 0);
  // user-scalable=no locks out pinch-zoom (no maximum-scale, which would cap
  // the fit-to-width scaling above). touch-action:manipulation (below) kills
  // double-tap zoom. Together the app can't be user-zoomed into a weird state.
  const content = (shortSide <= 480 && portrait)
    ? "width=393, viewport-fit=cover, user-scalable=no"
    : "width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no";
  if (meta.getAttribute("content") !== content) meta.setAttribute("content", content);
}
applyViewportScale();
window.addEventListener("resize", applyViewportScale);
window.addEventListener("orientationchange", applyViewportScale);

// Boot - session check and data load in parallel
registerServiceWorker(); // fire-and-forget; needed for push subscriptions
(async () => {
  const [me, r, cfg] = await Promise.all([
    fetchMe(),
    fetch(DATA_URL),
    fetch("/api/config").then(x => x.ok ? x.json() : null).catch(() => null),
  ]);
  state.user = me;
  state.serverConfig = cfg;
  DATA = await r.json();
  normalizeRecords(DATA); // derive all records from picks so sum(byType) === season
  // Once the live season has kicked off, land on it by default.
  if (seasonsVisible().includes("2026")) state.season = "2026";
  render();
})().catch(err => {
  document.getElementById("root").innerHTML = `<div class="text-live-red p-6">Failed to load data: ${err.message}</div>`;
});
</script>
