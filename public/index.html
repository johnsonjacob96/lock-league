<style>
  * { box-sizing: border-box; }
  html, body { background: #121415; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: #e2e2e3;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Turf overlay */
  .turf-overlay {
    background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.03) 1px, transparent 0);
    background-size: 24px 24px;
  }

  .display { font-family: 'Oswald', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .font-display-lg { font-family: 'Oswald', sans-serif; font-weight: 700; }
  .font-label-caps { font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: 0.1em; }
  .font-headline-lg { font-family: 'Oswald', sans-serif; font-weight: 600; }
  .font-body-md { font-family: 'Inter', sans-serif; }
  .font-data-tabular { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .text-label-caps { font-size: 12px; line-height: 16px; letter-spacing: 0.1em; font-weight: 700; }
  .text-display-lg { font-size: 72px; line-height: 80px; letter-spacing: -0.02em; font-weight: 700; }
  .text-headline-lg { font-size: 32px; line-height: 40px; letter-spacing: 0.02em; font-weight: 600; }
  .text-headline-lg-mobile { font-size: 24px; line-height: 32px; font-weight: 600; }
  .text-body-md { font-size: 16px; line-height: 24px; font-weight: 400; }
  .text-data-tabular { font-size: 14px; line-height: 20px; font-weight: 500; font-family: 'JetBrains Mono', monospace; }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }

  /* Glass panel */
  .glass-card, .glass-panel {
    background: rgba(25, 28, 30, 0.5);
    backdrop-filter: blur(12px);
    border: 1px solid #1F2427;
  }

  /* Record colors */
  .rec-W { color: #61ff97; }
  .rec-L { color: #FF3B3B; }
  .rec-T, .rec-P { color: #ffe16d; }

  /* Live pulse */
  @keyframes pulse-red {
    0% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.55); }
    70% { box-shadow: 0 0 0 8px rgba(255, 59, 59, 0); }
    100% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0); }
  }
  .live-pulse { animation: pulse-red 2s infinite; }

  /* Ticker marquee */
  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .marquee-track {
    display: inline-flex;
    width: max-content;
    animation: marquee var(--marquee-duration, 80s) linear infinite;
    white-space: nowrap;
    align-items: center;
  }
  .marquee-track:hover { animation-play-state: paused; }
  .tk-item { display: inline-flex; align-items: center; gap: 8px; padding: 0 22px; height: 100%; border-right: 1px solid #1F2427; }
  .tk-wk { color: #8A9296; font-size: 10px; letter-spacing: 0.12em; }
  .tk-name { color: #e2e2e3; font-weight: 600; font-size: 11px; }
  .tk-type { font-size: 10px; letter-spacing: 0.08em; padding: 2px 6px; border: 1px solid #3b4b3d; }
  .tk-type.fav { color: #61ff97; border-color: rgba(97,255,151,0.35); }
  .tk-type.dog { color: #a5eeff; border-color: rgba(165,238,255,0.35); }
  .tk-type.over { color: #ffe16d; border-color: rgba(255,225,109,0.35); }
  .tk-type.under { color: #00daf8; border-color: rgba(0,218,248,0.35); }
  .tk-type.super { color: #FF3B3B; border-color: rgba(255,59,59,0.35); }
  .tk-pick { color: #b9cbb9; font-size: 11px; }
  .tk-res { font-size: 10px; padding: 1px 5px; font-weight: 700; }
  .tk-res.W { background: rgba(97,255,151,0.18); color: #61ff97; }
  .tk-res.L { background: rgba(255,59,59,0.18); color: #FF3B3B; }
  .tk-res.P { background: rgba(255,225,109,0.18); color: #ffe16d; }

  /* Heat strip cells (Standings overview) — Stitch w-3 h-5 */
  .heat-cell { width: 0.75rem; height: 1.25rem; background: #333536; transition: transform 0.1s; }
  .heat-cell.W { background: #61ff97; }
  .heat-cell.L { background: #FF3B3B; }
  .heat-cell.P { background: #ffe16d; }
  .heat-cell:hover { transform: scaleY(1.3); }

  /* Week cell (member detail grid) */
  .week-cell {
    width: 26px; height: 26px;
    background: #1a1c1d;
    border: 1px solid #2a2c2d;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: #6b7468;
    transition: transform 0.1s, border-color 0.1s;
  }
  .week-cell.W { background: rgba(97, 255, 151, 0.16); color: #61ff97; border-color: rgba(97, 255, 151, 0.35); }
  .week-cell.L { background: rgba(255, 59, 59, 0.16); color: #FF3B3B; border-color: rgba(255, 59, 59, 0.35); }
  .week-cell.P { background: rgba(255, 225, 109, 0.14); color: #ffe16d; border-color: rgba(255, 225, 109, 0.35); }
  .week-cell:hover { transform: scale(1.18); z-index: 5; position: relative; }

  /* Tooltip */
  .tooltip {
    position: fixed;
    background: #0c0e0f;
    border: 1px solid #3b4b3d;
    padding: 10px 14px;
    font-size: 12px;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 280px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  }
  .tooltip.show { opacity: 1; }
  .tooltip .tt-meta { color: #b9cbb9; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .tooltip .tt-pick { color: #e2e2e3; font-weight: 600; margin-bottom: 6px; }
  .tooltip .tt-result { display: inline-block; padding: 2px 8px; font-size: 10px; font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 0.1em; }
  .tooltip .tt-result.W { background: rgba(97, 255, 151, 0.2); color: #61ff97; }
  .tooltip .tt-result.L { background: rgba(255, 59, 59, 0.2); color: #FF3B3B; }
  .tooltip .tt-result.P { background: rgba(255, 225, 109, 0.18); color: #ffe16d; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 88px;
    right: 24px;
    background: #0c0e0f;
    border-left: 3px solid #61ff97;
    padding: 14px 20px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.08em;
    z-index: 200;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 8px 30px rgba(0,0,0,0.6);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { border-left-color: #FF3B3B; color: #FF3B3B; }
  .toast.warn { border-left-color: #ffe16d; color: #ffe16d; }
  @media (min-width: 768px) { .toast { bottom: 24px; } }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: #1a1c1d;
    border: 1px solid #3b4b3d;
    padding: 32px;
    width: 380px;
    max-width: 92vw;
  }

  /* Pick button (clickable book cell) */
  .pick-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 10px 6px;
    background: rgba(25, 28, 30, 0.6);
    border: 1px solid #3b4b3d;
    cursor: pointer;
    transition: all 0.12s;
    min-width: 0;
  }
  .pick-btn:hover { border-color: #61ff97; background: rgba(97, 255, 151, 0.06); transform: translateY(-1px); }
  .pick-btn.picked { background: rgba(97, 255, 151, 0.18); border-color: #61ff97; box-shadow: 0 0 14px rgba(97, 255, 151, 0.22); }
  .pick-btn.saving { opacity: 0.5; pointer-events: none; }
  .pick-btn .pb-label { font-size: 9px; letter-spacing: 0.14em; color: #b9cbb9; text-transform: uppercase; font-family: 'Inter', sans-serif; font-weight: 700; }
  .pick-btn .pb-value { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #61ff97; font-weight: 600; }
  .pick-btn .pb-price { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8A9296; }

  /* Pick input (My Picks) */
  .pick-input {
    width: 100%;
    background: rgba(25, 28, 30, 0.6);
    border: 1px solid #3b4b3d;
    color: #e2e2e3;
    padding: 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    transition: border-color 0.12s;
  }
  .pick-input:focus { outline: none; border-color: #61ff97; }
  .pick-input::placeholder { color: #6b7468; }

  /* Super Lock manual mark button */
  .sl-mark-btn {
    padding: 10px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: rgba(25, 28, 30, 0.6);
    border: 1px solid #3b4b3d;
    color: #b9cbb9;
    cursor: pointer;
    transition: all 0.12s;
    font-weight: 700;
  }
  .sl-mark-btn.W:hover, .sl-mark-btn.W.current { background: rgba(97, 255, 151, 0.18); color: #61ff97; border-color: #61ff97; }
  .sl-mark-btn.L:hover, .sl-mark-btn.L.current { background: rgba(255, 59, 59, 0.18); color: #FF3B3B; border-color: #FF3B3B; }
  .sl-mark-btn.P:hover, .sl-mark-btn.P.current { background: rgba(255, 225, 109, 0.16); color: #ffe16d; border-color: #ffe16d; }

  /* Modal form fields */
  .modal label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #b9cbb9; margin-bottom: 6px; }
  .modal select, .modal input {
    width: 100%;
    background: #0c0e0f;
    border: 1px solid #3b4b3d;
    color: #e2e2e3;
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    margin-bottom: 16px;
  }
  .modal select:focus, .modal input:focus { outline: none; border-color: #61ff97; }
  .modal .btn {
    flex: 1;
    background: #00ff85;
    color: #003919;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 12px;
    border: 1px solid #00ff85;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.12s;
  }
  .modal .btn:hover { filter: brightness(1.1); }
  .modal .btn:active { transform: scale(0.97); }
  .modal .btn.ghost {
    background: transparent;
    color: #b9cbb9;
    border-color: #3b4b3d;
  }
  .modal .btn.ghost:hover { color: #e2e2e3; border-color: #b9cbb9; }
  .modal-err { color: #FF3B3B; font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-top: 12px; min-height: 14px; }

  /* Primary CTA */
  .btn-primary {
    background: #00ff85;
    color: #003919;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 12px 22px;
    border: 1px solid #00ff85;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.12s;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: scale(0.97); }

  /* Sidebar nav link */
  .side-nav-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    margin: 0 8px;
    color: #b9cbb9;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.1em;
    transition: all 0.15s;
    cursor: pointer;
    background: transparent;
    border-radius: 0.25rem;
    width: calc(100% - 16px);
    text-align: left;
  }
  .side-nav-link:hover { color: #e2e2e3; background: #282a2b; }
  .side-nav-link.active { background: #00ff85; color: #003919; }
  .side-nav-link.active .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
  .side-nav-link .material-symbols-outlined { color: #61ff97; font-size: 22px; }
  .side-nav-link.active .material-symbols-outlined { color: #003919; }

  /* Bottom mobile nav */
  .bottom-nav-link {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
    padding: 8px 0;
    color: #b9cbb9;
    cursor: pointer;
    background: transparent;
    border: none;
    transition: color 0.15s;
  }
  .bottom-nav-link:hover { color: #e2e2e3; }
  .bottom-nav-link.active { color: #61ff97; font-weight: 700; }
  .bottom-nav-link.active .material-symbols-outlined { font-variation-settings: 'FILL' 1; }

  /* Year tab */
  .year-tab {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: #b9cbb9;
    padding: 6px 12px;
    border: 1px solid #1F2427;
    cursor: pointer;
    transition: all 0.12s;
    background: transparent;
  }
  .year-tab:hover { color: #e2e2e3; border-color: #3b4b3d; }
  .year-tab.active { color: #61ff97; border-color: #61ff97; background: rgba(97, 255, 151, 0.06); }

  /* User chip */
  .user-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: #61ff97;
    cursor: pointer;
    padding: 6px 12px;
    border: 1px solid #3b4b3d;
    transition: all 0.12s;
    background: transparent;
  }
  .user-chip:hover { border-color: #61ff97; }
  .user-chip .dot { width: 6px; height: 6px; background: #61ff97; border-radius: 50%; box-shadow: 0 0 8px rgba(97,255,151,0.6); }

  /* Hide scrollbar utility */
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Member avatar */
  .avatar {
    width: 32px; height: 32px;
    border-radius: 9999px;
    background: #282a2b;
    border: 1px solid #3b4b3d;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #e2e2e3;
    flex-shrink: 0;
  }
  .avatar.lg { width: 48px; height: 48px; font-size: 16px; }
  .avatar.xl { width: 64px; height: 64px; font-size: 22px; }

  /* Cinematic hero gradient bg (placeholder for stadium image) */
  .hero-bg {
    background:
      radial-gradient(ellipse at 30% 100%, rgba(97,255,151,0.18) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 0%, rgba(0,218,248,0.10) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.5) 30%, rgba(0,0,0,0.9) 100%),
      linear-gradient(180deg, #1a1c1d 0%, #0c0e0f 100%);
  }
  .hero-bg::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.04) 1px, transparent 0);
    background-size: 24px 24px;
    pointer-events: none;
  }
  .champion-glow { box-shadow: 0 0 60px -10px rgba(233, 196, 0, 0.25); }

  /* Submit picks CTA (sidebar) */
  .submit-picks-cta {
    width: 100%;
    background: #00ff85;
    color: #003919;
    padding: 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    border: 1px solid #00ff85;
    cursor: pointer;
    transition: all 0.12s;
    border-radius: 0.25rem;
  }
  .submit-picks-cta:hover { filter: brightness(1.1); }
  .submit-picks-cta:active { transform: scale(0.97); }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen turf-overlay">

<!-- Live Ticker -->
<div id="ticker" class="w-full bg-surface-container-lowest border-b border-outline-variant h-10 flex items-center overflow-hidden sticky top-0 z-[60]">
  <div class="flex items-center gap-2 px-3 md:px-4 bg-live-red text-white h-full shrink-0 font-label-caps text-[10px] tracking-widest">
    <span class="live-pulse w-1.5 h-1.5 bg-white rounded-full"></span> LIVE LINES
  </div>
  <div class="flex-1 overflow-hidden h-full flex items-center min-w-0">
    <div id="ticker-track" class="marquee-track"></div>
  </div>
  <div class="hidden md:flex items-center gap-2 px-4 border-l border-outline-variant h-full shrink-0">
    <span class="text-on-surface-variant font-data-tabular text-[10px] tracking-widest">WK</span>
    <select id="ticker-week-select" class="bg-transparent text-primary-fixed border-none font-data-tabular text-[11px] outline-none cursor-pointer"></select>
  </div>
</div>

<script>
const DATA_URL = `data/seasons.json?v=${Date.now()}`;
const SEASONS_ORDER = ["2023", "2024", "2025", "2026"];
const SEASON_2026_KICKOFF_MS = Date.UTC(2026, 8, 10, 0, 0, 0);
function seasonsVisible() {
  const now = Date.now();
  return SEASONS_ORDER.filter(y => y !== "2026" || now >= SEASON_2026_KICKOFF_MS);
}
const BET_TYPES_ORDER = ["Favorite", "Dog", "Over", "Under", "Super Lock"];
const WEEK_COUNT = 18;

let DATA = null;
let state = {
  view: "standings",
  season: "2025",
  expanded: null,
  tickerWeek: "ALL",
  user: null,
  thisWeekData: null,
  myPicksDraft: {},
  myPicksWeek: null,
  myPicksSaveMsg: "",
};
const MEMBERS_ALL = ["Brayden","Chase","Chris","Jack","Jacob","Jared","Mason","Tyler"];

function initials(name) {
  if (!name) return "—";
  const parts = String(name).trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function parseRecord(rec) {
  if (!rec) return { w: 0, l: 0, t: 0 };
  const parts = rec.split("-").map(s => parseInt(s.trim(), 10) || 0);
  return { w: parts[0] || 0, l: parts[1] || 0, t: parts[2] || 0 };
}
function pct(rec) {
  const tot = rec.w + rec.l;
  return tot ? ((rec.w / tot) * 100).toFixed(1) : "—";
}
function recordHtml(rec) {
  return `<span class="rec-W">${rec.w}</span>-<span class="rec-L">${rec.l}</span>${rec.t ? '-<span class="rec-T">' + rec.t + '</span>' : ''}`;
}
function recordHtmlFromString(s) {
  return recordHtml(parseRecord(s));
}

function buildStandings(season) {
  const seasonInfo = DATA.seasons[season];
  if (!seasonInfo) return [];
  const rows = [];
  for (const name of seasonInfo.members) {
    const md = DATA.members[name]?.[season];
    if (!md) continue;
    const seasonRec = parseRecord(md.seasonRecord);
    let weeksWon = 0;
    for (let w = 1; w <= WEEK_COUNT; w++) {
      if (seasonInfo.weeklyWinners?.[String(w)] === name) weeksWon++;
    }
    const superRec = parseRecord(md.byType?.["Super Lock"]?.record);
    rows.push({ name, md, seasonRec, weeksWon, superRec });
  }
  rows.sort((a, b) => {
    if (b.seasonRec.w !== a.seasonRec.w) return b.seasonRec.w - a.seasonRec.w;
    if (a.seasonRec.l !== b.seasonRec.l) return a.seasonRec.l - b.seasonRec.l;
    return b.weeksWon - a.weeksWon;
  });
  return rows;
}

// --- Ticker ---
function buildTickerItems(season, weekFilter) {
  const items = [];
  const seasonInfo = DATA.seasons[season];
  if (!seasonInfo) return items;
  const weeks = weekFilter === "ALL"
    ? Array.from({ length: WEEK_COUNT }, (_, i) => i + 1)
    : [parseInt(weekFilter, 10)];

  for (const wk of weeks) {
    for (const name of seasonInfo.members) {
      const md = DATA.members[name]?.[season];
      if (!md) continue;
      for (const bt of BET_TYPES_ORDER) {
        const pick = md.byType?.[bt]?.picks?.[String(wk)] || md.byType?.[bt]?.picks?.[wk];
        if (!pick || (!pick.text && !pick.result)) continue;
        items.push({ wk, name, bt, text: pick.text || "—", result: pick.result || "" });
      }
    }
  }
  return items;
}

function btShort(bt) {
  return ({ "Favorite": "FAV", "Dog": "DOG", "Over": "OVR", "Under": "UND", "Super Lock": "SUPER 🔒" })[bt] || bt;
}
function btClass(bt) {
  return ({ "Favorite": "fav", "Dog": "dog", "Over": "over", "Under": "under", "Super Lock": "super" })[bt] || "";
}

function renderTickerItem(it) {
  const safe = escapeHtml(it.text);
  return `<span class="tk-item">
    <span class="tk-wk">WK${String(it.wk).padStart(2,"0")}</span>
    <span class="tk-name">${escapeHtml(it.name)}</span>
    <span class="tk-type ${btClass(it.bt)}">${btShort(it.bt)}</span>
    <span class="tk-pick">${safe}</span>
    ${it.result ? `<span class="tk-res ${it.result}">${it.result}</span>` : ""}
  </span>`;
}

function renderTicker() {
  const track = document.getElementById("ticker-track");
  const items = buildTickerItems(state.season, state.tickerWeek);

  if (!items.length) {
    track.innerHTML = `<span class="tk-item"><span class="tk-wk">NO PICKS</span></span>`;
    track.style.setProperty("--marquee-duration", "60s");
    return;
  }
  const html = items.map(renderTickerItem).join("");
  track.innerHTML = html + html;
  const seconds = state.tickerWeek === "ALL"
    ? Math.max(80, items.length * 2.6)
    : Math.max(60, items.length * 2.2);
  track.style.setProperty("--marquee-duration", seconds + "s");
}

function renderTickerWeekSelect() {
  const sel = document.getElementById("ticker-week-select");
  sel.innerHTML = `<option value="ALL">ALL</option>` +
    Array.from({ length: WEEK_COUNT }, (_, i) => {
      const w = i + 1;
      return `<option value="${w}" ${String(w) === state.tickerWeek ? "selected" : ""}>${String(w).padStart(2,"0")}</option>`;
    }).join("");
  sel.value = state.tickerWeek;
  sel.onchange = () => { state.tickerWeek = sel.value; renderTicker(); };
}

function syncNavActive() {
  document.querySelectorAll(".nav-link").forEach(b => {
    b.classList.toggle("active", b.dataset.view === state.view);
  });
}

// ---- View: Standings ----
function renderStandings() {
  const season = state.season;
  const rows = buildStandings(season);
  const seasonInfo = DATA.seasons[season];
  const winners = seasonInfo?.weeklyWinners || {};
  const champ = rows[0];

  const champPct = champ ? pct(champ.seasonRec) : "—";
  const champSuper = champ ? parseRecord(champ.md?.byType?.["Super Lock"]?.record) : { w: 0, l: 0, t: 0 };
  let bestBt = null, bestPct = -1, bestRec = { w: 0, l: 0, t: 0 };
  if (champ) {
    for (const bt of BET_TYPES_ORDER) {
      const r = parseRecord(champ.md?.byType?.[bt]?.record);
      const tot = r.w + r.l;
      if (!tot) continue;
      const p = r.w / tot;
      if (p > bestPct) { bestPct = p; bestBt = bt; bestRec = r; }
    }
  }
  const bestBtLabel = bestBt === "Super Lock" ? "SUPER 🔒" : (bestBt ? bestBt.toUpperCase() : "—");

  // Year filter pills
  const yearPills = `
    <div class="flex gap-2 items-center">
      ${seasonsVisible().map(y => `
        <button class="year-tab year-pill ${state.season === y ? "active" : ""}" data-year="${y}">${y}</button>
      `).join("")}
    </div>
  `;

  return `
    <!-- Champion hero -->
    <section class="relative w-full rounded-xl overflow-hidden mb-6 hero-bg champion-glow">
      <div class="absolute inset-0 bg-gradient-to-t from-background via-background/30 to-transparent z-10"></div>
      <div class="relative z-20 px-5 md:px-8 py-5 md:py-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div class="min-w-0 flex-1">
          <div class="inline-flex items-center px-2.5 py-0.5 bg-tertiary-fixed-dim text-on-tertiary-fixed font-label-caps text-[10px] rounded-sm mb-2 uppercase">
            <span class="material-symbols-outlined text-xs mr-1" style="font-variation-settings: 'FILL' 1;">military_tech</span>
            ${season} Champion
          </div>
          <h2 class="font-display-lg text-3xl md:text-5xl text-primary-fixed leading-none uppercase mb-3 break-words">${escapeHtml(champ ? champ.name : "—")}</h2>
          <div class="flex flex-wrap items-center gap-x-5 gap-y-2">
            <div class="flex items-baseline gap-2">
              <span class="text-on-surface-variant font-label-caps text-[10px]">RECORD</span>
              <span class="font-data-tabular text-base md:text-lg text-on-surface">${champ ? recordHtml(champ.seasonRec) : "—"}</span>
            </div>
            <span class="w-px h-4 bg-outline-variant"></span>
            <div class="flex items-baseline gap-2">
              <span class="text-on-surface-variant font-label-caps text-[10px]">WEEKS</span>
              <span class="font-data-tabular text-base md:text-lg text-on-surface">${champ ? champ.weeksWon : 0}</span>
            </div>
            <span class="w-px h-4 bg-outline-variant"></span>
            <div class="flex items-baseline gap-2">
              <span class="text-on-surface-variant font-label-caps text-[10px]">WIN %</span>
              <span class="font-data-tabular text-base md:text-lg text-on-surface">${champPct}%</span>
            </div>
          </div>
        </div>
        <div class="glass-card px-4 py-2.5 flex items-center gap-3 border-l-2 border-l-secondary-fixed-dim shrink-0">
          <span class="material-symbols-outlined text-2xl text-live-red">event_available</span>
          <div>
            <div class="text-on-surface-variant font-label-caps text-[9px] uppercase tracking-widest">Status</div>
            <div class="font-display-lg text-base text-live-red uppercase leading-none mt-0.5">Season Final</div>
          </div>
        </div>
      </div>
    </section>

    <!-- Year selector + section header -->
    <section class="mb-stack-lg">
      <div class="flex items-center justify-between mb-stack-md gap-3 flex-wrap">
        <h3 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface uppercase flex items-center gap-3">
          <span class="w-2 h-8 bg-primary-fixed inline-block"></span> ${season} Standings
        </h3>
        ${yearPills}
      </div>

      <div class="overflow-x-auto hide-scrollbar glass-card rounded-lg">
        <table class="w-full text-left border-collapse min-w-[640px]">
          <thead>
            <tr class="border-b border-outline-variant font-label-caps text-on-surface-variant text-[11px] tracking-widest bg-surface-container-low/50 uppercase">
              <th class="px-4 md:px-6 py-4">Rank</th>
              <th class="px-4 md:px-6 py-4">Member</th>
              <th class="px-4 md:px-6 py-4">Record (W-L)</th>
              <th class="px-4 md:px-6 py-4">Win %</th>
              <th class="px-4 md:px-6 py-4 hidden lg:table-cell">Weekly Heat (1–18)</th>
              <th class="px-4 md:px-6 py-4 text-right">Weeks Won</th>
            </tr>
          </thead>
          <tbody class="font-data-tabular">
            ${rows.map((r, i) => renderMemberRow(r, i, season)).join("")}
          </tbody>
        </table>
      </div>
    </section>

    <!-- Weekly Winners -->
    <section class="mb-stack-lg">
      <h3 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface uppercase flex items-center gap-3 mb-6">
        <span class="w-2 h-8 bg-secondary-fixed-dim inline-block"></span> Weekly Winners
      </h3>
      <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
        ${Array.from({ length: WEEK_COUNT }, (_, i) => {
          const wk = i + 1;
          const who = winners[String(wk)];
          if (!who) {
            return `
              <div class="glass-card p-4 border-dashed border-2 border-outline-variant flex flex-col items-center justify-center h-32 group hover:border-primary-fixed transition-all">
                <span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary-fixed mb-1">lock_open</span>
                <span class="font-label-caps text-[10px] text-on-surface-variant group-hover:text-primary-fixed">WK ${String(wk).padStart(2,"0")}</span>
              </div>
            `;
          }
          return `
            <div class="glass-card p-4 border-t-2 border-t-primary-fixed flex flex-col justify-between h-32 relative overflow-hidden">
              <span class="absolute right-[-10px] top-[-10px] font-display-lg text-5xl opacity-5 pointer-events-none select-none">${String(wk).padStart(2,"0")}</span>
              <span class="font-label-caps text-[10px] text-on-surface-variant">WK ${String(wk).padStart(2,"0")}</span>
              <div class="mt-2">
                <p class="font-display-lg text-xl leading-none uppercase">${escapeHtml(who)}</p>
                <p class="text-primary-fixed text-[10px] font-data-tabular mt-1">WINNER</p>
              </div>
              <div class="flex justify-between items-end">
                <span class="material-symbols-outlined text-primary-fixed/50">military_tech</span>
              </div>
            </div>
          `;
        }).join("")}
      </div>
    </section>
  `;
}

function renderMemberRow(r, i, season) {
  const isExp = state.expanded === r.name;
  const isTop = i === 0;
  const heat = Array.from({ length: WEEK_COUNT }, (_, w) => {
    const wk = w + 1;
    const winner = DATA.seasons[season]?.weeklyWinners?.[String(wk)];
    // Use overall week result: green if member won that week, red if not, gray if no picks
    const totalPicksThisWeek = BET_TYPES_ORDER.filter(bt => r.md?.byType?.[bt]?.picks?.[wk]).length;
    if (!totalPicksThisWeek) return `<div class="heat-cell"></div>`;
    if (winner === r.name) return `<div class="heat-cell W"></div>`;
    // Compute W-L for this week
    let wins = 0, losses = 0;
    for (const bt of BET_TYPES_ORDER) {
      const res = r.md?.byType?.[bt]?.picks?.[wk]?.result;
      if (res === "W") wins++;
      else if (res === "L") losses++;
    }
    if (wins > losses) return `<div class="heat-cell W"></div>`;
    if (losses > wins) return `<div class="heat-cell L"></div>`;
    return `<div class="heat-cell P"></div>`;
  }).join("");

  return `
    <tr class="member-row border-b border-outline-variant hover:bg-primary-fixed/5 transition-colors cursor-pointer group ${isExp ? "bg-primary-fixed/[0.04]" : ""}" data-name="${escapeHtml(r.name)}">
      <td class="px-4 md:px-6 py-5 ${isTop ? "text-primary-fixed font-bold" : "text-on-surface-variant font-bold"}">${i + 1}</td>
      <td class="px-4 md:px-6 py-5">
        <div class="flex items-center gap-2">
          <span class="font-display-lg text-base md:text-lg tracking-wide uppercase ${isTop ? "text-primary-fixed" : "text-on-surface"}">${escapeHtml(r.name)}</span>
          ${isTop ? '<span class="material-symbols-outlined text-tertiary-fixed-dim text-base" style="font-variation-settings: \'FILL\' 1;">workspace_premium</span>' : ""}
        </div>
      </td>
      <td class="px-4 md:px-6 py-5">${recordHtml(r.seasonRec)}</td>
      <td class="px-4 md:px-6 py-5 text-primary-fixed-dim">${pct(r.seasonRec)}${r.seasonRec.w + r.seasonRec.l ? "%" : ""}</td>
      <td class="px-4 md:px-6 py-5 hidden lg:table-cell">
        <div class="flex gap-1">${heat}</div>
      </td>
      <td class="px-4 md:px-6 py-5 text-right">
        <span class="font-display-lg text-2xl ${r.weeksWon ? "text-primary-fixed" : "text-on-surface-variant opacity-40"}">${String(r.weeksWon).padStart(2, "0")}</span>
      </td>
    </tr>
    ${isExp ? `
      <tr class="bg-surface-container-lowest/50 border-b border-outline-variant">
        <td colspan="6" class="py-5 px-3 md:px-6">${renderMemberDetail(r)}</td>
      </tr>
    ` : ""}
  `;
}

function renderMemberDetail(r) {
  const md = r.md;
  const weekHeader = Array.from({ length: WEEK_COUNT }, (_, i) =>
    `<div class="w-[26px] text-center font-data-tabular text-[9px] text-on-surface-variant">${String(i + 1).padStart(2, "0")}</div>`
  ).join("");

  const rows = BET_TYPES_ORDER.map(bt => {
    const info = md?.byType?.[bt];
    if (!info) return "";
    const cells = Array.from({ length: WEEK_COUNT }, (_, i) => {
      const wk = i + 1;
      const pick = info.picks?.[wk];
      const cls = pick?.result || "";
      const safe = (pick?.text || "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      return `<div class="week-cell ${cls}" data-week="${wk}" data-bet="${bt}" data-text="${safe}" data-result="${pick?.result || ""}">${pick?.result || ""}</div>`;
    }).join("");
    const isSuper = bt === "Super Lock";
    return `
      <div class="flex items-center gap-4 py-1.5">
        <div class="w-24 font-label-caps text-[11px] uppercase ${isSuper ? "text-tertiary-fixed" : "text-on-surface-variant"}">${isSuper ? "Super 🔒" : bt}</div>
        <div class="w-20 font-data-tabular text-[11px]">${recordHtmlFromString(info.record)}</div>
        <div class="flex gap-1">${cells}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="overflow-x-auto">
      <div class="min-w-fit">
        <div class="flex items-center gap-4 py-2 border-b border-outline-variant mb-2">
          <div class="w-24 font-label-caps text-[10px] tracking-widest text-on-surface-variant uppercase">Bet Type</div>
          <div class="w-20 font-label-caps text-[10px] tracking-widest text-on-surface-variant uppercase">Record</div>
          <div class="flex gap-1">${weekHeader}</div>
        </div>
        ${rows}
        <div class="flex flex-wrap gap-6 mt-4 pt-3 border-t border-outline-variant font-data-tabular text-[11px]">

// ---- View: Lifetime ----
function renderLifetime() {
  const members = Object.keys(DATA.members).sort();
  const agg = members.map(name => {
    const totals = { W: 0, L: 0, P: 0 };
    const byType = {};
    let weeksWon = 0;
    let seasonsAsChamp = 0;
    let seasonsPlayed = 0;
    for (const bt of BET_TYPES_ORDER) byType[bt] = { W: 0, L: 0, P: 0 };
    for (const season of SEASONS_ORDER) {
      const md = DATA.members[name]?.[season];
      if (!md) continue;
      seasonsPlayed++;
      const winners = DATA.seasons[season]?.weeklyWinners || {};
      for (const wk of Object.keys(winners)) if (winners[wk] === name) weeksWon++;
      const seasonRows = buildStandings(season);
      if (seasonRows[0]?.name === name) seasonsAsChamp++;
      for (const bt of BET_TYPES_ORDER) {
        const picks = md.byType?.[bt]?.picks || {};
        for (const wk of Object.keys(picks)) {
          const r = picks[wk]?.result;
          if (r === "W") { totals.W++; byType[bt].W++; }
          else if (r === "L") { totals.L++; byType[bt].L++; }
          else if (r === "P") { totals.P++; byType[bt].P++; }
        }
      }
    }
    // Units at -110: win = +1, loss = -1.1, push = 0
    const units = totals.W - 1.1 * totals.L;
    return { name, totals, byType, weeksWon, seasonsAsChamp, seasonsPlayed, units };
  });
  agg.sort((a, b) => b.totals.W - a.totals.W);
  const groupUnits = agg.reduce((s, m) => s + m.units, 0);
  const fmtUnits = (u) => {
    if (Math.abs(u) < 0.05) return "0.0";
    const sign = u > 0 ? "+" : "−";
    return sign + Math.abs(u).toFixed(1);
  };

  // Find historical champions, one card per season
  const champBySeason = [];
  for (const season of SEASONS_ORDER) {
    if (season === "2026") continue; // upcoming
    const rows = buildStandings(season);
    if (!rows.length) continue;
    const champ = rows[0];
    champBySeason.push({ season, champ });

  const liveSeason = "2026";

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        ${champBySeason.map(({ season, champ }) => `
          <div class="glass-card relative overflow-hidden group champion-glow">
            <div class="absolute top-0 right-0 p-4 z-10">
              <span class="material-symbols-outlined text-tertiary-fixed text-4xl drop-shadow-lg" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// NFL team name → ESPN CDN abbreviation. Logos at a.espncdn.com/i/teamlogos/nfl/500/<abbr>.png.
const TEAM_ABBR = {
  "Arizona Cardinals": "ari", "Atlanta Falcons": "atl", "Baltimore Ravens": "bal",
  "Buffalo Bills": "buf", "Carolina Panthers": "car", "Chicago Bears": "chi",
  "Cincinnati Bengals": "cin", "Cleveland Browns": "cle", "Dallas Cowboys": "dal",
  "Denver Broncos": "den", "Detroit Lions": "det", "Green Bay Packers": "gb",
  "Houston Texans": "hou", "Indianapolis Colts": "ind", "Jacksonville Jaguars": "jax",
  "Kansas City Chiefs": "kc", "Las Vegas Raiders": "lv", "Los Angeles Chargers": "lac",
  "Los Angeles Rams": "lar", "Miami Dolphins": "mia", "Minnesota Vikings": "min",
  "New England Patriots": "ne", "New Orleans Saints": "no", "New York Giants": "nyg",
  "New York Jets": "nyj", "Philadelphia Eagles": "phi", "Pittsburgh Steelers": "pit",
  "San Francisco 49ers": "sf", "Seattle Seahawks": "sea", "Tampa Bay Buccaneers": "tb",
  "Tennessee Titans": "ten", "Washington Commanders": "wsh",
};
function teamAbbr(name) {
  return TEAM_ABBR[name] || (name || "").split(/\s+/).slice(-1)[0].slice(0, 3).toLowerCase();
}
function teamLogoUrl(name) {
  return `https://a.espncdn.com/i/teamlogos/nfl/500/${teamAbbr(name)}.png`;
}
function teamShort(name) {
  return teamAbbr(name).toUpperCase();
}
// Render only the team logo (no overlaid text). On image error, swap in the abbreviation.
function teamLogoMark(name, sizeClasses, fallbackTextClasses) {
  const abbr = teamShort(name);
  return `<img src="${teamLogoUrl(name)}" alt="${abbr}" class="${sizeClasses} object-contain" loading="lazy" onerror="var s=document.createElement('span');s.className='${fallbackTextClasses}';s.textContent='${abbr}';this.replaceWith(s)">`;
}

// =================== Auth / session ===================
async function fetchMe() {
  try {
    const r = await fetch("/api/auth?action=me", { credentials: "include" });
    if (!r.ok) return null;
    const j = await r.json();
    return j.member;
  } catch { return null; }
}
async function loginSubmit() {
  const name = document.getElementById("login-name").value;
  const pass = document.getElementById("login-pass").value;
  const err = document.getElementById("login-err");
  err.textContent = "";
  try {
    const r = await fetch("/api/auth?action=login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ name, passphrase: pass }),
    });
    const j = await r.json();
    if (!r.ok) { err.textContent = j.error === "bad-passphrase" ? "Wrong passphrase." : "Login failed."; return; }
    state.user = j.member;
    document.getElementById("login-modal").classList.remove("show");
    render();
  } catch (e) { err.textContent = "Network error: " + e.message; }
}
async function logout() {
  await fetch("/api/auth?action=logout", { method: "POST", credentials: "include" }).catch(()=>{});
  state.user = null;
  render();
}
function openLogin() {
  const sel = document.getElementById("login-name");
  sel.innerHTML = MEMBERS_ALL.map(n => `<option>${n}</option>`).join("");
  document.getElementById("login-err").textContent = "";
  document.getElementById("login-pass").value = "";
  document.getElementById("login-modal").classList.add("show");
  setTimeout(() => document.getElementById("login-pass").focus(), 50);
}

async function loadOdds() {
  if (state.thisWeekData) return state.thisWeekData;
  try {
    const r = await fetch("/api/odds", { credentials: "include" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    state.thisWeekData = await r.json();
  } catch (e) {
    state.thisWeekData = { source: "error", error: e.message, games: [] };
  }
  return state.thisWeekData;

function fmtKickoffDay(iso) {
  const d = new Date(iso);
  return d.toLocaleString("en-US", { weekday: "short" }).toUpperCase();
}
function fmtKickoffTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString("en-US", { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
}

function americanOdds(p) {
  if (p == null) return "";
  return p > 0 ? `+${p}` : `${p}`;
}

function nextKickoffCountdown(games) {
  const now = Date.now();
  const next = games
    .map(g => new Date(g.kickoff).getTime())
    .filter(t => t > now)
    .sort((a, b) => a - b)[0];
  if (!next) return null;
  const ms = next - now;
  const days = Math.floor(ms / 86400000);
  const hrs = Math.floor((ms % 86400000) / 3600000);
  const mins = Math.floor((ms % 3600000) / 60000);
  return { days, hrs, mins };
}

function showToast(msg, kind = "ok") {
  const el = document.getElementById("toast");
  if (!el) return;
  el.className = "toast " + (kind === "err" ? "err" : kind === "warn" ? "warn" : "") + " show";
  el.textContent = msg;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 2800);
}

function markPickedButtons(picksByBetType) {
  const buttons = document.querySelectorAll(".pick-btn[data-bet]");
  buttons.forEach(b => b.classList.remove("picked"));
  if (!picksByBetType) return;
  for (const [bt, pick] of Object.entries(picksByBetType)) {
    if (!pick.game_key) continue;
    const match = document.querySelector(
      `.pick-btn[data-bet="${bt}"][data-game="${pick.game_key}"][data-side="${pick.side}"][data-book="${pick.book}"]`
    );
    if (match) match.classList.add("picked");
  }
}

async function clickPickButton(btn) {
  if (!state.user) {
    showToast("SIGN IN TO PICK", "warn");
    openLogin();
    return;
  }
  const bet_type = btn.dataset.bet;
  const game_key = btn.dataset.game;
  const side = btn.dataset.side;
  const line = btn.dataset.line ? Number(btn.dataset.line) : null;
  const book = btn.dataset.book;
  const price = btn.dataset.price ? Number(btn.dataset.price) : null;
  const pick_text = btn.dataset.text;
  const cur = currentNflWeekClient();
  const season = 2026;
  const week = state.myPicksWeek || cur.week || 1;

  btn.classList.add("saving");
  try {
    const r = await fetch("/api/picks", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ season, week, picks: [{ bet_type, pick_text, game_key, side, line, book, price }] }),
    });
    const j = await r.json();
    if (!r.ok) {
      showToast(j.error === "locked" ? "LOCKED · CUTOFF PASSED" : "ERROR · " + (j.error || "unknown"), "err");
    } else {
      document.querySelectorAll(`.pick-btn[data-bet="${bet_type}"]`).forEach(b => b.classList.remove("picked"));
      btn.classList.add("picked");
      showToast(`✓ ${bet_type.toUpperCase()} · ${pick_text}`);
    }
  } catch (e) {
    showToast("NETWORK ERROR", "err");
  } finally {
    btn.classList.remove("saving");
  }
}

function currentNflWeekClient() {
  const kickoff = Date.UTC(2026, 8, 10);
  const week1Start = kickoff - 2 * 24 * 3600 * 1000;
  const now = Date.now();
  if (now < week1Start) return { season: null, week: null };
  const wk = Math.floor((now - week1Start) / (7 * 24 * 3600 * 1000));
  if (wk >= 18) return { season: 2026, week: 18 };
  return { season: 2026, week: wk + 1 };
}

}

          <div class="font-display-lg text-2xl text-on-surface uppercase">🔒 Week ${week}</div>
        </div>
        <div class="font-label-caps text-[10px] tracking-widest text-on-surface-variant uppercase">Grade Manually</div>
      </div>
      <div class="bg-surface-container-lowest/60 border border-outline-variant p-4 mb-5 font-data-tabular text-sm">${escapeHtml(sl.pick_text)}</div>
      <div class="flex flex-wrap gap-2">
        <button class="sl-mark-btn W ${sl.result === 'W' ? 'current' : ''}" data-result="W">Hit · W</button>
        <button class="sl-mark-btn L ${sl.result === 'L' ? 'current' : ''}" data-result="L">Miss · L</button>
        <button class="sl-mark-btn P ${sl.result === 'P' ? 'current' : ''}" data-result="P">Push · P</button>
      </div>
      ${sl.graded_at ? `<div class="font-data-tabular text-[10px] text-on-surface-variant mt-4 tracking-widest uppercase">Last marked · ${new Date(sl.graded_at).toLocaleString()}</div>` : ""}
    </section>
  ` : "";

  return `
    <section class="mb-stack-lg flex flex-col md:flex-row md:items-end md:justify-between gap-4">
      <div>
        <div class="font-label-caps text-label-caps text-primary-fixed uppercase">Weekly · Submission</div>
        <h1 class="font-display-lg text-4xl md:text-display-lg leading-tight text-primary-fixed uppercase">${escapeHtml(state.user.name)}</h1>
      </div>
      <div class="glass-panel px-5 py-3 flex items-center gap-stack-sm border border-outline-variant">
        <button class="material-symbols-outlined p-1 text-on-surface-variant hover:text-primary-fixed transition-colors disabled:opacity-30" id="week-prev" ${week <= 1 ? "disabled" : ""}>chevron_left</button>
        <span class="font-data-tabular text-data-tabular px-4 text-primary-fixed-dim font-bold uppercase">Week ${week}</span>
        <button class="material-symbols-outlined p-1 text-on-surface-variant hover:text-primary-fixed transition-colors disabled:opacity-30" id="week-next" ${week >= 18 ? "disabled" : ""}>chevron_right</button>
      </div>
    </section>

    <section class="glass-panel p-6 md:p-8 space-y-5">
      ${rows}
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pt-5 border-t border-outline-variant">
        <div class="font-label-caps text-[10px] tracking-widest text-on-surface-variant uppercase" id="lock-status">Cutoff · Sun 12:00 AM CT</div>
        <div class="flex items-center gap-4">
          <span class="font-data-tabular text-[11px] tracking-widest text-primary-fixed" id="save-msg">${escapeHtml(state.myPicksSaveMsg || "")}</span>
          <button class="btn-primary" id="picks-save">Save Picks <span class="material-symbols-outlined text-sm align-middle ml-1">send</span></button>
        </div>
      </div>
    </section>
    ${slMarkHtml}
  `;
}

async function markSuperLock(result) {
  const cur = currentNflWeekClient();
  const season = 2026;
  const week = state.myPicksWeek || cur.week || 1;
  try {
    const r = await fetch("/api/picks?action=mark-super-lock", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ season, week, result }),
    });
    const j = await r.json();
    if (!r.ok) { state.myPicksSaveMsg = "MARK ERROR · " + (j.error || "unknown"); }
    else { state.myPicksSaveMsg = `SUPER 🔒 MARKED ${result}`; }
  } catch (e) { state.myPicksSaveMsg = "NETWORK ERROR"; }
  render();
}

async function submitMyPicks() {
  const inputs = document.querySelectorAll(".pick-input");
  const picks = [];
  inputs.forEach(inp => {
    const text = inp.value.trim();
    if (text) picks.push({ bet_type: inp.dataset.bet, pick_text: text });
  });
  if (!picks.length) return;
  const week = state.myPicksWeek || 1;
  const season = 2026;
  try {
    const r = await fetch("/api/picks", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ season, week, picks }),
    });
    const j = await r.json();
    if (!r.ok) {
      state.myPicksSaveMsg = j.error === "locked" ? "LOCKED · CUTOFF PASSED" : "ERROR · " + j.error;
    } else {
      state.myPicksSaveMsg = `SAVED · ${j.count} PICKS`;
    }
  } catch (e) { state.myPicksSaveMsg = "NETWORK ERROR"; }
  render();
}

async function render() {
  renderTickerWeekSelect();
  renderTicker();
  renderUserArea();
  syncNavActive();
  const root = document.getElementById("root");
  if (state.view === "standings") {
    root.innerHTML = renderStandings();
    attachStandingsHandlers();
    document.querySelectorAll(".year-pill").forEach(b => {
      b.addEventListener("click", () => {
        state.season = b.dataset.year;
        state.expanded = null;
        render();
      });
    });
  } else if (state.view === "lifetime") {
    root.innerHTML = renderLifetime();
    document.querySelectorAll(".archive-link").forEach(c => {
      c.addEventListener("click", () => {
        state.view = "standings";
        state.season = c.dataset.season;
        state.expanded = null;
        render();
      });
    });
  } else if (state.view === "rules") {
    root.innerHTML = renderRules();
  } else if (state.view === "thisweek") {
    root.innerHTML = `<div class="py-20 text-center font-data-tabular text-on-surface-variant tracking-widest uppercase text-sm">Loading live lines…</div>`;
    await loadOdds();
    root.innerHTML = renderThisWeek();
    document.querySelectorAll(".pick-btn[data-bet]").forEach(b => {
      b.addEventListener("click", () => clickPickButton(b));
    });
    const cur = currentNflWeekClient();
    const week = state.myPicksWeek || cur.week || 1;
    const myPicks = await loadMyPickedSet(2026, week);
    markPickedButtons(myPicks);
    document.querySelectorAll(".jump-mypicks").forEach(b => {
      b.addEventListener("click", () => { state.view = "mypicks"; render(); });
    });
  } else if (state.view === "mypicks") {
    root.innerHTML = await renderMyPicks();
    const saveBtn = document.getElementById("picks-save");
    if (saveBtn) saveBtn.onclick = submitMyPicks;
    document.querySelectorAll(".sl-mark-btn").forEach(b => {
      b.onclick = () => markSuperLock(b.dataset.result);
    });
    const prompt = document.getElementById("signin-prompt");
    if (prompt) prompt.onclick = openLogin;
    const wkPrev = document.getElementById("week-prev");
    const wkNext = document.getElementById("week-next");
    if (wkPrev) wkPrev.onclick = () => {
      const cur = currentNflWeekClient();
      const wk = state.myPicksWeek || cur.week || 1;
      state.myPicksWeek = Math.max(1, wk - 1);
      render();
    };
    if (wkNext) wkNext.onclick = () => {
      const cur = currentNflWeekClient();
      const wk = state.myPicksWeek || cur.week || 1;
      state.myPicksWeek = Math.min(18, wk + 1);
      render();
    };
  }
}

function attachStandingsHandlers() {
  document.querySelectorAll(".member-row").forEach(row => {
    row.addEventListener("click", () => {
      const name = row.dataset.name;
      state.expanded = state.expanded === name ? null : name;
      render();
    });
  });
  const tt = document.getElementById("tooltip");
  document.querySelectorAll(".week-cell").forEach(cell => {
    cell.addEventListener("mouseenter", () => {
      const wk = cell.dataset.week;
      const bet = cell.dataset.bet;
      const text = cell.dataset.text;
      const result = cell.dataset.result;
      if (!text && !result) return;
      tt.innerHTML = `
        <div class="tt-meta">${bet} · WEEK ${String(wk).padStart(2,"0")}</div>
        <div class="tt-pick">${escapeHtml(text || "—")}</div>
        ${result ? `<span class="tt-result ${result}">${ {W:"WIN",L:"LOSS",P:"PUSH"}[result] }</span>` : ""}
      `;
      tt.classList.add("show");
    });
    cell.addEventListener("mousemove", (e) => {
      const pad = 14;
      let x = e.clientX + pad, y = e.clientY + pad;
      const r = tt.getBoundingClientRect();
      if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
      if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
      tt.style.left = x + "px"; tt.style.top = y + "px";
    });
    cell.addEventListener("mouseleave", () => tt.classList.remove("show"));
  });
}

// Nav click handlers
document.querySelectorAll(".nav-link[data-view]").forEach(btn => {
  btn.addEventListener("click", () => {
    state.view = btn.dataset.view;
    state.expanded = null;
    render();
  });
});

// Sidebar submit picks shortcut
document.getElementById("sidebar-submit-picks").addEventListener("click", () => {
  if (!state.user) { openLogin(); return; }
  state.view = "mypicks";
  render();
});

// Login modal handlers
document.getElementById("login-submit").onclick = loginSubmit;
document.getElementById("login-cancel").onclick = () => document.getElementById("login-modal").classList.remove("show");
document.getElementById("login-pass").addEventListener("keydown", e => { if (e.key === "Enter") loginSubmit(); });

// Boot
(async () => {
  state.user = await fetchMe();
  const r = await fetch(DATA_URL);
  DATA = await r.json();
  render();
})().catch(err => {
  document.getElementById("root").innerHTML = `<div class="text-live-red p-6">Failed to load data: ${err.message}</div>`;
});
</script>

</body>
</html>
