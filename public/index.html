<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">

<title>Lock League // 2026</title>
<meta name="description" content="NFL weekly pick league. Lock your Favorite, Dog, Over, Under, and Super Lock every week.">

<!-- PWA / home-screen -->
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" href="icons/mark.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">

<meta name="mobile-web-app-capable" content="yes">

<meta property="og:title" content="Lock League">
<meta property="og:description" content="NFL weekly pick league. Lock 5 every week.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<!-- Prebuilt Tailwind (tailwind.config.js). After editing classes here, rebuild: npm run build:css -->
<link rel="stylesheet" href="assets/tailwind.css">
<style>
  * { box-sizing: border-box; }
  html, body { background: #0e1011; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    color: #e6e8e8;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100dvh;
  }
  ::selection { background: rgba(34, 227, 127, 0.25); color: #eef2ef; }

  /* Keyboard focus ring (a11y) */
  :focus-visible { outline: 2px solid #46e08a; outline-offset: 2px; border-radius: 4px; }
  button:focus:not(:focus-visible) { outline: none; }

  /* Slim neutral scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #272b2e; border-radius: 8px; border: 2px solid #0e1011; }
  ::-webkit-scrollbar-thumb:hover { background: #333a3a; }

  /* Turf overlay retired (kept as no-op so existing class refs are harmless) */
  .turf-overlay {}

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
    .marquee-track { animation: none !important; }
  }

  .display { font-family: 'Oswald', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .font-display-lg { font-family: 'Oswald', sans-serif; font-weight: 700; }
  .font-label-caps { font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: 0.1em; }
  .font-headline-lg { font-family: 'Oswald', sans-serif; font-weight: 600; }
  .font-body-md { font-family: 'Inter', sans-serif; }
  .font-data-tabular { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  .text-label-caps { font-size: 12px; line-height: 16px; letter-spacing: 0.1em; font-weight: 700; }
  .text-display-lg { font-size: 72px; line-height: 80px; letter-spacing: -0.02em; font-weight: 700; }
  .text-headline-lg { font-size: 32px; line-height: 40px; letter-spacing: 0.02em; font-weight: 600; }
  .text-headline-lg-mobile { font-size: 24px; line-height: 32px; font-weight: 600; }
  .text-body-md { font-size: 16px; line-height: 24px; font-weight: 400; }
  .text-data-tabular { font-size: 14px; line-height: 20px; font-weight: 500; font-family: 'JetBrains Mono', monospace; }

  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    vertical-align: middle;
  }

  /* Surface panels (was glassmorphism everywhere; now clean solid surfaces
     so the accent green can actually pop). Blur is reserved for the sticky
     nav + modal, which opt in themselves. */
  .glass-card, .glass-panel {
    background: #16191b;
    border: 1px solid #29302f;
    border-radius: 0.625rem;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.02), 0 10px 30px -22px rgba(0,0,0,0.9);
  }
  .card-hover { transition: border-color 0.15s, transform 0.15s, background 0.15s; }
  .card-hover:hover { border-color: #33403a; }

  /* Record colors */
  .rec-W { color: #46e08a; }
  .rec-L { color: #ef4444; }
  .rec-T, .rec-P { color: #f4cf5a; }

  /* Live pulse (calmer) */
  @keyframes pulse-red {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
    70% { box-shadow: 0 0 0 7px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
  }
  .live-pulse { animation: pulse-red 2.4s infinite; }

  /* Live lines: pulsing dot + a brief flash when a number moves */
  .live-dot { width:7px; height:7px; border-radius:9999px; background:#46e08a; display:inline-block; box-shadow:0 0 0 0 rgba(70,224,138,.6); animation: pulse-green 2.2s infinite; }
  .idle-dot { width:7px; height:7px; border-radius:9999px; background:#46504f; display:inline-block; }
  @keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(70,224,138,0.55); }
    70% { box-shadow: 0 0 0 6px rgba(70,224,138,0); }
    100% { box-shadow: 0 0 0 0 rgba(70,224,138,0); }
  }
  @keyframes lineFlash {
    0% { background: rgba(70,224,138,0.30); }
    100% { background: transparent; }
  }
  .line-flash { animation: lineFlash 1.8s ease-out; border-radius: 4px; }
  .move-caret { font-size: 8px; margin-left: 3px; vertical-align: middle; color: #46e08a; animation: caretFade 3s ease-out forwards; }
  .move-caret.down { color: #f5a24a; }
  @keyframes caretFade { 0%,70% { opacity: 1; } 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .live-dot, .line-flash, .move-caret { animation: none; }
  }

  /* Skeleton loader (taste: skeletal loaders matching layout, not spinners) */
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .skeleton { position: relative; overflow: hidden; background: #16191b; border: 1px solid #212725; border-radius: 0.625rem; }
  .skeleton::after {
    content: ""; position: absolute; inset: 0;
    transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.04), transparent);
    animation: shimmer 1.4s infinite;
  }

  /* Ticker marquee */
  @keyframes marquee {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .marquee-track {
    display: inline-flex;
    width: max-content;
    animation: marquee var(--marquee-duration, 80s) linear infinite;
    white-space: nowrap;
    align-items: center;
  }
  .marquee-track:hover { animation-play-state: paused; }
  .tk-item { display: inline-flex; align-items: center; gap: 8px; padding: 0 20px; height: 100%; border-right: 1px solid #212725; }
  .tk-wk { color: #6f7877; font-size: 10px; letter-spacing: 0.12em; }
  .tk-name { color: #e6e8e8; font-weight: 600; font-size: 11px; }
  .tk-type { font-size: 10px; letter-spacing: 0.08em; padding: 2px 6px; border: 1px solid #2c332f; border-radius: 4px; }
  .tk-type.fav { color: #46e08a; border-color: rgba(70,224,138,0.30); }
  .tk-type.dog { color: #38bdf8; border-color: rgba(56,189,248,0.30); }
  .tk-type.over { color: #f5a24a; border-color: rgba(245,162,74,0.30); }
  .tk-type.under { color: #22d3cf; border-color: rgba(34,211,207,0.30); }
  .tk-type.super { color: #f4cf5a; border-color: rgba(244,207,90,0.34); }
  .tk-pick { color: #9aa4a2; font-size: 11px; }
  .tk-res { font-size: 10px; padding: 1px 5px; font-weight: 700; border-radius: 3px; }
  .tk-res.W { background: rgba(70,224,138,0.16); color: #46e08a; }
  .tk-res.L { background: rgba(239,68,68,0.16); color: #ef4444; }
  .tk-res.P { background: rgba(244,207,90,0.16); color: #f4cf5a; }

  /* Ticker week dropdown - keep options legible when the native panel opens
     (browsers default to white panel + inherited primary-fixed text, which
     is unreadable). */
  #ticker-week-select option {
    background: #0a0c0d;
    color: #e6e8e8;
    font-family: 'JetBrains Mono', monospace;
  }

  /* Heat strip cells (Standings overview) */
  .heat-cell { width: 0.75rem; height: 1.25rem; border-radius: 2px; background: #272b2e; transition: transform 0.1s; }
  .heat-cell.W { background: #46e08a; }
  .heat-cell.L { background: #ef4444; }
  .heat-cell.P { background: #f4cf5a; }
  .heat-cell:hover { transform: scaleY(1.3); }

  /* Compact heat dots (shown under member name below lg) */
  .heat-dot { width: 5px; height: 10px; background: #272b2e; border-radius: 2px; flex-shrink: 0; }
  .heat-dot.W { background: #46e08a; }
  .heat-dot.L { background: #ef4444; }
  .heat-dot.P { background: #f4cf5a; }


  /* Week cell (member detail grid) */
  .week-cell {
    width: 26px; height: 26px; border-radius: 4px;
    background: #141618;
    border: 1px solid #262a2d;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    color: #6f7877;
    transition: transform 0.1s, border-color 0.1s;
  }
  .week-cell.W { background: rgba(70, 224, 138, 0.16); color: #46e08a; border-color: rgba(70, 224, 138, 0.35); }
  .week-cell.L { background: rgba(239, 68, 68, 0.16); color: #ef4444; border-color: rgba(239, 68, 68, 0.35); }
  .week-cell.P { background: rgba(244, 207, 90, 0.14); color: #f4cf5a; border-color: rgba(244, 207, 90, 0.35); }
  .week-cell:hover { transform: scale(1.18); z-index: 5; position: relative; }

  /* Tooltip */
  .tooltip {
    position: fixed;
    background: #0a0c0d;
    border: 1px solid #2c332f;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    pointer-events: none;
    z-index: 100;
    opacity: 0;
    transition: opacity 0.15s;
    max-width: 280px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.6);
  }
  .tooltip.show { opacity: 1; }
  .tooltip .tt-meta { color: #9aa4a2; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 6px; }
  .tooltip .tt-pick { color: #e6e8e8; font-weight: 600; margin-bottom: 6px; }
  .tooltip .tt-result { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: 0.1em; }
  .tooltip .tt-result.W { background: rgba(70, 224, 138, 0.2); color: #46e08a; }
  .tooltip .tt-result.L { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
  .tooltip .tt-result.P { background: rgba(244, 207, 90, 0.18); color: #f4cf5a; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    right: 20px;
    background: #0a0c0d;
    border: 1px solid #262a2d;
    border-left: 3px solid #46e08a;
    border-radius: 8px;
    padding: 14px 20px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.06em;
    z-index: 200;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 12px 36px rgba(0,0,0,0.6);
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.err { border-left-color: #ef4444; color: #ef4444; }
  .toast.warn { border-left-color: #f4cf5a; color: #f4cf5a; }
  @media (min-width: 768px) { .toast { bottom: 24px; } }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.68);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: #16191b;
    border: 1px solid #29302f;
    border-radius: 14px;
    padding: 32px;
    width: 380px;
    max-width: 92vw;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.8);
  }

  /* Pick button (clickable book cell), tinted per bet type */
  .pick-btn {
    --accent: #46e08a;
    --accent-soft: rgba(70, 224, 138, 0.12);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 9px 6px;
    min-height: 54px;
    background: #14171a;
    border: 1px solid #262a2d;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.12s, background 0.12s, transform 0.08s;
    min-width: 0;
  }
  .pick-btn.bt-dog   { --accent: #38bdf8; --accent-soft: rgba(56, 189, 248, 0.12); }
  .pick-btn.bt-over  { --accent: #f5a24a; --accent-soft: rgba(245, 162, 74, 0.12); }
  .pick-btn.bt-under { --accent: #22d3cf; --accent-soft: rgba(34, 211, 207, 0.12); }
  .pick-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
  .pick-btn:active { transform: scale(0.97); }
  .pick-btn.picked { background: var(--accent-soft); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .pick-btn.saving { opacity: 0.5; pointer-events: none; }
  .pick-btn.locked { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  .pick-btn .pb-label { font-size: 9px; letter-spacing: 0.13em; color: #9aa4a2; text-transform: uppercase; font-family: 'Inter', sans-serif; font-weight: 700; }
  .pick-btn .pb-value { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--accent); font-weight: 600; line-height: 1.1; }
  .pick-btn.picked .pb-value { font-weight: 700; }
  .pick-btn .pb-price { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #6f7877; }

  /* Pick input (My Picks) */
  .pick-input {
    width: 100%;
    background: #101315;
    border: 1px solid #29302f;
    border-radius: 8px;
    color: #e6e8e8;
    padding: 12px 14px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .pick-input:focus { outline: none; border-color: #46e08a; box-shadow: 0 0 0 3px rgba(70,224,138,0.14); }
  .pick-input::placeholder { color: #616a69; }

  /* Super Lock manual mark button */
  .sl-mark-btn {
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: #14171a;
    border: 1px solid #29302f;
    color: #9aa4a2;
    cursor: pointer;
    transition: all 0.12s;
    font-weight: 700;
  }
  .sl-mark-btn:active { transform: scale(0.97); }
  .sl-mark-btn.W:hover, .sl-mark-btn.W.current { background: rgba(70, 224, 138, 0.16); color: #46e08a; border-color: #46e08a; }
  .sl-mark-btn.L:hover, .sl-mark-btn.L.current { background: rgba(239, 68, 68, 0.16); color: #ef4444; border-color: #ef4444; }
  .sl-mark-btn.P:hover, .sl-mark-btn.P.current { background: rgba(244, 207, 90, 0.16); color: #f4cf5a; border-color: #f4cf5a; }

  /* Modal form fields */
  .modal label { display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: #9aa4a2; margin-bottom: 6px; }
  .modal select, .modal input {
    width: 100%;
    background: #0a0c0d;
    border: 1px solid #29302f;
    border-radius: 8px;
    color: #e6e8e8;
    padding: 11px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    margin-bottom: 16px;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .modal select:focus, .modal input:focus { outline: none; border-color: #46e08a; box-shadow: 0 0 0 3px rgba(70,224,138,0.14); }
  .modal .btn {
    flex: 1;
    background: #1fd97b;
    color: #04220f;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 12px;
    border: 1px solid #1fd97b;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    transition: filter 0.12s, transform 0.08s, border-color 0.12s, color 0.12s;
  }
  .modal .btn:hover { filter: brightness(1.06); }
  .modal .btn:active { transform: scale(0.97); }
  .modal .btn.ghost {
    background: transparent;
    color: #9aa4a2;
    border-color: #29302f;
  }
  .modal .btn.ghost:hover { color: #e6e8e8; border-color: #46504f; filter: none; }
  .modal-err { color: #ef4444; font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-top: 12px; min-height: 14px; }

  /* Primary CTA */
  .btn-primary {
    background: #1fd97b;
    color: #04220f;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 12px 22px;
    border: 1px solid #1fd97b;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 700;
    transition: filter 0.12s, transform 0.08s;
  }
  .btn-primary:hover { filter: brightness(1.06); }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }

  /* Sidebar nav link */
  .side-nav-link {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    margin: 0 10px;
    color: #9aa4a2;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.06em;
    transition: color 0.15s, background 0.15s, box-shadow 0.15s;
    cursor: pointer;
    background: transparent;
    border-radius: 8px;
    width: calc(100% - 20px);
    text-align: left;
  }
  .side-nav-link:hover { color: #e6e8e8; background: #191c1e; }
  .side-nav-link.active { background: rgba(31, 217, 123, 0.12); color: #46e08a; box-shadow: inset 3px 0 0 #1fd97b; }
  .side-nav-link.active .material-symbols-outlined { font-variation-settings: 'FILL' 1; }
  .side-nav-link .material-symbols-outlined { color: #6f7877; font-size: 22px; transition: color 0.15s; }
  .side-nav-link:hover .material-symbols-outlined { color: #9aa4a2; }
  .side-nav-link.active .material-symbols-outlined { color: #46e08a; }

  /* Bottom mobile nav */
  .bottom-nav-link {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; gap: 2px;
    padding: 8px 0;
    color: #b9cbb9;
    cursor: pointer;
    background: transparent;
    border: none;
    transition: color 0.15s;
  }
  .bottom-nav-link:hover { color: #e6e8e8; }
  .bottom-nav-link.active { color: #46e08a; font-weight: 700; }
  .bottom-nav-link.active .material-symbols-outlined { font-variation-settings: 'FILL' 1; }

  /* Year tab */
  .year-tab {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: #9aa4a2;
    padding: 6px 12px;
    border: 1px solid #262a2d;
    border-radius: 7px;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
    background: transparent;
  }
  .year-tab:hover { color: #e6e8e8; border-color: #46504f; }
  .year-tab.active { color: #46e08a; border-color: rgba(70,224,138,0.55); background: rgba(70, 224, 138, 0.08); }

  /* User chip */
  .user-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #46e08a;
    cursor: pointer;
    padding: 7px 13px;
    border: 1px solid #29302f;
    border-radius: 8px;
    transition: border-color 0.12s, background 0.12s;
    background: transparent;
  }
  .user-chip:hover { border-color: rgba(70,224,138,0.5); background: rgba(70,224,138,0.05); }
  .user-chip .dot { width: 6px; height: 6px; background: #46e08a; border-radius: 50%; box-shadow: 0 0 7px rgba(70,224,138,0.55); }

  /* Hide scrollbar utility */
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

  /* Member avatar */
  .avatar {
    width: 32px; height: 32px;
    border-radius: 9999px;
    background: #202426;
    border: 1px solid #2c332f;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #e6e8e8;
    flex-shrink: 0;
  }

<script>
// Plain URL - the host serves an ETag, so repeat visits get a 304 instead of
// re-downloading ~270KB of history every load.
const DATA_URL = "data/seasons.json";
const SEASONS_ORDER = ["2023", "2024", "2025", "2026"];
const SEASON_2026_KICKOFF_MS = Date.UTC(2026, 8, 10, 0, 0, 0);
function seasonsVisible() {
  const now = Date.now();
  return SEASONS_ORDER.filter(y => y !== "2026" || now >= SEASON_2026_KICKOFF_MS);
}
const BET_TYPES_ORDER = ["Favorite", "Dog", "Over", "Under", "Super Lock"];
const BET_META = {
  "Favorite":   { short: "FAV",   key: "fav",   color: "#46e08a", cls: "bt-fav" },
  "Dog":        { short: "DOG",   key: "dog",   color: "#38bdf8", cls: "bt-dog" },
  "Over":       { short: "OVER",  key: "over",  color: "#f5a24a", cls: "bt-over" },
  "Under":      { short: "UNDER", key: "under", color: "#22d3cf", cls: "bt-under" },
  "Super Lock": { short: "SUPER", key: "super", color: "#f4cf5a", cls: "bt-super" },
};
const WEEK_COUNT = 18;
let currentMyPicks = {}; // member's picks for the active This Week board (for My Card + highlight)

let DATA = null;
let state = {
  view: "standings",
  season: "2025",
  expanded: null,
  tickerWeek: "ALL",
  user: null,
  thisWeekData: null,
  myPicksDraft: {},
  myPicksWeek: null,
  myPicksSaveMsg: "",
};
const MEMBERS_ALL = ["Brayden","Chase","Chris","Jack","Jacob","Jared","Mason","Tyler"];

// Per-member accent colors - used on avatars, standings, ticker, hero.
const MEMBER_COLORS = {
  Brayden: "#fb923c", Chase: "#22d3ee", Chris: "#a78bfa", Jack: "#34d399",
  Jacob: "#60a5fa", Jared: "#f472b6", Mason: "#facc15", Tyler: "#fb7185",
};
function memberColor(name) { return MEMBER_COLORS[name] || "#8A9296"; }
function memberDot(name, extra = "") {
  return `<span class="w-1.5 h-1.5 rounded-full inline-block shrink-0 ${extra}" style="background:${memberColor(name)}"></span>`;
}

// Units at -110: win = +1, loss = -1.1, push = 0.
function fmtUnits(u) {
  if (Math.abs(u) < 0.05) return "0.0";
  const sign = u > 0 ? "+" : "−";
  return sign + Math.abs(u).toFixed(1);
}

// Loose team matching, mirrors the server ("Chiefs" ↔ "Kansas City Chiefs").
function normTeamName(s) { return String(s || "").replace(/[^a-zA-Z0-9]/g, "").toLowerCase(); }
function sameTeamName(a, b) {
  const na = normTeamName(a), nb = normTeamName(b);
  if (!na || !nb) return false;
  return na === nb || na.includes(nb) || nb.includes(na);
}

// =================== Live 2026 season (from /api/picks) ===================
// Historical seasons come from seasons.json; the live season lives in the DB.
// Merge it into DATA so standings / ticker / lifetime render it identically.
let DATA_VERSION = 0;
let live2026Promise = null;

function ensureLive2026() {
  if (!seasonsVisible().includes("2026")) return Promise.resolve();
  if (!live2026Promise) {
    live2026Promise = fetch("/api/picks?season=2026", { credentials: "include" })
      .then(r => (r.ok ? r.json() : { picks: [] }))
      .then(j => { mergeLiveSeason(j.picks || []); DATA_VERSION++; })
      .catch(() => {});
  }
  return live2026Promise;
}

function mergeLiveSeason(rows) {
  const byMember = {};
  for (const p of rows) {
    if (!p.member_name || p.season !== 2026) continue;
    const m = byMember[p.member_name] || (byMember[p.member_name] = {});
    const bt = m[p.bet_type] || (m[p.bet_type] = {});
    bt[p.week] = { text: p.pick_text || "", result: p.result || "" };
  }
  const names = Object.keys(byMember).length ? Object.keys(byMember).sort() : MEMBERS_ALL.slice();

  // Provisional weekly winners: unique best W (fewest L breaks ties) among
  // graded picks. Ties stay open - no winner shown for that week.
  const weeklyWinners = {};
  for (let wk = 1; wk <= WEEK_COUNT; wk++) {
    let best = null, tied = false;
    for (const name of names) {
      let w = 0, l = 0, any = false;
      for (const bt of BET_TYPES_ORDER) {
        const r = byMember[name]?.[bt]?.[wk]?.result;
        if (r === "W") { w++; any = true; }
        else if (r === "L") { l++; any = true; }
        else if (r === "P") { any = true; }
      }
      if (!any) continue;
      if (!best || w > best.w || (w === best.w && l < best.l)) { best = { name, w, l }; tied = false; }
      else if (w === best.w && l === best.l) tied = true;
    }
    if (best && !tied && best.w > 0) weeklyWinners[String(wk)] = best.name;
  }

  for (const name of names) {
    const byType = {};
    let W = 0, L = 0, P = 0;
    for (const bt of BET_TYPES_ORDER) {
      const src = byMember[name]?.[bt] || {};
      const picks = {};
      let w = 0, l = 0, t = 0;
      for (const wk of Object.keys(src)) {
        picks[wk] = src[wk];
        if (src[wk].result === "W") w++;
        else if (src[wk].result === "L") l++;
        else if (src[wk].result === "P") t++;
      }
      byType[bt] = { record: `${w}-${l}${t ? "-" + t : ""}`, picks };
      W += w; L += l; P += t;
    }
    if (!DATA.members[name]) DATA.members[name] = {};
    DATA.members[name]["2026"] = { seasonRecord: `${W}-${L}${P ? "-" + P : ""}`, byType };
  }
  DATA.seasons["2026"] = { members: names, weeklyWinners, live: true };
}

function initials(name) {
  if (!name) return "-";
  const parts = String(name).trim().split(/\s+/);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
}

function parseRecord(rec) {
  if (!rec) return { w: 0, l: 0, t: 0 };
  const parts = rec.split("-").map(s => parseInt(s.trim(), 10) || 0);
  return { w: parts[0] || 0, l: parts[1] || 0, t: parts[2] || 0 };
}
function pct(rec) {
  const tot = rec.w + rec.l;
  return tot ? ((rec.w / tot) * 100).toFixed(1) : "-";
}
function recordHtml(rec) {
  return `<span class="rec-W">${rec.w}</span>-<span class="rec-L">${rec.l}</span>${rec.t ? '-<span class="rec-T">' + rec.t + '</span>' : ''}`;
}
function recordHtmlFromString(s) {
  return recordHtml(parseRecord(s));
}

function buildStandings(season) {
  const seasonInfo = DATA.seasons[season];
  if (!seasonInfo) return [];
  const rows = [];
  for (const name of seasonInfo.members) {
    const md = DATA.members[name]?.[season];
    if (!md) continue;
    const seasonRec = parseRecord(md.seasonRecord);
    let weeksWon = 0;
    for (let w = 1; w <= WEEK_COUNT; w++) {
      if (seasonInfo.weeklyWinners?.[String(w)] === name) weeksWon++;
    }
    const superRec = parseRecord(md.byType?.["Super Lock"]?.record);
    rows.push({ name, md, seasonRec, weeksWon, superRec });
  }
  rows.sort((a, b) => {
    if (b.seasonRec.w !== a.seasonRec.w) return b.seasonRec.w - a.seasonRec.w;
    if (a.seasonRec.l !== b.seasonRec.l) return a.seasonRec.l - b.seasonRec.l;
    return b.weeksWon - a.weeksWon;
  });
  return rows;
}

// --- Ticker ---
function buildTickerItems(season, weekFilter) {
  const items = [];
  const seasonInfo = DATA.seasons[season];
  if (!seasonInfo) return items;
  const weeks = weekFilter === "ALL"
    ? Array.from({ length: WEEK_COUNT }, (_, i) => i + 1)
    : [parseInt(weekFilter, 10)];

  for (const wk of weeks) {
    for (const name of seasonInfo.members) {
      const md = DATA.members[name]?.[season];
      if (!md) continue;
      for (const bt of BET_TYPES_ORDER) {
        const pick = md.byType?.[bt]?.picks?.[String(wk)] || md.byType?.[bt]?.picks?.[wk];
        if (!pick || (!pick.text && !pick.result)) continue;
        items.push({ wk, name, bt, text: pick.text || "-", result: pick.result || "" });
      }
    }
  }
  return items;
}

function btShort(bt) {
  return ({ "Favorite": "FAV", "Dog": "DOG", "Over": "OVR", "Under": "UND", "Super Lock": "SUPER" })[bt] || bt;
}
function btClass(bt) {
  return ({ "Favorite": "fav", "Dog": "dog", "Over": "over", "Under": "under", "Super Lock": "super" })[bt] || "";
}

function renderTickerItem(it) {
  const safe = escapeHtml(it.text);
  return `<span class="tk-item">
    <span class="tk-wk">WK${String(it.wk).padStart(2,"0")}</span>
    <span class="tk-name" style="color:${memberColor(it.name)}">${escapeHtml(it.name)}</span>
    <span class="tk-type ${btClass(it.bt)}">${btShort(it.bt)}</span>
    <span class="tk-pick">${safe}</span>
    ${it.result ? `<span class="tk-res ${it.result}">${it.result}</span>` : ""}
  </span>`;
}

function renderTicker() {
  const track = document.getElementById("ticker-track");
  // Rebuilding the marquee restarts its animation and re-creates ~1400 nodes,
  // so skip unless the season / week filter / data actually changed.
  const key = `${state.season}|${state.tickerWeek}|${DATA_VERSION}`;
  if (renderTicker._key === key) return;
  renderTicker._key = key;
  const items = buildTickerItems(state.season, state.tickerWeek);

  if (!items.length) {
    track.innerHTML = `<span class="tk-item"><span class="tk-wk">NO PICKS</span></span>`;
    track.style.setProperty("--marquee-duration", "60s");
    return;
  }
  const html = items.map(renderTickerItem).join("");
  track.innerHTML = html + html;
  const seconds = state.tickerWeek === "ALL"
    ? Math.max(80, items.length * 2.6)
    : Math.max(60, items.length * 2.2);
  track.style.setProperty("--marquee-duration", seconds + "s");
}

function renderTickerWeekSelect() {
  const sel = document.getElementById("ticker-week-select");
  if (!sel.dataset.built) {
    sel.innerHTML = `<option value="ALL">ALL</option>` +
      Array.from({ length: WEEK_COUNT }, (_, i) =>
        `<option value="${i + 1}">${String(i + 1).padStart(2,"0")}</option>`
      ).join("");
    sel.onchange = () => { state.tickerWeek = sel.value; renderTicker(); };
    sel.dataset.built = "1";
  }
  sel.value = state.tickerWeek;
}

function syncNavActive() {
  document.querySelectorAll(".nav-link").forEach(b => {
    b.classList.toggle("active", b.dataset.view === state.view);
  });
}

// Season stat tiles: units leader, hottest streak, best bet type, Super Lock king.
function computeSeasonStats(season) {
  const info = DATA.seasons[season];
  if (!info) return null;
  let unitsLeader = null, streakLeader = null, superKing = null;
  const btAgg = {};
  for (const name of info.members) {
    const md = DATA.members[name]?.[season];
    if (!md) continue;
    let W = 0, L = 0, cur = 0, best = 0;
    for (let wk = 1; wk <= WEEK_COUNT; wk++) {
      for (const bt of BET_TYPES_ORDER) {
        const res = md.byType?.[bt]?.picks?.[wk]?.result;
        if (!res) continue;
        const a = btAgg[bt] || (btAgg[bt] = { W: 0, L: 0 });
        if (res === "W") { W++; a.W++; cur++; if (cur > best) best = cur; }
        else if (res === "L") { L++; a.L++; cur = 0; }
        // pushes neither extend nor break a streak
      }
    }
    const units = W - 1.1 * L;
    if ((W + L) && (!unitsLeader || units > unitsLeader.units)) unitsLeader = { name, units };
    if (!streakLeader || best > streakLeader.len) streakLeader = { name, len: best };
    const sr = parseRecord(md.byType?.["Super Lock"]?.record);
    const sTot = sr.w + sr.l;
    if (sTot) {
      const sPct = sr.w / sTot;
      if (!superKing || sPct > superKing.pct || (sPct === superKing.pct && sr.w > superKing.rec.w)) {
        superKing = { name, rec: sr, pct: sPct };
      }
    }
  }
  let bestBt = null;
  for (const [bt, a] of Object.entries(btAgg)) {
    const tot = a.W + a.L;
    if (!tot) continue;
    const p = a.W / tot;
    if (!bestBt || p > bestBt.pct) bestBt = { bt, pct: p, rec: a };
  }
  if (!unitsLeader && !bestBt && !streakLeader?.len && !superKing) return null;
  return { unitsLeader, bestBt, streakLeader, superKing };
}

function statTile(icon, label, value, sub, valueStyle = "") {
  return `
    <div class="glass-card p-4 rounded-lg flex flex-col gap-1 min-w-0">
      <div class="flex items-center gap-2 text-on-surface-variant">
        <span class="material-symbols-outlined text-base text-primary-fixed">${icon}</span>

function renderSeasonStatTiles(season) {
  const st = computeSeasonStats(season);
  if (!st) return "";
  const tiles = [];
  if (st.unitsLeader) {
    tiles.push(statTile("payments", "Units Leader", escapeHtml(st.unitsLeader.name),
      `${fmtUnits(st.unitsLeader.units)} u at −110`, `style="color:${memberColor(st.unitsLeader.name)}"`));
  }
  if (st.streakLeader?.len) {
    tiles.push(statTile("local_fire_department", "Hot Streak", escapeHtml(st.streakLeader.name),
      `${st.streakLeader.len} straight wins`, `style="color:${memberColor(st.streakLeader.name)}"`));
  }
  if (st.bestBt) {
    tiles.push(statTile("query_stats", "Best Bet Type", btShort(st.bestBt.bt),
      `${(st.bestBt.pct * 100).toFixed(1)}% · ${st.bestBt.rec.W}-${st.bestBt.rec.L} league-wide`));
  }
  if (st.superKing) {
    tiles.push(statTile("lock", "Super Lock King", escapeHtml(st.superKing.name),
      `${st.superKing.rec.w}-${st.superKing.rec.l}${st.superKing.rec.t ? "-" + st.superKing.rec.t : ""} on Super Locks`,
      `style="color:${memberColor(st.superKing.name)}"`));
  }
  if (!tiles.length) return "";
  return `<section class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-stack-lg">${tiles.join("")}</section>`;
}

function renderMemberRow(r, i, season) {
  const isExp = state.expanded === r.name;
  const isTop = i === 0;
  // Per-week outcome class: green if member won the week, W/L/P majority
  // otherwise, gray when nothing is graded yet.
  const heatCls = Array.from({ length: WEEK_COUNT }, (_, w) => {
    const wk = w + 1;
    const winner = DATA.seasons[season]?.weeklyWinners?.[String(wk)];
    const totalPicksThisWeek = BET_TYPES_ORDER.filter(bt => r.md?.byType?.[bt]?.picks?.[wk]).length;
    if (!totalPicksThisWeek) return "";
    if (winner === r.name) return "W";
    let wins = 0, losses = 0, graded = 0;
    for (const bt of BET_TYPES_ORDER) {
      const res = r.md?.byType?.[bt]?.picks?.[wk]?.result;
      if (res === "W") wins++;
      else if (res === "L") losses++;
      if (res) graded++;
    }
    if (!graded) return ""; // picks in, nothing graded yet
    if (wins > losses) return "W";
    if (losses > wins) return "L";
    return "P";
  });
  const heat = heatCls.map(c => `<div class="heat-cell ${c}"></div>`).join("");
  const heatMini = heatCls.map(c => `<div class="heat-dot ${c}"></div>`).join("");

  return `
    <tr class="member-row border-b border-outline-variant hover:bg-primary-fixed/5 transition-colors cursor-pointer group ${isExp ? "bg-primary-fixed/[0.04]" : ""}" data-name="${escapeHtml(r.name)}">
      <td class="px-4 md:px-6 py-5 ${isTop ? "text-primary-fixed font-bold" : "text-on-surface-variant font-bold"}">${i + 1}</td>
      <td class="px-4 md:px-6 py-5">
        <div class="flex items-center gap-2">
          ${memberDot(r.name)}
          <span class="font-display-lg text-base md:text-lg tracking-wide uppercase ${isTop ? "text-primary-fixed" : "text-on-surface"}">${escapeHtml(r.name)}</span>
          ${isTop ? '<span class="material-symbols-outlined text-tertiary-fixed-dim text-base" style="font-variation-settings: \'FILL\' 1;">workspace_premium</span>' : ""}
        </div>
        <div class="flex gap-[2px] mt-1.5 lg:hidden">${heatMini}</div>
      </td>
      <td class="px-4 md:px-6 py-5">${recordHtml(r.seasonRec)}</td>
      <td class="px-4 md:px-6 py-5 text-primary-fixed-dim">${pct(r.seasonRec)}${r.seasonRec.w + r.seasonRec.l ? "%" : ""}</td>
      <td class="px-4 md:px-6 py-5 hidden lg:table-cell">
        <div class="flex gap-1">${heat}</div>
      </td>
      <td class="px-4 md:px-6 py-5 text-right">
        <span class="font-display-lg text-2xl ${r.weeksWon ? "text-primary-fixed" : "text-on-surface-variant opacity-40"}">${String(r.weeksWon).padStart(2, "0")}</span>
      </td>
    </tr>
    ${isExp ? `
      <tr class="bg-surface-container-lowest/50 border-b border-outline-variant">
        <td colspan="6" class="py-5 px-3 md:px-6">${renderMemberDetail(r)}</td>
      </tr>
    ` : ""}
  `;
}

function renderMemberDetail(r) {
  const md = r.md;
  const weekHeader = Array.from({ length: WEEK_COUNT }, (_, i) =>
    `<div class="w-[26px] text-center font-data-tabular text-[9px] text-on-surface-variant">${String(i + 1).padStart(2, "0")}</div>`
  ).join("");

  const rows = BET_TYPES_ORDER.map(bt => {
    const info = md?.byType?.[bt];
    if (!info) return "";
    const cells = Array.from({ length: WEEK_COUNT }, (_, i) => {
      const wk = i + 1;
      const pick = info.picks?.[wk];
      const cls = pick?.result || "";
      const safe = (pick?.text || "").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      return `<div class="week-cell ${cls}" data-week="${wk}" data-bet="${bt}" data-text="${safe}" data-result="${pick?.result || ""}">${pick?.result || ""}</div>`;
    }).join("");
    const isSuper = bt === "Super Lock";
    return `
      <div class="flex items-center gap-4 py-1.5">
        <div class="w-24 font-label-caps text-[11px] uppercase ${isSuper ? "text-tertiary-fixed" : "text-on-surface-variant"}">${isSuper ? "Super Lock" : bt}</div>
        <div class="w-20 font-data-tabular text-[11px]">${recordHtmlFromString(info.record)}</div>
        <div class="flex gap-1">${cells}</div>
      </div>
    `;
  }).join("");

  return `
    <div class="overflow-x-auto">
      <div class="min-w-fit">
        <div class="flex items-center gap-4 py-2 border-b border-outline-variant mb-2">
          <div class="w-24 font-label-caps text-[10px] tracking-widest text-on-surface-variant uppercase">Bet Type</div>
          <div class="w-20 font-label-caps text-[10px] tracking-widest text-on-surface-variant uppercase">Record</div>
          <div class="flex gap-1">${weekHeader}</div>
        </div>
        ${rows}
        <div class="flex flex-wrap gap-6 mt-4 pt-3 border-t border-outline-variant font-data-tabular text-[11px]">
          <div><span class="text-on-surface-variant tracking-widest mr-2">SEASON</span><strong class="text-on-surface">${escapeHtml(md?.seasonRecord || "-")}</strong></div>
          <div><span class="text-on-surface-variant tracking-widest mr-2">LIFETIME</span><strong class="text-on-surface">${escapeHtml(md?.lifetimeRecord || "-")}</strong></div>
        </div>
      </div>
    </div>
  `;
}

// ---- View: Lifetime ----
function renderLifetime() {
  const members = Object.keys(DATA.members).sort();
  // Compute each season's standings once instead of once per member.
  const standingsBySeason = {};
  for (const s of SEASONS_ORDER) standingsBySeason[s] = buildStandings(s);
  const agg = members.map(name => {
    const totals = { W: 0, L: 0, P: 0 };
    const byType = {};
    let weeksWon = 0;
    let seasonsAsChamp = 0;
    let seasonsPlayed = 0;
    for (const bt of BET_TYPES_ORDER) byType[bt] = { W: 0, L: 0, P: 0 };
    for (const season of SEASONS_ORDER) {
      const md = DATA.members[name]?.[season];
      if (!md) continue;
      seasonsPlayed++;
      const winners = DATA.seasons[season]?.weeklyWinners || {};
      for (const wk of Object.keys(winners)) if (winners[wk] === name) weeksWon++;
      // A live season has no champion yet - only count finished seasons.
      if (!DATA.seasons[season]?.live && standingsBySeason[season][0]?.name === name) seasonsAsChamp++;
      for (const bt of BET_TYPES_ORDER) {
        const picks = md.byType?.[bt]?.picks || {};
        for (const wk of Object.keys(picks)) {
          const r = picks[wk]?.result;
          if (r === "W") { totals.W++; byType[bt].W++; }
          else if (r === "L") { totals.L++; byType[bt].L++; }
          else if (r === "P") { totals.P++; byType[bt].P++; }
        }
      }
    }
    // Units at -110: win = +1, loss = -1.1, push = 0
    const units = totals.W - 1.1 * totals.L;
    return { name, totals, byType, weeksWon, seasonsAsChamp, seasonsPlayed, units };
  });
  agg.sort((a, b) => b.totals.W - a.totals.W);
  const groupUnits = agg.reduce((s, m) => s + m.units, 0);

  // Find historical champions, one card per season
  const champBySeason = [];

              <div class="grid grid-cols-2 gap-4 border-t border-outline-variant pt-3">

}

async function fetchMe() {
  try {
    const r = await fetch("/api/auth?action=me", { credentials: "include" });
    if (!r.ok) return null;
    const j = await r.json();
    return j.member;
  } catch { return null; }
}
async function loginSubmit() {
  const name = document.getElementById("login-name").value;
  const pass = document.getElementById("login-pass").value;
  const err = document.getElementById("login-err");
  err.textContent = "";
  try {
    const r = await fetch("/api/auth?action=login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({ name, passphrase: pass }),
    });
    const j = await r.json();
    if (!r.ok) { err.textContent = j.error === "bad-passphrase" ? "Wrong password." : "Login failed."; return; }
    state.user = j.member;

  } catch (e) { err.textContent = "Network error: " + e.message; }

  await fetch("/api/auth?action=logout", { method: "POST", credentials: "include" }).catch(()=>{});
  state.user = null;
  live2026Promise = null; // pick visibility depends on who's signed in
  render();
}

async function changePassphrase() {
  const current = document.getElementById("acct-current").value;
  const next = document.getElementById("acct-next").value;
  const err = document.getElementById("acct-err");
  err.textContent = "";
  if (!current || !next) { err.textContent = "Both fields are required."; return; }
  if (next.length < 8) { err.textContent = "New password must be at least 8 characters."; return; }
  try {
    const r = await fetch("/api/auth?action=change-pass", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current, next }),
    });
    const j = await r.json();
    if (!r.ok) {
      err.textContent = j.error === "bad-passphrase" ? "Current password is wrong."
        : j.error === "too-short" ? "New password must be at least 8 characters."
        : "Update failed.";
      return;
    }
    document.getElementById("account-modal").classList.remove("show");
    showToast("PASSWORD UPDATED");
  } catch (e) { err.textContent = "Network error: " + e.message; }
}

// Live scores (ESPN via /api/scores) - real LIVE pills and in-game scores.
const SCORES_TTL_MS = 60 * 1000;
async function loadScores(force = false) {
  if (!force && state.liveScores && Date.now() - (state.liveScoresAt || 0) < SCORES_TTL_MS) {
    return state.liveScores;
  }
  try {
    const r = await fetch("/api/scores");
    if (r.ok) {
      const j = await r.json();
      state.liveScores = j.games || [];
      state.liveScoresAt = Date.now();
    }
  } catch {}
  return state.liveScores || [];
}
function scoreFor(g) {
  return (state.liveScores || []).find(e => sameTeamName(e.away, g.away) && sameTeamName(e.home, g.home)) || null;
}

const ODDS_CLIENT_TTL_MS = 40 * 1000; // re-fetch on view revisit after this
const ODDS_POLL_MS = 60 * 1000;       // live line refresh while the board is open
async function loadOdds(force = false) {
  // Serve from memory briefly; never cache a failure - the next visit to the
  // view retries instead of showing a stale error until reload. A forced load
  // (manual refresh) asks the server to bypass every cache and hit upstream.
  const fresh = state.thisWeekData && state.thisWeekData.source !== "error" &&
    Date.now() - (state.thisWeekFetchedAt || 0) < ODDS_CLIENT_TTL_MS;
  if (fresh && !force) return state.thisWeekData;
  try {
    const r = await fetch("/api/odds" + (force ? "?fresh=1" : ""), { credentials: "include" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    state.thisWeekData = await r.json();
    state.thisWeekFetchedAt = Date.now();
  } catch (e) {
    if (!state.thisWeekData || state.thisWeekData.source === "error") {
      state.thisWeekData = { source: "error", error: e.message, games: [] };
    }
  }
  return state.thisWeekData;
}

function fmtKickoffDay(iso) {
  const d = new Date(iso);
  return d.toLocaleString("en-US", { weekday: "short" }).toUpperCase();
}
function fmtKickoffTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString("en-US", { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
}

function americanOdds(p) {
  if (p == null) return "";
  return p > 0 ? `+${p}` : `${p}`;
}

function nextKickoffCountdown(games) {
  const now = Date.now();
  const next = games
    .map(g => new Date(g.kickoff).getTime())
    .filter(t => t > now)
    .sort((a, b) => a - b)[0];
  if (!next) return null;
  const ms = next - now;
  const days = Math.floor(ms / 86400000);
  const hrs = Math.floor((ms % 86400000) / 3600000);
  const mins = Math.floor((ms % 3600000) / 60000);
  return { days, hrs, mins };
}

// Format a spread/total number the way the picker sees it for their side.
function fmtLineForSide(side, line) {
  const n = Number(line);
  if (!Number.isFinite(n)) return "";
  if (side === "dog") return `+${Math.abs(n)}`; // dog gets points
  return `${n}`;                                // fav line (neg) or total
}

// The current live line for a locked pick, from this week's odds (same book if
// still offered, else the board's primary book).
function currentLineFor(pick) {
  const games = state.thisWeekData?.games || [];
  const g = games.find(x => `${x.away}@${x.home}` === pick.game_key);
  if (!g) return null;
  const book = g.books?.[pick.book] || g.books?.fanduel || g.books?.draftkings || Object.values(g.books || {})[0];
  if (!book) return null;
  if (pick.side === "fav" || pick.side === "dog") return book.spread?.line ?? null;
  if (pick.side === "over" || pick.side === "under") return book.total?.point ?? null;
  return null;
}

// Compare a locked pick's line to the current line. "better" = the locked line
// is more favorable to the picker than what's on the board now.
function lineMove(pick) {
  if (!pick || pick.line == null || !pick.side) return null;
  const cur = currentLineFor(pick);
  const locked = Number(pick.line);
  if (cur == null || !Number.isFinite(locked) || Number(cur) === locked) return null;
  const c = Number(cur);
  let better;
  switch (pick.side) {
    case "fav":   better = Math.abs(locked) < Math.abs(c); break; // fewer points to give
    case "dog":   better = Math.abs(locked) > Math.abs(c); break; // more points to get
    case "over":  better = locked < c; break;                     // lower bar to clear
    case "under": better = locked > c; break;                     // higher bar to hold
    default: return null;
  }
  return { better, lockedFmt: fmtLineForSide(pick.side, locked), curFmt: fmtLineForSide(pick.side, c) };
}

// Wire a single game card's pick buttons + book toggle. Called on first mount
// and again whenever a card is re-rendered in place (e.g. after a book switch).
function bindGameCard(card) {
  if (!card) return;
  card.querySelectorAll(".pick-btn[data-bet]").forEach(b => b.addEventListener("click", () => clickPickButton(b)));
  card.querySelectorAll(".book-toggle").forEach(t => t.addEventListener("click", () => switchBook(t.dataset.gameKey, t.dataset.book)));
}

function switchBook(gameKey, book) {
  const games = (state.thisWeekData && state.thisWeekData.games) || [];
  const g = games.find(x => `${x.away}@${x.home}` === gameKey);
  if (!g) return;
  const card = document.querySelector(`.game-card[data-game-key="${CSS.escape(gameKey)}"]`);
  if (!card) return;
  // Re-render the whole card for the chosen book so the team-row spreads and
  // the O/U total swap in lockstep with the pick buttons, then rebind it.
  card.outerHTML = renderGameCard(g, book);
  bindGameCard(document.querySelector(`.game-card[data-game-key="${CSS.escape(gameKey)}"]`));
  markPickedButtons(currentMyPicks);
}

function refreshMyCard() {
  const body = document.getElementById("my-card-body");
  if (body) body.innerHTML = renderMyCardBody();
  const prog = document.getElementById("mycard-progress");
  if (prog) prog.textContent = myCardProgress();
}

function bookLabel(k) {
  return ({ fanduel: "FanDuel", draftkings: "DraftKings", espn: "ESPN" })[k] || (k ? String(k).toUpperCase() : "");

function renderGameCard(g, requestedBook) {
  const gameKey = `${g.away}@${g.home}`;
  const fd = g.books?.fanduel;
  const dk = g.books?.draftkings;
  // Prefer FD, then DK, then any other book present (e.g. ESPN consensus when
  // The Odds API is unavailable) so the board never renders empty.
  const primaryBook = fd ? "fanduel" : (dk ? "draftkings" : (Object.keys(g.books || {})[0] || null));
  // The active book drives the whole card (team spreads, O/U, and the pick
  // buttons) so toggling FD/DK updates every number at once.
  const activeBook = (requestedBook && g.books?.[requestedBook]) ? requestedBook : primaryBook;
  const book = activeBook ? g.books[activeBook] : {};
  const s = book.spread;
  const t = book.total;
  const favTeam = s?.fav;
  const sc = scoreFor(g);
  const kickoff = new Date(g.kickoff).getTime();
  const isLive = sc ? sc.state === "in" : (kickoff <= Date.now() && Date.now() - kickoff < 4 * 3600 * 1000);

  const teamRow = (name) => {
    const isFav = favTeam === name;
    const spreadTxt = s ? (isFav ? `${s.line}` : `+${Math.abs(s.line)}`) : "";
    return `
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 shrink-0 flex items-center justify-center">
          ${teamLogoMark(name, 'w-full h-full', 'font-display-lg text-sm text-on-surface')}
        </div>
        <div class="min-w-0">
          <div class="font-headline-lg text-[15px] leading-none text-on-surface uppercase">${teamShort(name)}</div>
          <div class="text-[10px] text-on-surface-variant truncate leading-tight mt-0.5">${escapeHtml(name)}</div>
        </div>
        ${s ? `<span data-role="spread" data-val="${spreadTxt}" class="font-data-tabular text-[13px] ml-auto pl-2 ${isFav ? "text-on-surface" : "text-on-surface-variant"}">${spreadTxt}</span>` : ""}
      </div>`;
  };

  const bookToggle = (fd && dk) ? `
    <div class="seg">
      <button class="book-toggle ${activeBook === "fanduel" ? "on" : ""}" data-book="fanduel" data-game-key="${escapeHtml(gameKey)}">FD</button>
      <button class="book-toggle ${activeBook === "draftkings" ? "on" : ""}" data-book="draftkings" data-game-key="${escapeHtml(gameKey)}">DK</button>
    </div>`
    : `<span class="font-label-caps text-[9px] text-on-surface-variant uppercase tracking-widest">${bookLabel(activeBook)}</span>`;

  return `
    <div class="glass-card card-hover game-card p-4" data-game-key="${escapeHtml(gameKey)}" data-book="${escapeHtml(activeBook || "")}">
      <div class="flex items-center justify-between gap-2 mb-3">
        ${gameStatusPill(g)}
        ${t ? `<span data-role="ou" data-val="${t.point}" class="font-data-tabular text-[10px] text-on-surface-variant uppercase shrink-0">O/U ${t.point}</span>` : ""}
      </div>
      <div class="space-y-2 mb-3.5">
        ${teamRow(g.away)}
        ${teamRow(g.home)}
      </div>
      <div class="flex items-center justify-between mb-2">
        <span class="font-label-caps text-[9px] text-on-surface-variant uppercase tracking-widest">Pick a line</span>
        ${bookToggle}
      </div>
      <div class="grid grid-cols-4 gap-1.5 book-btns" data-game-key="${escapeHtml(gameKey)}">
        ${renderBookButtons(activeBook || "fanduel", book, g)}
      </div>
    </div>
  `;
}

function renderBookButtons(bookKey, book, game) {
  const s = book.spread;
  const t = book.total;
  const gameKey = `${game.away}@${game.home}`;
  const dogTeam = s ? (s.fav === game.home ? game.away : game.home) : null;
  const dogLine = s ? Math.abs(s.line) : null;
  // A game that has kicked off can no longer be picked (server enforces too).
  const started = game.kickoff && new Date(game.kickoff).getTime() <= Date.now();

  const btn = (bet, side, lbl, value, price, text) => started ? `
    <div class="pick-btn locked ${BET_META[bet].cls}" title="Game started, pick locked">
      <span class="pb-label">${lbl}</span>
      <span class="pb-value">${value}</span>
      <span class="pb-price">${price != null ? americanOdds(price) : ''}</span>
    </div>
  ` : `
    <div class="pick-btn ${BET_META[bet].cls}" data-bet="${bet}" data-game="${escapeHtml(gameKey)}"
         data-side="${side}" data-line="${s && (bet === 'Favorite' || bet === 'Dog') ? s.line : (t?.point ?? '')}"
         data-book="${bookKey}" data-price="${price ?? ''}" data-text="${escapeHtml(text)}">
      <span class="pb-label">${lbl}</span>
      <span class="pb-value">${value}</span>
      <span class="pb-price">${price != null ? americanOdds(price) : ''}</span>
    </div>
  `;
  const empty = (lbl) => `<div class="pick-btn opacity-30 cursor-not-allowed"><span class="pb-label">${lbl}</span><span class="pb-value">-</span><span class="pb-price"></span></div>`;

  return `
    ${s ? btn('Favorite', 'fav', 'Fav', `${s.line}`, s.favPrice, `${s.fav} ${s.line}`) : empty('Fav')}
    ${s ? btn('Dog', 'dog', 'Dog', `+${dogLine}`, s.dogPrice, `${dogTeam} +${dogLine}`) : empty('Dog')}
    ${t ? btn('Over', 'over', 'Over', `${t.point}`, t.overPrice, `${game.away} / ${game.home} O${t.point}`) : empty('Over')}
    ${t ? btn('Under', 'under', 'Under', `${t.point}`, t.underPrice, `${game.away} / ${game.home} U${t.point}`) : empty('Under')}
  `;
}

function showToast(msg, kind = "ok") {
  const el = document.getElementById("toast");
  if (!el) return;
  el.className = "toast " + (kind === "err" ? "err" : kind === "warn" ? "warn" : "") + " show";
  el.textContent = msg;
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 2800);
}

function markPickedButtons(picksByBetType) {
  const buttons = document.querySelectorAll(".pick-btn[data-bet]");
  buttons.forEach(b => b.classList.remove("picked"));
  if (!picksByBetType) return;
  for (const [bt, pick] of Object.entries(picksByBetType)) {
    if (!pick.game_key) continue;
    const match = document.querySelector(
      `.pick-btn[data-bet="${bt}"][data-game="${pick.game_key}"][data-side="${pick.side}"][data-book="${pick.book}"]`
    );
    if (match) match.classList.add("picked");
  }
}

async function clickPickButton(btn) {
  if (!state.user) {
    showToast("SIGN IN TO PICK", "warn");
    openLogin();
    return;
  }
  const bet_type = btn.dataset.bet;
  const game_key = btn.dataset.game;
  const side = btn.dataset.side;
  const line = btn.dataset.line ? Number(btn.dataset.line) : null;
  const book = btn.dataset.book;
  const price = btn.dataset.price ? Number(btn.dataset.price) : null;
  const pick_text = btn.dataset.text;
  const cur = currentNflWeekClient();
  const season = 2026;
  const week = state.myPicksWeek || cur.week || 1;

  // Clicking the pick you already have selected removes it from your card.
  if (btn.classList.contains("picked")) return unpick(btn, bet_type, season, week);

  btn.classList.add("saving");
  try {
    const r = await fetch("/api/picks", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ season, week, picks: [{ bet_type, pick_text, game_key, side, line, book, price }] }),
    });
    const j = await r.json();
    if (!r.ok) {
      showToast(j.error === "locked" ? "PICKS LOCKED FOR THIS WEEK"
        : j.error === "game-started" ? "GAME STARTED, PICK LOCKED"
        : "ERROR: " + (j.error || "unknown"), "err");
    } else {
      document.querySelectorAll(`.pick-btn[data-bet="${bet_type}"]`).forEach(b => b.classList.remove("picked"));
      btn.classList.add("picked");
      currentMyPicks[bet_type] = { pick_text, game_key, side, book, line, price };
      refreshMyCard();
      showToast(`LOCKED ${BET_META[bet_type].short}: ${pick_text}`);
    }
  } catch (e) {
    showToast("NETWORK ERROR", "err");
  } finally {
    btn.classList.remove("saving");
  }
}

async function unpick(btn, bet_type, season, week) {
  btn.classList.add("saving");
  try {
    const r = await fetch("/api/picks?action=remove", {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ season, week, bet_type }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      showToast(j.error === "locked" ? "PICKS LOCKED FOR THIS WEEK" : "ERROR: " + (j.error || "unknown"), "err");
    } else {
      btn.classList.remove("picked");
      delete currentMyPicks[bet_type];
      refreshMyCard();
      showToast(`REMOVED ${BET_META[bet_type].short}`, "warn");
    }
  } catch (e) {
    showToast("NETWORK ERROR", "err");
  } finally {
    btn.classList.remove("saving");
  }
}

// =================== My Picks ===================
function currentNflWeekClient() {
  // Week 1 starts Tue Sept 8 2026, 08:00 UTC - mirrors lib/nfl.js so client
  // and server agree on week boundaries (MNF stays in its own week).
  const week1Start = Date.UTC(2026, 8, 8, 8);
  const now = Date.now();
  if (now < week1Start) return { season: null, week: null };
  const wk = Math.floor((now - week1Start) / (7 * 24 * 3600 * 1000));
  if (wk >= 18) return { season: 2026, week: 18 };
  return { season: 2026, week: wk + 1 };
}

async function loadMyPicks(season, week) {
  try {
    const r = await fetch(`/api/picks?season=${season}&week=${week}`, { credentials: "include" });
    if (!r.ok) return {};
    const j = await r.json();
    // Who's-in counts come along for the ride (no pick contents, just counts).
    state.whosIn = { week, list: j.submitted || [] };
    if (!state.user) return {};
    const mine = {};
    for (const p of j.picks || []) {
      if (p.member_id === state.user.id) mine[p.bet_type] = p;
    }
    return mine;
  } catch { return {}; }
}

// get re-rendered, with a brief flash + direction caret on the number that
// changed, so early-week and Sunday pickers always see the current line.

  clearInterval(oddsTimer);

      if (!r.ok) return;
      next = await r.json();

    applyLiveOdds(prev, next);

const gameKeyOf = g => `${g.away}@${g.home}`;
function shownBookFor(gameKey, g) {
  const card = document.querySelector(`.game-card[data-game-key="${CSS.escape(gameKey)}"]`);
  const active = card?.dataset.book;
  if (active && g.books?.[active]) return active;
  return g.books?.fanduel ? "fanduel" : (g.books?.draftkings ? "draftkings" : (Object.keys(g.books || {})[0] || null));
}

function applyLiveOdds(prev, next) {
  state.thisWeekData = next;
  state.thisWeekFetchedAt = Date.now();
  updateBoardStatus(next);

  const oldByKey = new Map((prev?.games || []).map(g => [gameKeyOf(g), g]));
  const newGames = next.games || [];
  // If the slate itself changed (games added/removed), rebuild the board section.
  const sameSlate = newGames.length === oldByKey.size && newGames.every(g => oldByKey.has(gameKeyOf(g)));
  if (!sameSlate) { render(); return; }

  let touched = false;
  for (const g of newGames) {
    const key = gameKeyOf(g);
    const prevG = oldByKey.get(key);
    const bk = shownBookFor(key, g);
    if (!bk) continue;
    const nb = g.books?.[bk], pb = prevG?.books?.[bk];
    if (!nb || !pb) continue;

    const spreadMoved = nb.spread && pb.spread && nb.spread.line !== pb.spread.line;
    const totalMoved = nb.total && pb.total && nb.total.point !== pb.total.point;
    const priceMoved =
      (nb.spread && pb.spread && (nb.spread.favPrice !== pb.spread.favPrice || nb.spread.dogPrice !== pb.spread.dogPrice)) ||
      (nb.total && pb.total && (nb.total.overPrice !== pb.total.overPrice || nb.total.underPrice !== pb.total.underPrice));
    if (!spreadMoved && !totalMoved && !priceMoved) continue;

    const card = document.querySelector(`.game-card[data-game-key="${CSS.escape(key)}"]`);
    // Don't yank a card out from under someone actively using it; catch it next cycle.
    if (!card || card.matches(":hover") || card.contains(document.activeElement)) continue;

    const spreadDir = spreadMoved ? Math.sign(Math.abs(nb.spread.line) - Math.abs(pb.spread.line)) : 0;
    const totalDir = totalMoved ? Math.sign(nb.total.point - pb.total.point) : 0;

    card.outerHTML = renderGameCard(g, bk);
    const fresh = document.querySelector(`.game-card[data-game-key="${CSS.escape(key)}"]`);
    bindGameCard(fresh);
    flashMoves(fresh, { spreadMoved, spreadDir, totalMoved, totalDir, priceMoved });
    touched = true;
  }
  if (touched) {
    markPickedButtons(currentMyPicks);
    refreshMyCard(); // keep My Card's line-moved indicators current
  }
}

function flashMoves(card, { spreadMoved, spreadDir, totalMoved, totalDir, priceMoved }) {
  if (!card) return;
  const caret = dir => (dir > 0 ? '<span class="move-caret up">▲</span>' : dir < 0 ? '<span class="move-caret down">▼</span>' : "");
  if (spreadMoved) card.querySelectorAll('[data-role="spread"]').forEach(el => {
    el.classList.add("line-flash");
    el.insertAdjacentHTML("beforeend", caret(spreadDir));
  });
  if (totalMoved) card.querySelectorAll('[data-role="ou"]').forEach(el => {
    el.classList.add("line-flash");
    el.insertAdjacentHTML("beforeend", caret(totalDir));
  });
  if (priceMoved && !spreadMoved && !totalMoved) {
    card.querySelectorAll(".pick-btn[data-bet]").forEach(el => el.classList.add("line-flash"));
  }
}

function attachStandingsHandlers() {
  document.querySelectorAll(".member-row").forEach(row => {
    row.addEventListener("click", () => {
      const name = row.dataset.name;
      state.expanded = state.expanded === name ? null : name;
      render();
    });
  });
  const tt = document.getElementById("tooltip");
  const fillTooltip = (cell) => {
    const wk = cell.dataset.week;
    const bet = cell.dataset.bet;
    const text = cell.dataset.text;
    const result = cell.dataset.result;
    if (!text && !result) return false;
    tt.innerHTML = `
      <div class="tt-meta">${bet} · WEEK ${String(wk).padStart(2,"0")}</div>
      <div class="tt-pick">${escapeHtml(text || "-")}</div>
      ${result ? `<span class="tt-result ${result}">${ {W:"WIN",L:"LOSS",P:"PUSH"}[result] }</span>` : ""}
    `;
    return true;
  };
  document.querySelectorAll(".week-cell").forEach(cell => {
    cell.addEventListener("mouseenter", () => {
      if (tt._pin) return;
      if (fillTooltip(cell)) tt.classList.add("show");
    });
    cell.addEventListener("mousemove", (e) => {
      if (tt._pin) return;
      const pad = 14;
      let x = e.clientX + pad, y = e.clientY + pad;
      const r = tt.getBoundingClientRect();
      if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - pad;
      if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - pad;
      tt.style.left = x + "px"; tt.style.top = y + "px";
    });
    cell.addEventListener("mouseleave", () => { if (!tt._pin) tt.classList.remove("show"); });
    // Tap-to-toggle for touch screens: pin the tooltip under the cell,
    // tap again (or anywhere else) to dismiss.
    cell.addEventListener("click", (e) => {
      e.stopPropagation();
      if (tt._pin === cell) { tt._pin = null; tt.classList.remove("show"); return; }
      if (!fillTooltip(cell)) { tt._pin = null; tt.classList.remove("show"); return; }
      tt._pin = cell;
      tt.classList.add("show");
      const cr = cell.getBoundingClientRect();
      const r = tt.getBoundingClientRect();
      let x = cr.left, y = cr.bottom + 8;
      if (x + r.width > window.innerWidth - 8) x = window.innerWidth - r.width - 8;
      if (y + r.height > window.innerHeight - 8) y = cr.top - r.height - 8;
      tt.style.left = Math.max(8, x) + "px"; tt.style.top = Math.max(8, y) + "px";
    });
  });
  if (!attachStandingsHandlers._dismissBound) {
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".week-cell")) { tt._pin = null; tt.classList.remove("show"); }
    });
    attachStandingsHandlers._dismissBound = true;
  }
}

})().catch(err => {
  document.getElementById("root").innerHTML = `<div class="text-live-red p-6">Failed to load data: ${err.message}</div>`;
});
</script>

</body>
</html>
